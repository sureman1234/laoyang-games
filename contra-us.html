<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>魂斗罗 · 模拟器版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"Courier New",monospace}
:root{
  --sa-top:env(safe-area-inset-top,0px);
  --sa-right:env(safe-area-inset-right,0px);
  --sa-bottom:env(safe-area-inset-bottom,0px);
  --sa-left:env(safe-area-inset-left,0px);
}
/* 全屏 + 横屏：wrap 永远是「逻辑横屏尺寸」(LW × LH)。
   R90（CSS 顺时针转 90°）用于不支持 screen.orientation.lock 的设备。
   两个坑：① 居中必须用 rotate 之前的逻辑尺寸算；
          ② 触摸坐标要反变换（见 toLocal），否则摇杆方向整体歪 90°。 */
#wrap{position:fixed;left:50%;top:50%;width:100%;height:100%;
  transform:translate(-50%,-50%);background:#000;overflow:hidden}
#wrap.r90{transform:translate(-50%,-50%) rotate(90deg)}
#game{position:absolute;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;
  background:#000;touch-action:none}
/* ---------- 透明触摸区：屏幕上不出现任何按键 / 摇杆 ----------
   （第十七轮起：四个兜底键是右上角的真实按钮，右半屏不画任何线 —— 见 #syskeys。） */
#padL{position:absolute;left:0;top:0;width:50%;height:100%;z-index:9;touch-action:none}
#padR{position:absolute;left:50%;top:0;width:50%;height:100%;z-index:9;touch-action:none}
/* （第十七轮删除：#dz 菱形示意层与四角「连b/连a/单b/单a」标注已废弃 ——
   兜底键改成右上角四个**真实按钮**，不再在右半屏画任何分区线。见 #syskeys。） */
#topbar{position:absolute;top:0;left:0;right:0;z-index:12;display:flex;justify-content:space-between;padding:0}
#topbar .tbtn{background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);color:#fff;
  padding:5px 12px;border-radius:6px;font-size:13px;letter-spacing:1px;
  white-space:nowrap;flex:0 0 auto}   /* 8 个按钮（声音/重置/A开关/B开关/键位/SELECT/START/暂停）横排，不许被压缩换行 */
/* A / B 键的「单发 ↔ 连发」开关（第十九轮按老杨要求恢复）：窄一点好排，连发时高亮成红，
   一眼看出当前模式。管的是**常规手势那条通路**（右半屏按住 / 跳跃 / 键盘 J、K），
   右上角四个圆钮照旧各按各的，不受它影响。 */
#topbar .tbtn.tgl{padding:5px 9px;font-size:12px;letter-spacing:0;text-align:center;min-width:50px}
#topbar .tbtn.tgl.on{background:rgba(229,57,53,.6);border-color:rgba(255,140,135,.85)}
/* ★「隐藏 / 显示四个功能键」胶囊（第二十轮，老杨要求）：
   一按收起右上角四个圆钮、再按叫回来。窄版排得下；隐藏态这颗胶囊变暗 ——
   四个钮本身看不见了，就靠这颗胶囊的状态一眼看出「是被收起来了」还是「本来就没有」。 */
#topbar .tbtn.mini{padding:5px 9px;font-size:12px;letter-spacing:0;text-align:center;min-width:50px}
#topbar .tbtn.off{opacity:.5}
/* ---------- 右上角功能键（老杨 2026-10-09 第十七轮定稿，第十八轮调排布）----------
   四个按钮铺在右上角，两列两行、**间距拉开**（上一版老杨嫌太集中）：
     上排 = 红（连发）：左 B、右 A
     下排 = 黑（单发）：左 B、右 A      ← 红上黑下，行内按 B、A 顺序横排
   键面只写大写字母 —— **红 = 连发、黑 = 单发**（老杨：不用再标「连、单」二字）。
   「A 黑」（单发 A）＝ 纯电平按住 ＝ 原来的红色实体 A 钮（跳 / 确认 / 进关卡 / 长按跳高）——
   老杨拍板：红 A 钮与它重复，取消红钮，功能并到这里。
   START / SELECT 已挪到顶栏，和「↺ 重置」同款小胶囊。
   当实心圆钮用（有按下高亮），所以必须吃掉自己的触摸事件、压在最上层
   （z-index 20 > padR 的 9），否则会被右半屏触摸区吞掉。 */
#syskeys{position:absolute;inset:0;z-index:20;
  pointer-events:none}          /* 容器本身不吃事件，只有钮吃 */
/* 四个钮**各自绝对定位**（left/top 写的是中心点，靠 translate 拉回来）——
   第十九轮起老杨可以在暂停状态里逐个拖到自己顺手的位置，位置记在 localStorage。
   注意：所有 transform 都必须带着 translate(-50%,-50%)，否则 :active 的 scale 会把定位顶掉。 */
#syskeys .fkey{position:absolute;pointer-events:auto;touch-action:none;cursor:pointer;
  -webkit-user-select:none;user-select:none;
  display:flex;align-items:center;justify-content:center;border-radius:50%;
  background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5);
  color:#fff;font-weight:bold;letter-spacing:.5px;
  transform:translate(-50%,-50%);
  transition:background .08s ease,transform .08s ease}
#syskeys .fkey:active,#syskeys .fkey.on{background:rgba(124,243,255,.42);
  border-color:#7cf3ff;transform:translate(-50%,-50%) scale(.94)}
/* 「连发」键 = 红底红边；按下再亮一档。连发相位独立、松手即复位，绝不空转。 */
#syskeys .fkey.rep{background:rgba(229,57,53,.5);border-color:rgba(255,140,135,.85)}
#syskeys .fkey.rep:active,#syskeys .fkey.rep.on{background:rgba(229,57,53,.95);
  border-color:#ff9a95;transform:translate(-50%,-50%) scale(.94)}
/* 暂停 = 进入「调位置」态（老杨 2026-10-09 第十九轮）：
   四个钮变成虚线半透明，拖到哪算哪；拖动期间不触发按键（cornerDown 里有 paused 守卫）。 */
#syskeys.edit .fkey{border-style:dashed;border-color:rgba(124,243,255,.9);
  background:rgba(0,0,0,.35)}
#syskeys.edit .fkey.rep{border-color:rgba(255,140,135,.95);background:rgba(229,57,53,.3)}
#syskeys .fkey.dragging{transform:translate(-50%,-50%) scale(1.14);z-index:3}
/* ★ 选中态（第二十六轮）：编辑态里轻点一下钮 = 选中它，套一圈金色实线 + 外发光；
   再轻点一下取消。选中谁，底部那条大控制条就改谁的大小。 */
#syskeys.edit .fkey.sel{border-style:solid;border-color:#ffeb50;
  box-shadow:0 0 0 3px rgba(255,235,80,.35),0 0 18px rgba(255,235,80,.5)}
/* ★ 隐藏态（第二十轮）：顶栏「◱ 隐藏键」一按，四个钮整个收起来 —— 看得见的只剩游戏画面。
   隐藏期间所有按键状态同步清空（见 applyKeysVis），绝不会留下「看不见却按着」的幻影键。 */
#syskeys.hid{display:none}
/* ============ 调整键（编辑态）的界面 —— 第二十七轮重做（老杨 2026-10-10）============
   原话：「按下调整键后调整按钮的时候界面风格改一下，大一点便于操作，按钮布局也好好排布一下，
   便于操作，参照用极简幽默大白话提示玩家风格」。定下的四条口径：
     · 手指友好档：操作块够大够宽（高 clamp(48px,8.4vmin,68px)），尺寸全随屏幕缩放。
     · 文案走极简幽默大白话：「点一个键，给它「长个儿」」。
     · 控制条**沉底整行铺开**（原来是个居中窄胶囊），一块就是一块，闭着眼也点得准；
       上面一行读数「在改：黑 A · 68px」，下面一排大块。
   ⚠️ 三条都别用 >1px 的实体投影：本页风格是「黑底 + 细彩边 + 硬阴影」，别加高斯糊。

   ★ 第二十八轮修订（老杨三条）：
     ① 「✥ 复位」**并进最下一排**（原来钉在屏幕右上角，老杨「找不见了」）；第二十九轮又补一刀：
     「↺ 默认」块删掉，这一排只剩「⊖ 小点 / ⊕ 大点 / ✥ 复位」三块，文案也由「归零」改回「复位」（老杨定的）；
     ② 顶部那条红色说明条**整条删掉**（文案并入读数行，屏幕上少一层）；
     ③ 暂停中点画面不再退出编辑态（见 cv 的 pointerdown）。 */
/* ★ 大控制条（第二十七轮重做，原先那条「减/加/复位」小胶囊的继承者）：
   一整行贴底铺开，等宽分块（第二十九轮起是「⊖ 小点 / ⊕ 大点 / ✥ 复位」三块）；
   一档 ≈ 默认直径的 8%，范围 0.6×~1.6×。 */
#sizeBar{position:absolute;z-index:32;left:0;right:0;bottom:0;
  display:none;flex-direction:column;align-items:stretch;gap:clamp(5px,1vmin,9px);
  padding:clamp(8px,1.6vmin,14px) clamp(10px,2.2vmin,20px) clamp(10px,2vmin,16px);
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.82) 34%,rgba(0,0,0,.92) 100%);
  -webkit-user-select:none;user-select:none}
#sizeBar.on{display:flex}
/* 未选中任何钮：整条压暗、读数改成「先点一个键」，三个尺寸块也按不动
   （视觉上一眼看出要先选）；「✥ 复位」是全局操作，不受影响、始终能按。 */
#sizeBar.idle{opacity:.55}
#sizeBar .sbVal{text-align:center;color:#ffeb50;font-weight:bold;letter-spacing:1px;
  font-size:clamp(14px,2.6vmin,20px);white-space:nowrap;text-shadow:0 0 10px rgba(255,235,80,.35)}
#sizeBar .sbRow{display:flex;align-items:stretch;gap:clamp(7px,1.5vmin,14px)}
#sizeBar .sbBtn{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;
  gap:clamp(4px,1vmin,9px);text-align:center;
  height:clamp(48px,8.4vmin,68px);border-radius:12px;
  background:rgba(255,235,80,.15);border:2px solid rgba(255,235,80,.62);color:#ffeb50;
  font-weight:bold;letter-spacing:2px;font-size:clamp(14px,3.3vmin,25px);
  cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
#sizeBar .sbBtn .sbIco{font-weight:bold;font-size:1.15em;line-height:1}
#sizeBar .sbBtn:active{background:rgba(255,235,80,.48);color:#1a1400}
#sizeBar.idle .sbBtn{pointer-events:none;border-color:rgba(255,235,80,.35);color:rgba(255,235,80,.7)}
/* 「✥ 复位」（第二十八轮从屏幕右上角搬下来跟尺寸块并排；第二十九轮把「默认」块删掉，
   这一排只剩三块：⊖ 小点 / ⊕ 大点 / ✥ 复位 —— 尺寸还原交给「复位」一起管）。
   全局操作，不受 .idle 压暗与 pointer-events:none 影响 —— 没选中钮时也照样能按。 */
#sizeBar .sbReset{background:rgba(255,120,120,.14);border-color:rgba(255,120,120,.66);color:#ff9a9a}
#sizeBar .sbReset:active{background:rgba(255,120,120,.46);color:#2a0606}
/* 开场大字提示卡（第二十二轮，老杨：居中、大、醒目、跟游戏一个味儿）：
   黑底红框的 FC 街机风，标题红色硬阴影，扣在屏幕正中。**不自动消失** —— 点一下屏幕才开始打。
   pointer-events:none 照旧 —— 绝不能吃掉触摸事件，卡下面的摇杆 / 按键区还得能按。 */
#hint{position:absolute;z-index:25;pointer-events:none;
  left:50%;top:50%;transform:translate(-50%,-50%);
  width:max-content;max-width:min(94vw,640px);
  background:rgba(0,0,0,.86);border:3px solid #e53935;border-radius:4px;
  box-shadow:0 0 0 2px #000,0 0 26px rgba(229,57,53,.5),0 12px 40px rgba(0,0,0,.85);
  color:#fff;text-align:center;padding:18px 30px 14px;
  font-size:clamp(14px,3.1vmin,23px);line-height:1.72;letter-spacing:1px;
  transition:opacity .3s ease;opacity:1;
  animation:hintIn .26s ease-out}   /* 入场轻轻推一下，够醒目又不晃眼 */
@keyframes hintIn{from{opacity:0;transform:translate(-50%,-50%) scale(.9)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
#hint.dim{opacity:0}
#hint .hTitle{font-size:clamp(26px,6.4vmin,52px);font-weight:bold;letter-spacing:8px;
  color:#e53935;text-shadow:3px 3px 0 #7f0000,0 0 22px rgba(229,57,53,.6);
  margin:2px 0 15px}
#hint .hRow{margin:5px 0;white-space:nowrap}
#hint .hKey{color:#ffeb50;font-weight:bold}
#hint .hVal{color:#7cf3ff}
#hint .hGo{margin-top:11px;font-size:.8em;letter-spacing:4px;color:#ffeb50;
  animation:hintBlink 1.3s ease-in-out infinite}
@keyframes hintBlink{0%,100%{opacity:.4}50%{opacity:1}}
/* （第二十一轮删除：底部那个「3 秒淡出的黄色诊断小字」整套 —— 老杨 2026-10-09
   「游戏页面底下一闪一闪出来的提示框也不要了吧，这个是测试用的吧」。
   它本来就只是排查手势判定的临时可视化，功能早已稳定，留着白闪画面。） */
#rotate{position:absolute;inset:0;z-index:30;background:#000;display:none;align-items:center;
  justify-content:center;color:#fff;font-size:16px;text-align:center;line-height:2}
/* （第十九轮删除：启动展示页 #boot 整套样式 —— 老杨要求「精简，直接进游戏界面」，
   点一下才开局的那一页连同它的动画、文案一并去掉，页面加载完即进游戏。） */
#ldg{position:absolute;inset:0;z-index:50;background:#000;display:flex;align-items:center;
  justify-content:center;color:#ffeb50;font-size:14px;letter-spacing:3px}
#ldg.gone{display:none}
#err{position:absolute;inset:0;z-index:60;background:#000;display:none;flex-direction:column;
  align-items:center;justify-content:center;color:#ff6b6b;font-size:13px;padding:24px;
  line-height:1.9;text-align:center;white-space:pre-wrap}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <!-- 顶栏 = 设置 + 系统键 + 两个「单发/连发」开关。
       第十九轮按老杨要求把「A·单发 / B·单发」两个开关恢复回来（第十八轮删过）：
       它们只管**常规手势**那条通路（右半屏按住 / 跳跃 / 键盘 J、K）走电平还是 30Hz 连发；
       右上角四个圆钮照旧「按哪个钮就是哪个键」，不受这两个开关影响。
       点一下切换（连发时变红底），选择按游戏记进 localStorage。
       ★ 默认档（第二十九轮老杨定）：**B = 连发、A = 单发** —— 打要按住就突突，跳必须一次一下。
         DOM 初值也跟着写死（B 带 .on），否则首帧会闪一下「B·单发」再被 JS 改回来。
         切过的选择优先于默认（loadFireMode 会覆盖），所以老玩家的存档不受影响。
       第二十四轮（老杨）：**只调顺序，其余一概不动**。从左到右现在是 ——
       ♪ 开 → ↺ 重置 → SELECT → START → Ⅱ 调整键 → ◱ 隐藏键 → B 开关 → A 开关
       （两个连发开关挪到最右尾，且 B 在 A 前）。`verify.js` 有顺序断言钉着。 -->
  <div id="topbar">
    <div class="tbtn" id="btnSound">♪ 开</div>
    <div class="tbtn" id="btnReset">↺ 重置</div>
    <div class="tbtn" id="btnSelect">SELECT</div>
    <div class="tbtn" id="btnStart">START</div>
    <div class="tbtn" id="btnPause">Ⅱ 调整键</div>
    <!-- ★ 第二十轮（老杨要求）：一键隐藏 / 显示右上角四个功能键。
         文字跟着状态走 —— 显示中写「◱ 隐藏键」，收起后写「◱ 显示键」并变暗（.off）。 -->
    <div class="tbtn mini" id="btnKeys">◱ 隐藏键</div>
    <div class="tbtn tgl on" id="btnFireB">B·连发</div>
    <div class="tbtn tgl" id="btnFireA">A·单发</div>
  </div>

  <!-- 右上角四个功能键（老杨 2026-10-09 第十七轮定稿 → 第十九轮可拖拽）：
         上排 = 红（**连发**）：左 B、右 A
         下排 = 黑（**单发**）：左 B、右 A      ← 老杨：红的上排、黑的下排，行内按 B、A 顺序横排
       键面只写大写字母 —— **红 = 连发、黑 = 单发**（不用再标「连、单」二字）。
       「A 黑」（单发 A）= 纯电平按住 = 原来的红色实体 A 钮：
       跳 / 确认 / 进关卡，按住跳得高 —— 红 A 钮与它重复，老杨拍板取消红钮、并到这里。
       这四个钮**按哪个就是哪个键**，不受顶栏「A·单发 / B·单发」开关影响。
       第十九轮：按暂停后四个钮可**逐个拖**到顺手的位置（拖动期间不触发按键），
       松手即存 localStorage，编辑态底部另有一键复位胶囊（第二十六轮起它连大小一起还原）。
       第二十轮：顶栏「◱ 隐藏键」可把这四个钮整个收起 / 叫回（状态按游戏记 localStorage）——
       只想看画面、手指够不着右上角时用。收起 = 加 .hid（display:none），同时清空按键状态。
       START / SELECT 在顶栏（和「↺ 重置」同款小胶囊）。
       见 bindHold / cornerDown / keyDrag / applyKeysVis / pushPad。 -->
  <div id="syskeys">
    <div class="fkey rep" data-k="cb" id="fkCb">B</div>
    <div class="fkey rep" data-k="ca" id="fkCa">A</div>
    <div class="fkey"     data-k="sb" id="fkSb">B</div>
    <div class="fkey"     data-k="sa" id="fkSa">A</div>
  </div>

  <!-- 左半屏：整块透明方向触摸区（按下即定控制原点，滑动判 8 方向）。
       屏幕上不画摇杆环 / 摇杆头 —— 见 bindStick。
       纯摇杆，不再兼职 START（系统键已挪到顶栏，见 bindSysKeys）。 -->
  <div id="padL"></div>
  <!-- 右半屏：整块透明触摸区（第十七轮：不再画菱形、不再分区，屏上不出现任何线）。
       一落下 = B 键（打 / 跑，按住保持），按下本身不跳；
       按住时手指纵向动一下 = 跳一次；第二根手指落下 = 也跳。
       跳与「按在哪里」无关 —— 位置不参与任何判定。
       四个兜底按钮已挪到右上角（见 #syskeys）。
       见 bindRight / padSwipe / jumpA / pushPad。 -->
  <div id="padR"></div>

  <div id="rotate">请横屏游玩<br><span style="font-size:13px;opacity:.7">（左半屏按住滑动 = 方向；右半屏按住 = B 键（打/跑），手指上下动一下 = 跳；右上角四个圆钮 = A/B 的连发与单发兜底键（顶栏「◱ 隐藏键」可一键收起），暂停后可拖动调位置；顶栏 = SELECT / START / 设置）</span></div>

  <!-- 第十九轮：启动展示页（#boot）已按老杨要求删除 —— 页面加载完直接进游戏，不再需要点一下。 -->

  <!-- 开场大字提示卡：居中、黑底红框、FC 街机味。点一下屏幕就开始打（不自动消失）。
       文案要极简 —— 只讲三件事：方向、打、跳。
       第二十三轮（老杨）：删掉底下那行小字（顶栏 / 四钮）；第一行的按键名与说明改成
       「左手控制 = 方向」，第三行改成「按住摩擦 = 蹦」，B 键那句后面的括号注解也去掉。 -->
  <div id="hint">
    <div class="hTitle">上吧，战士</div>
    <div class="hRow"><span class="hKey">左手控制</span> ＝ 方向</div>
    <div class="hRow"><span class="hKey">右手按住</span> ＝ <span class="hVal">突突突</span></div>
    <div class="hRow"><span class="hKey">按住摩擦</span> ＝ 蹦</div>
    <div class="hGo">点一下屏幕，开打</div>
  </div>

  <!-- （第二十一轮删除：底部那行诊断小字 —— 测试用的，老杨要求去掉。） -->
  <!-- 暂停态才出现的层（第二十九轮：删掉「默认」块，一排只剩三块）：
       一条贴底的整行大控制条 —— 上面一行读数 / 提示，下面一整排三个等宽大块：
       「⊖ 小点」「⊕ 大点」（尺寸，作用在选中的那个钮上）+「✥ 复位」（全局，位置与大小一起还原）。
       编辑态里轻点一个圆钮 = 选中它（套金圈），这排的尺寸键就改它。 -->
  <div id="sizeBar">
    <div class="sbVal" id="szVal">先点一个键，给它「长个儿」</div>
    <div class="sbRow">
      <div class="sbBtn" id="szMinus"><span class="sbIco">⊖</span>小点</div>
      <div class="sbBtn" id="szPlus"><span class="sbIco">⊕</span>大点</div>
      <div class="sbBtn sbReset" id="resetPos"><span class="sbIco">✥</span>复位</div>
    </div>
  </div>
  <div id="ldg">正在准备模拟器…</div>
  <div id="err"></div>
</div>

<script>
"use strict";
/* =====================================================================
   超级玛丽3 · 模拟器版
   ---------------------------------------------------------------------
   结构：jsnes 模拟器（内联 base64 载入） + 魂斗罗那套操作层（原样搬）
   ---------------------------------------------------------------------
   操作层是重点，老杨认的就是这个手感，逻辑一行不改地搬过来：
     左半屏 = 虚拟摇杆，按下定原点、按位移分 8 扇区出方向，屏幕上不画控件。
     右半屏 = 按下只出 B（按住保持按下，单发），按住时手指纵向动一下 = 跳满一整跳。
     自愈 = 全量快照 LIVE + 当场校正 + 每帧校验；四道兜底，只依赖 e.touches。
   ---------------------------------------------------------------------
   与魂斗罗的唯一差别 = 输出目标：
     魂斗罗把 held() 喂给自己的物理引擎；
     这里把 held() 翻译成 NES 手柄按键，交给模拟器。
   ===================================================================== */
</script>
<script>
/* jsnes 已在上一段 <script> 里直接内联执行完（UMD 自挂 window.jsnes）。
   ROM 的 base64 解码在上一段也做完了，这里只剩启动逻辑。 */

const LDG = document.getElementById('ldg');
const ERR = document.getElementById('err');
function fail(msg){
  ERR.style.display = 'flex';
  ERR.textContent = '模拟器启动失败\n\n' + msg + '\n\n（若反复出现，把这段文字截图给我）';
  LDG.classList.add('gone');
}

/* 全局兜底：任何未捕获的异常都让加载页退场并显示原因。
   宁可给出一行错误，也不要让玩家对着「正在准备模拟器」干等。 */
addEventListener('error', e=>{
  if(LDG && !LDG.classList.contains('gone')) fail('脚本异常：' + (e.message || e.type));
});
addEventListener('unhandledrejection', e=>{
  const r = e && e.reason;
  if(LDG && !LDG.classList.contains('gone')) fail('异步异常：' + ((r && r.message) || r));
});
/* 硬超时：加载页最多停留 8 秒。到点还没起来就把话说明白 ——
   第十九轮删了启动展示页，没有「再点一次」那一页可露了，所以这里改成留在原地报进度，
   别把黑幕撤掉变成一片黑、让人不知道发生了什么。 */
setTimeout(()=>{
  if(LDG && !LDG.classList.contains('gone')){
    LDG.textContent = '模拟器仍未就绪…（长按右上角「↺ 重置」或刷新页面再试）';
  }
}, 8000);

/* ------------------------- 常量 ------------------------- */
/* NES 原生分辨率 256×240（位图 1:1）。
   显示比例交给 CSS：4:3 盒子 + image-rendering:pixelated，浏览器只做一次等比拉伸，
   比先画进 292×219 再二次缩放锐利得多。 */
const VW = 256, VH = 240;

/* ------------------------- 输入层（搬运自「魂斗罗」） ------------------------- */
const K = {};                            // 键盘状态
const T = {};                            // 触屏状态
const PJ = {frames:0};                   // 跳跃冲量：触发一下 = 按住跳键 N 帧
/* （第十七轮：原「右上角 A 实体钮」AKEY 已取消 —— 那枚红钮和右上角「A 黑」按钮功能重复，
   老杨拍板去掉红钮，A 键的电平按住改由「A 黑」走 COR.lvlA 下发，见 pushPad。） */
function held(a){
  // A 键（jump）来源：键盘 / 右半屏滑动跳（T 电平）/ 跳跃冲量 PJ
  //   （右上角「A 黑」按钮**不**走这里 —— 它走 COR 通道，见 pushPad 的 aOn 合成）
  return !!(K[a] || T[a] || (a==='jump' && PJ.frames > 0));
}
function dirX(){ return (held('right')?1:0) - (held('left')?1:0); }
function dirY(){ return (held('down')?1:0) - (held('up')?1:0); }

const KEYMAP = {
  ArrowLeft:'left', KeyA:'left', ArrowRight:'right', KeyD:'right',
  ArrowUp:'up', KeyW:'up', ArrowDown:'down', KeyS:'down',
  KeyK:'jump', Space:'jump', KeyZ:'jump',
  KeyJ:'fire', KeyX:'fire', KeyL:'fire'
};

/* ------------------------- 模拟器 ------------------------- */
let nes = null, nesBtn = null;
let running = false, paused = false, soundOn = true;
let lastTs = 0, acc = 0;

/* 输出到 NES 手柄：把 held() 那套状态翻译成按键。
   两个约定（8 位机的通病）：
     ① 方向键「按住即持续」—— 每帧都下发一次 buttonDown，手柄状态本来就是电平量，重复下发无副作用；
     ② B 键（跑）也必须是电平 —— 玛丽3 的助跑加速要求 B 全程按住不放，
        一旦做成 30Hz 连发，松/按交替会把「持续按住」拆成碎片，跑不起来。
   Mario 3 键位：A = 跳，B = 跑 / 打 / 抓（B 按住不放才是跑）。 */
/* 系统键（START / SELECT）的冲量。
   为什么要冲量：这两个键是**边沿触发**的 —— 游戏每帧只在「上一帧没按、这一帧按了」
   的那一下认一次。手指点一下就抬起，可能正好落在两帧之间，游戏根本没看见。
   所以触发一下 = 按住 N 帧（跟跳跃冲量一个道理），保证游戏一定收到这个边沿。
   ⚠️ 这是我第一版漏掉的：只接了方向/A/B，没接 START/SELECT，
      结果游戏内那层标题画面永远进不去（点一百下也进不了关）。 */
const START_HOLD_FR = 4, SELECT_HOLD_FR = 4;
const SYSJ = {start: 0, select: 0};
function pressStart(){  SYSJ.start  = START_HOLD_FR; }
function pressSelect(){ SYSJ.select = SELECT_HOLD_FR; }

/* ---------------- A / B 键的「单发 ↔ 连发」开关（第十九轮按老杨要求恢复） ----------------
   管的是**常规手势那条通路**：右半屏按住（B）、跳跃（A）、键盘 J / K。
   单发 = **电平**：按住期间一直按下，抬手立刻松。
     · A（跳）单发 —— 一次触发一次冲量，长按跳得高；
     · B（跑 / 打）单发 —— 魂斗罗按住不放才是持续射击；玛丽3 的助跑加速更要求 B 全程按住
       （连发会把「持续按住」拆碎，跑不起来）。
   连发 = **30Hz**（60Hz 分频，松/按交替）—— 射击类游戏按一下就能自己打。
   ⚠️ 默认档（老杨 2026-10-10 第二十九轮改的口径）：**B = 连发、A = 单发**。
      B 是「打/跑」——魂斗罗里按住就要一直突突突，连发才是玩家预期；A 是跳跃，
      跳跃必须一次一下，绝不能不撒手就一直跳（那样根本没法玩）。
      ⚠️ 判据仍是**游戏语义**，不是键位字母 —— 换到玛丽3 那种「B = 跑」的游戏时，
         要重新按语义定默认（跑要求全程按住，默认就该是单发；见 SKILL「坑」一节）。
      连发只在老杨主动切过去之后才生效，切了就按游戏记进 localStorage。
   ⚠️ 右上角四个圆钮**不受这两个开关影响** —— 按哪个钮就是哪个键（红=连发、黑=单发）。
   ⚠️ 老规矩：**连发必须挂在「玩家真按着」上**，没按就复位相位并松开 —— 绝不许空转
      （空转 = 幻影连发，玛丽3 地图横条连翻的元凶，详见 pushPad 注释）。 */
let autoA = false, autoB = true;       // 第二十九轮定稿：A 单发（跳，必须一次一下）、B 连发（打，按住就突突）
let phA = false, phB = false;          // 常规手势的连发相位（关掉连发时必须复位，防幻影）
const FIRE_KEY = 'nes.fireMode.contra1';   // 按游戏区分存档：不同游戏互不干扰
function loadFireMode(){
  try{
    const s = localStorage.getItem(FIRE_KEY);
    if(s && s.length === 2){ autoA = (s.charAt(0) === 'a'); autoB = (s.charAt(1) === 'a'); }
  }catch(e){ /* file:// 或隐私模式下 localStorage 可能被禁，忽略即可，用上面那组默认 */ }
}
function saveFireMode(){
  try{ localStorage.setItem(FIRE_KEY, (autoA?'a':'e') + (autoB?'a':'e')); }catch(e){}
}
/* 顶栏两个开关的文字与高亮（连发 = 红底，一眼看出当前模式） */
function refreshFireBtn(){
  const fa = document.getElementById('btnFireA');
  const fb = document.getElementById('btnFireB');
  if(fa){ fa.textContent = 'A·' + (autoA ? '连发' : '单发');
          if(fa.classList){ autoA ? fa.classList.add('on') : fa.classList.remove('on'); } }
  if(fb){ fb.textContent = 'B·' + (autoB ? '连发' : '单发');
          if(fb.classList){ autoB ? fb.classList.add('on') : fb.classList.remove('on'); } }
}

function pushPad(){
  if(!nesBtn) return;
  const B_A = 0, B_B = 1, B_SELECT = 2, B_START = 3, B_UP = 4, B_DOWN = 5, B_LEFT = 6, B_RIGHT = 7;
  const bd = b => nesBtn.buttonDown(1, b);
  const bu = b => nesBtn.buttonUp(1, b);
  // 方向：电平，每帧照实下发
  dirX() > 0 ? bd(B_RIGHT) : bu(B_RIGHT);
  dirX() < 0 ? bd(B_LEFT)  : bu(B_LEFT);
  dirY() > 0 ? bd(B_DOWN)  : bu(B_DOWN);
  dirY() < 0 ? bd(B_UP)    : bu(B_UP);
  // A 键（跳）：**右半屏按下不发 A** —— 跳只由「纵向滑动」或「第二根手指」触发（都走 PJ 冲量）。
  //   右上角功能键：「A 红」= A 30Hz 连发；「A 黑」= A 电平按住（跳高/确认/进关卡，原红 A 钮）。
  //   顶栏那两个开关只管常规手势（右半屏按住 / 跳跃 / 键盘 J、K），这四个钮不受影响。
  // ⚠️ 别再写回 `held('jump') || T.fire`：那等于「按住右半屏就是跳」（第九 / 十轮的教训）。
  let aOn = false;
  if(held('jump')){
    if(autoA){ phA = !phA; aOn = phA; }            // 顶栏 A·连发：30Hz
    else aOn = true;                               // 单发：电平（键盘 K / PJ 冲量）
  } else phA = false;                              // 没按 → 复位相位 + 松开，绝不空转
  if(COR.lvlA) aOn = true;                         // 右上角「A 黑」：纯电平（原红 A 钮）
  if(COR.aA){ COR.phA = !COR.phA; if(COR.phA) aOn = true; } else COR.phA = false;   // 右上角「A 红」：独立 30Hz
  aOn ? bd(B_A) : bu(B_A);
  // B 键（跑 / 打 / 抓）：右半屏按住 = 电平（定稿手感，助跑必须全程按住）；顶栏连发 = 30Hz。
  //   右上角功能键：「B 黑」= B 电平按住（助跑按得住）；「B 红」= 独立 30Hz 连发。
  // ⚠️ B 连发绝不许空转 / 绝不许拆碎「持续按住」—— 助跑加速要求 B 全程按住（第六轮教训）。
  let bOn = false;
  if(T.fire){
    if(autoB){ phB = !phB; bOn = phB; }            // 顶栏 B·连发：30Hz
    else bOn = true;                               // 单发：电平（右半屏按住）
  } else phB = false;
  if(COR.lvlB) bOn = true;                         // 右上角「B 黑」：纯电平（助跑按得住）
  if(COR.aB){ COR.phB = !COR.phB; if(COR.phB) bOn = true; } else COR.phB = false;   // 右上角「B 红」：独立 30Hz
  bOn ? bd(B_B) : bu(B_B);
  // START / SELECT：走独立冲量，与手指在不在屏幕上无关（跟跳跃同一套思路）
  SYSJ.start  > 0 ? bd(B_START)  : bu(B_START);
  SYSJ.select > 0 ? bd(B_SELECT) : bu(B_SELECT);
  if(SYSJ.start  > 0) SYSJ.start--;
  if(SYSJ.select > 0) SYSJ.select--;
}

/* 每帧推进：把输入推给模拟器 → 跑一帧 → 画到画布。
   nes.frame() 若在 ROM 崩溃时反复抛错，会每帧刷异常 —— 捕获一次就停机报错。 */
function step(){
  pushPad();
  if(nes){
    try{ nes.frame(); }
    catch(e){
      running = false;
      fail('模拟器运行异常：' + ((e && e.message) || e));
      throw e;
    }
  }
}

/* ------------------------- 键盘 -------------------------
   系统键映射（NES 手柄就这几个键，全给到位）：
     Enter / 1        = START（开始、进菜单、地图、暂停）—— 玛丽3 全靠它推进流程
     Shift / 2        = SELECT（选人画面用来切角色、个别游戏切道具）
     K / Z / 空格     = A（跳）
     J / X / L        = B（跑 / 打 / 抓）
     WASD / 方向键    = 方向
     P 暂停模拟器  M 静音  R 重开 */
addEventListener('keydown', e=>{
  if(KEYMAP[e.code]!==undefined){ K[KEYMAP[e.code]]=true; e.preventDefault(); }
  // Enter：先保证游戏内 START 一定发出去，还没开局的话顺便把局开起来
  //（第十九轮起页面加载完就自动开局，这里只是保险；没有启动展示页可处理了）
  if(e.code==='Enter' || e.code==='Digit1' || e.code==='Numpad1'){
    pressStart();
    if(!inPlay()) startRun();
    e.preventDefault(); return;
  }
  if(e.code==='ShiftRight' || e.code==='ShiftLeft' || e.code==='Digit2' || e.code==='Numpad2'){
    pressSelect(); e.preventDefault(); return;
  }
  if(e.code==='Digit3' || e.code==='Numpad3'){    // 3 = 重开（等价于右上角「重置」）
    resetNES(); e.preventDefault(); return;
  }
  if(e.code==='KeyP'){ togglePause(); e.preventDefault(); }
  if(e.code==='KeyM'){ toggleSound(); e.preventDefault(); }
  if(e.code==='KeyR'){ resetNES(); e.preventDefault(); }
  if(e.code==='Space') e.preventDefault();
});
addEventListener('keyup', e=>{ if(KEYMAP[e.code]!==undefined) K[KEYMAP[e.code]]=false; });

/* ------------------------- 右半屏：按住 = B 键，纵向动一下 = 跳 -------------------------
   ★ 老杨 2026-10-09 第十五轮定稿：**彻底取消上下分区**（黄线、面积判定全删）。
   右半屏只有一个「与位置无关」的键：按住 = B；跳靠**动作**触发。

     ① 手指一碰 → 出 B 键（按住期间恒为按下）—— **按下本身不跳**；
     ①' 按下后的第一个 touchmove 只用来校正锚点，不作判定（JUMP_GUARD_MOVES）——
         那一段是浏览器的「落指坐标跳变」（接触点从指尖挪到指肚），不是玩家的动作；
     ② 按住时手指纵向动一下（上挑 / 下压都算）→ 跳一次（独立冲量，抬手掐不断）；
     ③ 第二根手指落下 → 也能跳（备用通路，靠触点次序，机器原生 100% 准）；
     ④ 抬手 → B 键归零。跳本身走独立冲量 PJ，抬手掐不断（跳满一整跳）。

   ★ 为什么不再分区（第 9~14 轮的教训，别走回头路）：
     · 这台手机**读不到触点面积**（radiusX/Y 无效），「指腹=跳」的面积路本就走不通；
     · 退到「上半屏=跳 / 下半屏=打」后，中间位置（≈50%）纯属赌博，老杨报「好乱」；
     · 更糟的是「按下即跳」让**按住不动**也能跳，落地时 A 还被按着 → 游戏自己续跳
       （老杨报「落地后抬手又跳一下」），怎么打补丁都不干净。
   ⇒ 常规区只保留**三个互不混淆的动作维度**：按住（B）、纵向滑动（跳）、第二根手指（跳）。
     一个手势一个意思。
   ⚠️ 右半屏**「按在哪里」不参与任何判定**（第十七轮起：四个兜底键已改成右上角的真实按钮
      #syskeys .fkey —— 按哪个钮就是哪个键，不再靠区域推算）。别再往右半屏加任何位置 / 面积判定 ——
      见魂斗罗 v17/v18 的回退教训：判据一旦依赖「当场数出来的中间量」，数错就会抢走控制权。 */
const JUMP_GUARD_MOVES = 1;   // ★【落指保护】按下后前 N 次 touchmove 只校正锚点、不判定
const JUMP_SWIPE       = 0.022; // 【跳跃通路】纵向位移阈值 = 屏幕短边 × 该系数，下限 8px
                                // 取屏幕短边做基准：R90 旋转下 innerW/H 互换，但「短边」不变，阈值照样稳。
                                // 系数照搬魂斗罗（老杨认过的手感），别自己调大 ——
                                // 调大后桌面宽屏（短边=1080）阈值会涨到几十上百像素，手指够不到，跳就废了。
const SWIPE_REARM      = 1.00; // 跳完纵向回拉这么多（占阈值比例）才能再触发
const JUMP_HOLD_FR     = 26;   // 跳一下 ≈ 0.43s，够初速 4.07px/帧的玛丽把加速跑用满
const TWO_FINGER_JUMP  = true; // 「第二根手指 = 跳」常开（备用通路）

/* （第十五轮删除 —— 整套「触点打/跳区分」判定已废弃：
   分区常量 / 面积采样 / 改判窗口 / localStorage 记忆，全删。
   原因：本机读不到触点面积（radiusX/Y 无效），位置分区又太乱。
   现在跳只认「纵向滑动」和「第二根手指落下」两个动作维度，与位置 / 面积无关。） */

/* ★【跳怎么落地】(老杨 2026-10-09 第十五轮定稿 → 第十八轮简化)
   屏幕上的常规手势**只有一种**：一次触发 = 一次**独立冲量** PJ（JUMP_HOLD_FR 帧 ≈0.43s，
   抬手掐不断）—— 跳满一整跳；按住不续跳，落地后也不会再冒一次。
   想「按住不停跳」不是靠长按右半屏，而是按**右上角「A 红」**（独立 30Hz，见 pushPad）。
   同理「A 黑」走 COR.lvlA，是纯电平（长按跳高的老手感在这里保留）。
   ⇒ 第十九轮起顶栏又有「A·单发 / A·连发」开关了（老杨要求恢复）：
      它管的是**常规手势**那条通路 —— 单发 = 一次冲量、跳满一整跳（下面是这唯一入口）；
      连发 = 按住期间 30Hz 连打，相位 phA 在 pushPad 里，与这里的冲量互不干扰。
      右上角「A 红」那颗钮仍然自己一份独立相位（COR.phA），与顶栏开关无关。 */
function jumpA(want){
  if(want) PJ.frames = JUMP_HOLD_FR;      // 一次触发 = 一次冲量（抬手掐不断，跳满一整跳）
}

/* （第二十一轮删除：底部那行触摸诊断小字的渲染函数与计时器 —— 老杨说「测试用的，不要了」。
   当年加它是为了排查「按住右半屏这一下被判成打还是跳」，现在手势早定稿，
   留着只会在屏幕底部一闪一闪。手势逻辑本身一个字没动。） */

const RT = {pid:null, j2:null,
            swipeY:null, swipeArm:false, swipeJumpY:0, guard:0};   // 第一根触点 / 第二根触点 / 滑动锚点

/* ★【右上角四个功能键】(老杨 2026-10-09 第十七轮看图定稿，第十八轮调排布)
   不再在右半屏画任何分区线、也不再做区域判定 —— 四个兜底键做成**右上角的真实按钮**
   （#syskeys 里的 .fkey），两列两行、间距拉开；**上排红（连发）、下排黑（单发）**，行内按 B、A 横排；
   键面只写大写字母：
     上排：cb「B 红」= B 30Hz 连发        ca「A 红」= A 30Hz 连发
     下排：sb「B 黑」= B 电平（助跑）      sa「A 黑」= A 电平（跳高 / 确认 / 进关卡，原红钮）
   第十九轮起：老杨要求恢复顶栏的「A·单发 / B·单发」开关 —— 那两个开关只管**常规手势**
   （右半屏按住 / 跳跃 / 键盘 J、K），这四个钮照旧「按哪个钮就是哪个键」，互不影响。
   每个触点独立跟踪，连发相位（COR.phA / COR.phB）各自独立，松手即复位 —— 绝不空转。 */
const COR = {ids:{}, lvlA:false, lvlB:false, aA:false, aB:false, phA:false, phB:false};
/* （第二十一轮删除：功能键的中文标签表 —— 只喂给已删掉的底部诊断小字，随它一起走。） */
/* 右上角四个功能键：DOM id ↔ 键代号（显式列出，不依赖 querySelectorAll —— 测试桩里更稳）。
   顺序与 DOM 网格一致：上排 红（B、A）→ 下排 黑（B、A）。 */
const FNKEYS = [['fkCb','cb'], ['fkCa','ca'], ['fkSb','sb'], ['fkSa','sa']];
function cornerSync(){
  COR.lvlA = COR.lvlB = COR.aA = COR.aB = false;
  for(const k in COR.ids){
    const z = COR.ids[k];
    if(z === 'sa') COR.lvlA = true;
    else if(z === 'sb') COR.lvlB = true;
    else if(z === 'ca') COR.aA = true;
    else if(z === 'cb') COR.aB = true;
  }
  if(!COR.aA) COR.phA = false;                    // 没按 → 复位相位，绝不空转（老铁律）
  if(!COR.aB) COR.phB = false;
}
/* 功能键按下 / 抬起：由右上角四个真实按钮（#syskeys .fkey）的 bindHold 触发 ——
   id 直接用按钮代号（每个按钮同时只可能被一根手指按住，够用）。 */
function cornerDown(id, z){
  /* ⚠️ 暂停中不许出键：这时按到圆钮是**在拖它调位置**（见 keyDrag），不是要按键。
     就算漏进来也不怕 —— pushPad 只在 running && !paused 时被调用，游戏收不到；
     但状态会挂住（恢复后接着按），所以这里直接不记录。 */
  if(paused) return;
  if(COR.ids[id] === z) return;
  COR.ids[id] = z;
  cornerSync();
  hideHintSoon();                                  // 玩家开始操作了，提示条让位
}
function cornerUp(id){
  if(COR.ids[id] === undefined) return;
  delete COR.ids[id];
  cornerSync();
}
function cornerClearAll(){ COR.ids = {}; cornerSync(); }
/* 触摸自愈：连一根手指都不在屏幕上了（LIVE 空）却还挂着按下状态，说明抬手事件丢了 → 清空。
   ⚠️ 必须看 HAS_TOUCH：鼠标环境 LIVE 永远为空，无条件清就会每帧把按下的按钮松开。 */
function cornerSweep(){
  if(!HAS_TOUCH) return;
  if(!LIVE.size && Object.keys(COR.ids).length){ COR.ids = {}; cornerSync(); }
}

/* ★【暂停后可拖动四个圆钮调位置】(老杨 2026-10-09 第十九轮提的要求)
   原话：「增加一个暂停后用户可以自由拖拽调整红色、黑色按钮位置的功能」。规则：
     · 只有**暂停中**能拖 —— 暂停即进编辑态（#syskeys 加 .edit，钮变虚线半透明）；
       拖动期间不触发按键（cornerDown 有 paused 守卫，拖拽走自己这套监听）。
     · 四个钮**各自独立**：红 B / 红 A / 黑 B / 黑 A 各拖各的，互不牵连。
     · 松手即存 localStorage（按游戏分开存），下次打开还在原位；
       暂停时底部出现的复位胶囊一键还原出厂位置（第二十六轮起连大小一起还原）。
     · 位置存的是**中心点**，坐标系与 toLocal 完全一致（R90 旋转下也对）；
       应用时按当前屏幕夹取，保证拖不出屏幕、永远找得回来。
   ⚠️ 定位只走 left/top + translate(-50%,-50%)，别再叠别的 transform（:active 的 scale 已带上它）。 */
const POS_KEY = 'nes.fkey.pos.contra1';
const FKEY_POS = {};                  // {cb:{x,y},...}；缺哪项 = 用 layout() 算的默认位
function loadKeyPos(){
  try{
    const o = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
    if(!o || typeof o !== 'object') return;
    for(const k in o){
      const p = o[k];
      if(p && typeof p.x === 'number' && typeof p.y === 'number') FKEY_POS[k] = { x:p.x, y:p.y };
    }
  }catch(e){ /* 读不出来就用默认位，不影响玩 */ }
}
function saveKeyPos(){
  try{ localStorage.setItem(POS_KEY, JSON.stringify(FKEY_POS)); }catch(e){}
}
function clearKeyPos(){
  for(const k in FKEY_POS) delete FKEY_POS[k];
  try{ localStorage.removeItem(POS_KEY); }catch(e){}
}
/* ★【选中一个钮 → 改它的大小】(老杨 2026-10-09 第二十六轮提的要求)
   原话：「增加一个功能，在调整键时选中一个按钮支持调整按钮大小」。当场问过的口径：
     · **轻点一下钮 = 选中**（按下到抬起位移 < TAP_SLOP 就算轻点；按住拖动照旧是移动）；
       选中钮套金色实线圈 + 外发光，再轻点一下取消，点别处/退出编辑态也清掉。
     · 选中后屏幕底部那条大控制条亮起：「⊖ 小点 / ⊕ 大点」（第二十九轮删了「默认」），一档 ≈ 默认直径的 8%，
       范围 0.6×~1.6×；没选中时整条压暗并提示「先点一个键」（第二十七轮老杨挑的常显口径）。
     · 大小按游戏记进 localStorage（同位置一个路子）；控制条上「✥ 复位」一键把**位置 + 大小**都还原。
   位置与大小的关系：位置记的是**中心点** —— 改大小后中心点不动，只是再夹一次屏幕内，
   免得钮长大之后伸到屏幕外找不回来。
   ⚠️ 注释里也别写回旧胶囊名（源码断言会盯字面），要提就写「复位胶囊」。
   ⚠️ 键面字号跟着直径走（0.36 倍），别只改宽高不改字号 —— 那样钮大了字母还是小的，很难看。 */
const SIZE_KEY = 'nes.fkey.size.contra1';
const FKEY_SIZE = {};                 // {cb:68,...} 单位 px；缺项 = 用 layout() 算的自适应直径
const TAP_SLOP = 6;                   // 按下→抬起位移小于它算「轻点」（选中），否则算拖动
/* 控制条上那行大字（第二十八轮起它同时顶掉原顶部说明条的职责）：
   没选中 = 顺嘴告诉玩家下一步干嘛；选中 = 报「在改：黑 A · 68px」。 */
const SIZE_IDLE_TEXT = '先点一个键，给它「长个儿」';
/* 选中后给钮起的**顺口名字**（键面只写大写 A / B，所以名字得把红黑、连发单发说清楚，
   读出来是「在改：黑 A · 68px」这种，一眼知道改的是哪一个）。 */
const SEL_NAME = {ca:'红 A（连发）', sa:'黑 A', cb:'红 B（连发）', sb:'黑 B'};
let selKey = null;                    // 当前选中的钮代号（cb/ca/sb/sa）；null = 没选中
let baseFn = 56;                      // 默认自适应直径（layout() 每次算完记在这，供步进/夹取用）
function fnIdOf(k){
  for(const [id, kk] of FNKEYS) if(kk === k) return id;
  return null;
}
function loadKeySize(){
  try{
    const o = JSON.parse(localStorage.getItem(SIZE_KEY) || 'null');
    if(!o || typeof o !== 'object') return;
    for(const k in o){
      const v = o[k];
      if(typeof v === 'number' && v > 0) FKEY_SIZE[k] = Math.round(v);
    }
  }catch(e){ /* 读不出来就用自适应尺寸，不影响玩 */ }
}
function saveKeySize(){
  try{ localStorage.setItem(SIZE_KEY, JSON.stringify(FKEY_SIZE)); }catch(e){}
}
function clearKeySize(){
  for(const k in FKEY_SIZE) delete FKEY_SIZE[k];
  try{ localStorage.removeItem(SIZE_KEY); }catch(e){}
}
/* 步进范围：以当前屏幕的自适应直径为基准，0.6× ~ 1.6×，一档 8%（下限 2px 免得小屏点不动）。 */
function sizeRange(){
  const mn = Math.max(20, Math.round(baseFn * 0.6));
  const mx = Math.max(mn + 8, Math.round(baseFn * 1.6));
  return { min: mn, max: mx, step: Math.max(2, Math.round(baseFn * 0.08)) };
}
function keySizeOf(k){
  const r = sizeRange();
  const v = FKEY_SIZE[k];
  return v ? Math.max(r.min, Math.min(r.max, v)) : baseFn;
}
function applyKeySize(el, k, d){
  if(!el || !el.style) return;
  el.style.width = d + 'px'; el.style.height = d + 'px';
  el.style.fontSize = Math.max(14, Math.round(d * 0.36)) + 'px';
}
/* 底部控制条的显隐与读数（第二十七轮重排：整行铺底、一块一块够大）。
   出现条件比第二十六轮宽 —— **只要在编辑态（暂停中 + 没把四钮藏起来）就一直在**；
   没选中任何钮时整条压暗、读数提示「先点一个键」，选中后亮起并写明在改哪一个。
   （老杨挑的口径：常显、未选中时变暗 —— 省掉「点一下才冒出来」那一下懵。） */
function syncSizeBar(){
  const bar = document.getElementById('sizeBar');
  const on = paused && !fkeysHidden;
  if(bar && bar.classList){
    on ? bar.classList.add('on') : bar.classList.remove('on');
    selKey ? bar.classList.remove('idle') : bar.classList.add('idle');
  }
  const val = document.getElementById('szVal');
  if(val && val.textContent !== flashText){
    val.textContent = selKey
      ? '在改：' + (SEL_NAME[selKey] || selKey) + ' · ' + Math.round(keySizeOf(selKey)) + 'px'
      : SIZE_IDLE_TEXT;
  }
}
/* 读数行闪一句话（「复位了：…」这类结果回执），1.5 秒后自动回到常态读数。
   闪的期间 syncSizeBar() 不覆盖它（见上面 flashText 那道判断）—— 否则按完「复位」
   紧接着的任何一次 syncSizeBar 都会把回执立刻抹掉，玩家根本看不见。 */
let flashText = null, flashTimer = 0;
function flashSizeVal(msg){
  const val = document.getElementById('szVal');
  if(!val) return;
  flashText = msg;
  val.textContent = msg;
  if(flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(()=>{
    flashTimer = 0; flashText = null;
    syncSizeBar();
  }, 1500);
}
function applySel(){
  for(const [id, k] of FNKEYS){
    const el = document.getElementById(id);
    if(el && el.classList){ selKey === k ? el.classList.add('sel') : el.classList.remove('sel'); }
  }
  syncSizeBar();
}
function toggleSel(k){ selKey = (selKey === k) ? null : k; applySel(); }
function clearSel(){ if(selKey === null) return; selKey = null; applySel(); }
/* 「⊖ 小点 / ⊕ 大点」：改当前选中那个钮的尺寸，中心点原地不动，改完再夹一次屏幕内。 */
function stepKeySize(k, dir){
  if(!k) return;
  const r = sizeRange();
  const v = Math.max(r.min, Math.min(r.max, Math.round(keySizeOf(k) + dir * r.step)));
  FKEY_SIZE[k] = v;
  saveKeySize();
  const el = document.getElementById(fnIdOf(k));
  if(el){
    applyKeySize(el, k, v);
    const cx = parseFloat(el.style.left) || 0, cy = parseFloat(el.style.top) || 0;
    placeKey(el, k, cx, cy, false);
    if(FKEY_POS[k]) FKEY_POS[k] = { x: Math.round(parseFloat(el.style.left) || 0),
                                    y: Math.round(parseFloat(el.style.top)  || 0) };
  }
  syncSizeBar();
}
/* 「✥ 复位」（第二十六轮起它连大小一起管；第二十九轮定名「复位」）：位置 + 大小一起还原成出厂状态。
   ⚠️ 第二十九轮把「↺ 默认」块删了 —— 单钮的尺寸还原没有独立入口了，要还原就整排复位；
      原先管单钮还原的那个函数也一并删掉（不删就是死代码，断言会盯着）。 */
function resetAllKeys(){
  clearKeyPos();
  clearKeySize();
  clearSel();
  layout();
}

/* 把某个钮钉到 (cx,cy)（中心点）—— 夹取到屏幕内；remember = 顺手记进 FKEY_POS。 */
function placeKey(el, k, cx, cy, remember){
  if(!el) return;
  const d = el.offsetWidth || 56;
  const x = Math.max(d/2 + 1, Math.min(LW - d/2 - 1, cx));
  const y = Math.max(d/2 + 1, Math.min(LH - d/2 - 1, cy));
  el.style.left = Math.round(x) + 'px';
  el.style.top  = Math.round(y) + 'px';
  if(remember) FKEY_POS[k] = { x: Math.round(x), y: Math.round(y) };
}
/* 暂停 = 编辑态开；继续 = 编辑态关（底部整行大控制条跟它一起显隐；
   第二十八轮起顶部说明条已删，全部提示都走控制条那行读数）。 */
function setKeyEdit(on){
  // 第二十轮：四个钮被隐藏时，这套「拖动 / 复位」的控制条也跟着收起来 ——
  // 钮都看不见了还挂着控制条，自相矛盾。见 applyKeysVis。
  const add = (el, cls, v)=>{ if(el && el.classList){ v ? el.classList.add(cls) : el.classList.remove(cls); } };
  add(syskeysEl, 'edit', on);
  if(!on){
    cornerClearAll();                // 退出编辑态：把可能挂着的按下状态清掉，免得恢复后接着按
    clearSel();                      // 选中态也一并收掉 —— 接着玩游戏时钮上不该还套着金圈
  }
  syncSizeBar();                     // 控制条的显隐跟着编辑态（与 fkeysHidden）走
}
/* ★ 第二十八轮：「✥ 复位」不再单独钉在屏幕右上角（老杨说「找不见了」），
   改为 #sizeBar 里与「默认/小点/大点」并排的第四块，布局交给 flex，无需定位代码。 */
/* ★【一键隐藏 / 显示右上角四个功能键】(老杨 2026-10-09 第二十轮提的要求)
   原话：「再在顶部增加一个隐藏/显示四个按钮的胶囊键，一按就隐藏红色和黑色四个 b、a 按钮，再按又显示出来」。
   规则：
     · 隐藏 = #syskeys 加 .hid（display:none），画面立刻干净；再按一次原样叫回来。
     · 隐藏的瞬间必须 cornerClearAll() —— 否则「正按着某个钮的同时把它藏起来」，
       那个按钮的按下状态会永久卡住（钮都没了，抬手指也没处收），等于一个看不见的连发器。
     · 状态按游戏记进 localStorage，跟单发/连发、钮位置一个路子；下次打开还原上次的选择。
     · 顶栏胶囊文字跟状态走：显示中「◱ 隐藏键」/ 收起后「◱ 显示键」+ 变暗。
   ⚠️ 状态只有一处来源：`fkeysHidden`。DOM 的 .hid / .off 全靠 applyKeysVis() 同步，别在别处直接改。 */
const KEYS_KEY = 'nes.fkeys.hide.contra1';   // 按游戏区分存档
let fkeysHidden = false;
function applyKeysVis(){
  if(syskeysEl && syskeysEl.classList){
    fkeysHidden ? syskeysEl.classList.add('hid') : syskeysEl.classList.remove('hid');
  }
  const b = document.getElementById('btnKeys');
  if(b){
    b.textContent = fkeysHidden ? '◱ 显示键' : '◱ 隐藏键';
    if(b.classList){ fkeysHidden ? b.classList.add('off') : b.classList.remove('off'); }
  }
  if(fkeysHidden){
    cornerClearAll();                 // 收起来的同时清键，绝不留幻影按键
    clearSel();                       // 钮都看不见了，选中态与大控制条一起收（第二十六轮）
  }
  syncSizeBar();
}
function loadKeysVis(){
  try{ fkeysHidden = (localStorage.getItem(KEYS_KEY) === '1'); }
  catch(e){ /* file:// / 隐私模式读不了就默认「显示」，不影响玩 */ }
}
function saveKeysVis(){
  try{ localStorage.setItem(KEYS_KEY, fkeysHidden ? '1' : '0'); }catch(e){}
}
/* 每个钮的拖拽监听（与 bindHold 并列；暂停时那边被 cornerDown 的 paused 守卫挡住，不会打架）。 */
function bindKeyDrag(el, k){
  if(!el) return;
  let drag = null;
  const begin = p=>{
    if(!paused) return false;                       // 只有暂停中才拖 / 才选中
    const cx = parseFloat(el.style.left) || 0;      // 现在钉在哪（wrap 坐标，与 toLocal 同系）
    const cy = parseFloat(el.style.top)  || 0;
    // p0 / moved 是给「轻点选中」用的：按下到抬起几乎没动 = 轻点（第二十六轮）
    drag = { k, dx: p.x - cx, dy: p.y - cy, p0: { x: p.x, y: p.y }, moved: 0, lit: false };
    return true;
  };
  const move = p=>{
    if(!drag || drag.k !== k) return;
    const d = Math.sqrt((p.x - drag.p0.x) * (p.x - drag.p0.x) + (p.y - drag.p0.y) * (p.y - drag.p0.y));
    if(d > drag.moved) drag.moved = d;
    if(drag.moved < TAP_SLOP) return;      // 手指还基本没动 —— 别急着移动它（可能是在轻点选中）
    if(!drag.lit){ drag.lit = true; if(el.classList) el.classList.add('dragging'); }
    placeKey(el, k, p.x - drag.dx, p.y - drag.dy, true);
  };
  const end = ()=>{
    if(!drag || drag.k !== k) return;
    const tap = drag.moved < TAP_SLOP;
    drag = null;
    if(el.classList) el.classList.remove('dragging');
    if(tap) toggleSel(k);                           // 轻点 = 选中 / 再点一下取消（第二十六轮）
    else saveKeyPos();                              // 拖过 = 存位置，下次打开还在原位
  };
  if(HAS_TOUCH){
    el.addEventListener('touchstart', e=>{
      const t = e.changedTouches && e.changedTouches[0];
      if(!t || !begin(toLocal(t.clientX, t.clientY))) return;
      e.preventDefault();
    }, {passive:false});
    el.addEventListener('touchmove', e=>{
      const t = e.changedTouches && e.changedTouches[0];
      if(!t || !drag) return;
      e.preventDefault();
      move(toLocal(t.clientX, t.clientY));
    }, {passive:false});
    el.addEventListener('touchend', end, {passive:false});
    el.addEventListener('touchcancel', end);
  } else {
    el.addEventListener('pointerdown', e=>{
      if(!begin(toLocal(e.clientX, e.clientY))) return;
      e.preventDefault();
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
    });
    el.addEventListener('pointermove', e=>{ if(drag) move(toLocal(e.clientX, e.clientY)); });
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('lostpointercapture', end);
  }
}

function rightClear(){
  RT.pid = null; RT.j2 = null;
  RT.swipeY = null; RT.swipeArm = false; RT.swipeJumpY = 0; RT.guard = 0;
  T.fire = false;
  // 注意：**不**清 PJ —— 跳是独立冲量、抬手掐不断（跳满一整跳，魂斗罗定稿手感）；
  //       也正因如此，「按住不动」永远不会自己跳，落地后自然不会有第二次（老杨的原始诉求）。
}
function swipeTh(){
  return Math.max(8, Math.min(innerWidth, innerHeight) * JUMP_SWIPE);
}
function padSwipe(y){
  if(RT.guard > 0){ RT.guard--; RT.swipeY = y; RT.swipeArm = true; return; }
  if(RT.swipeY === null){ RT.swipeY = y; RT.swipeArm = true; return; }
  const th = swipeTh();
  if(RT.swipeArm){
    if(Math.abs(y - RT.swipeY) >= th){               // 纵向离按下点够远 → 跳
      jumpA(true);                                   // 一次冲量（26 帧，抬手掐不断）
      RT.swipeArm = false; RT.swipeJumpY = y;
    }
  } else if(Math.abs(y - RT.swipeJumpY) >= th * SWIPE_REARM){   // 回拉够 → 重新预备
    RT.swipeArm = true; RT.swipeY = y;
  }
}
function bindRight(zone){
  function down(t){
    if(!inPlay()){ tapStart(); return; }
    // （第十七轮：四个兜底键已是右上角的真实按钮 —— 右半屏不再做任何位置判定）
    if(RT.pid !== null){
      // 已经有一根手指在按（= 正在出 B 键）：第二根手指落下 = 跳（备用通路，靠触点次序判定）。
      if(TWO_FINGER_JUMP && RT.j2 === null){
        RT.j2 = t.id;
        jumpA(true);                                // 一次冲量（26 帧，抬手掐不断）
      }
      return;
    }
    RT.pid = t.id;
    RT.swipeY = t.p.y; RT.swipeArm = true; RT.swipeJumpY = 0;
    RT.guard = JUMP_GUARD_MOVES;
    // ★【按下本身不跳】只出 B 键（打 / 跑），按住保持。跳靠「纵向滑动」或「第二根手指」。
    //   —— 第十五轮定稿：位置不再参与判定，所以「按住」永远不会自己跳、落地后也不会有第二次。
    T.fire = true;                                  // 一接触就出 B 键，按住保持（助跑靠它）
    hideHintSoon();                                 // 玩家开始操作了，提示条让位
  }
  function move(t){
    if(RT.pid === null || t.id !== RT.pid) return;
    padSwipe(t.p.y);                                // 纵向动一下 = 跳（唯一由移动触发的跳）
  }
  function up(t){
    if(t && RT.j2 !== null && t.id === RT.j2){      // 第二根手指抬起
      RT.j2 = null;                                 // 冲量不受抬手影响（跳满一整跳，不清 PJ）
      return;
    }
    if(RT.pid === null || (t && t.id !== RT.pid)) return;
    rightClear();
  }
  if(HAS_TOUCH){
    const w = t=>({id:t.identifier, p:toLocal(t.clientX, t.clientY), raw:t});
    zone.addEventListener('touchstart', e=>{ e.preventDefault();
      for(const t of e.changedTouches) down(w(t)); }, {passive:false});
    zone.addEventListener('touchmove', e=>{ e.preventDefault();
      for(const t of e.changedTouches) move(w(t)); }, {passive:false});
    const end = e=>{ e.preventDefault(); for(const t of e.changedTouches) up(w(t)); };
    zone.addEventListener('touchend', end, {passive:false});
    zone.addEventListener('touchcancel', end, {passive:false});
  } else {
    const w = e=>({id:e.pointerId, p:toLocal(e.clientX, e.clientY), raw:e});
    zone.addEventListener('pointerdown', e=>{ e.preventDefault();
      try{ zone.setPointerCapture(e.pointerId); }catch(_){}
      down(w(e)); });
    zone.addEventListener('pointermove', e=>{ if(e.buttons) move(w(e)); });
    zone.addEventListener('pointerup', e=>{ e.preventDefault(); up(w(e)); });
    zone.addEventListener('pointercancel', e=>{ e.preventDefault(); up(w(e)); });
    zone.addEventListener('lostpointercapture', ()=>{ if(RT.pid!==null) up(null); });
  }
  zone.addEventListener('contextmenu', e=>e.preventDefault());
}

/* ---------------- 实体键（顶栏 START/SELECT + 右上角四钮 A红/A黑/B红/B黑） ----------------
   一堆真实按钮，专治「按键没地方按 / 手势猜意图乱触发」。

   ★ 两类键下发方式**完全不同**，别混：
     · START / SELECT = **冲量**（4 帧）—— 边沿触发，游戏只在「上帧没按、这帧按了」
       那一下认一次；手指点得快可能正好落两帧之间，按住 4 帧保证边沿一定被看见。
       **绝不因为手指按住不放就连续发** —— 连发正是玛丽3 地图横条连翻的元凶。
     · A = **电平**（按住期间一直发）—— 跳需要持续按住才跳得高；
       按住不放 = 一直按着，抬手立刻松，跟真实的按键一模一样。
       绝不能用冲量：4 帧就放掉的话，长按跳不高、蓄力全废。

   触摸与鼠标分开绑：触摸设备走 touchstart/end，桌面走 pointerdown/up，
   避免 pointer 与 touch 双触发、一次按压发两遍。 */
function bindSysKeys(){
  // 元素在「布局」一节已取好（顶部统一声明）；缺一个不能让整个 init 崩掉
  const stopAll = e => {
    if(!e) return;
    if(e.preventDefault) e.preventDefault();
    if(e.stopPropagation) e.stopPropagation();
  };
  const realCount = t => !t || !t.changedTouches || t.changedTouches.length > 0;

  /* 冲量键：按下发一次，抬手复位（START / SELECT） */
  function bindImpulse(el, act){
    if(!el) return;
    if(HAS_TOUCH){
      el.addEventListener('touchstart', e=>{ stopAll(e);
        if(realCount(e)) act(); el.classList.add('on'); }, {passive:false});
      const off = e=>{ stopAll(e); el.classList.remove('on'); };
      el.addEventListener('touchend', off, {passive:false});
      el.addEventListener('touchcancel', off, {passive:false});
    } else {
      el.addEventListener('pointerdown', e=>{ stopAll(e); act(); el.classList.add('on'); });
      const off = e=>{ stopAll(e); el.classList.remove('on'); };
      el.addEventListener('pointerup', off);
      el.addEventListener('pointercancel', off);
      el.addEventListener('lostpointercapture', off);
    }
  }
  /* 电子键：按住期间保持按下、按下即高亮（.on），抬手才松 —— 右上角四个功能键走这里。
     连发相位由 COR 自己管，没按就复位，绝不空转。 */
  function bindHold(el, setOn){
    if(!el) return;
    if(HAS_TOUCH){
      el.addEventListener('touchstart', e=>{ stopAll(e);
        if(realCount(e)){ setOn(true); el.classList.add('on'); } }, {passive:false});
      const off = e=>{ stopAll(e); setOn(false); el.classList.remove('on'); };
      el.addEventListener('touchend', off, {passive:false});
      el.addEventListener('touchcancel', off, {passive:false});
    } else {
      el.addEventListener('pointerdown', e=>{ stopAll(e); setOn(true); el.classList.add('on'); });
      const off = e=>{ stopAll(e); setOn(false); el.classList.remove('on'); };
      el.addEventListener('pointerup', off);
      el.addEventListener('pointercancel', off);
      el.addEventListener('lostpointercapture', off);
    }
  }

  // START / SELECT：现在是顶栏的小胶囊（和「↺ 重置」同款），走冲量（按下发一次）
  bindImpulse(startEl, ()=>{ initAudio(); pressStart();  hideHintSoon(); });
  bindImpulse(selEl,   ()=>{ initAudio(); pressSelect(); hideHintSoon(); });
  /* 右上角四个功能键（老杨 2026-10-09 第十七轮）：
     按住期间保持按下、抬手即松 —— 走 COR 通道，与常规手势完全独立
     （第十九轮：顶栏又有了「A·单发 / B·单发」开关，但那两个只管常规手势，管不到这四个钮）。
     键面只写大写字母：红 = 连发、黑 = 单发。「A 黑」= 原来的红色实体 A 钮（跳/确认/进关卡）。 */
  if(syskeysEl){
    for(const [id, k] of FNKEYS){
      const el = document.getElementById(id);
      bindHold(el, on => { if(on) initAudio(); hideHintSoon();
                           on ? cornerDown(k, k) : cornerUp(k); });
      bindKeyDrag(el, k);          // 暂停中可拖：按键监听照绑，但暂停时 cornerDown 直接 return
    }
  }

  for(const el of [startEl, selEl]) if(el) el.addEventListener('contextmenu', e=>e.preventDefault());
}

/* ------------------------- 触摸存活表（全量快照） -------------------------
   与魂斗罗 v16 同一套：摇杆和射击都是「有状态」的（按下置位、抬手清位），
   而移动端有一类「有去无回」的事件 —— touchcancel（被系统手势接管）之后
   它不再产生任何事件，连 touchend 都没有；touchend 本身也可能丢。
   一旦丢，RT.pid / St.on 就永远举着牌子 → 方向锁死、新手指进不来。

   正解不是「谁减了谁没减」的计数（target 会报到 body/document，减不掉就永久漂移），
   而是用每次触摸事件的 e.touches —— 全量、幂等、与 target 无关 —— 重建 LIVE，
   并在**同一个事件里**就把两个半屏校正掉。状态最多错到下一次触摸事件为止。 */
/* 是不是触摸设备 —— 全文件只判这一次。
   为什么要单独拎出来：触摸设备有一套「靠 e.touches 重建存活表」的自愈机制，
   而鼠标/触控板环境永远拿不到 touches，那套自愈必须整个关掉，
   否则会每帧误判「手指已抬起」把摇杆清光。绑事件、做自愈都看这个开关。 */
const HAS_TOUCH = ('ontouchstart' in window);

const LIVE = new Set();
const leftStarters = new Set();          // 曾在左半区按下过的手指 —— 只有它们有资格当摇杆
function syncTouchLive(e){
  LIVE.clear();
  for(const t of e.touches) LIVE.add(t.identifier);
  if(St.on && !LIVE.has(St.pid)) stickClear();
  if(RT.pid !== null && !LIVE.has(RT.pid)) rightClear();
}
(function touchCounter(){
  for(const ty of ['touchstart','touchmove','touchend','touchcancel'])
    document.addEventListener(ty, syncTouchLive, true);
  for(const ty of ['gesturestart','gesturechange','gestureend'])
    document.addEventListener(ty, e=>e.preventDefault(), {passive:false});
})();

function pollPad(){
  if(PJ.frames > 0) PJ.frames--;
  /* 「手指还在不在屏幕上」只有触摸设备答得上来（LIVE 靠 e.touches 重建）。
     ⚠️ 鼠标 / 触控板环境（没有 ontouchstart）LIVE **永远为空**，
        若无条件按 LIVE 校验，就会每帧把摇杆清掉 ——
        表现为「鼠标拖动摇杆完全不动」，而手指真的按着时又被误判为已抬手。
     ⇒ 只在触摸设备上启用这套自愈；指针设备交给 pointerup/pointercancel 管。 */
  if(HAS_TOUCH){
    if(St.on && !LIVE.has(St.pid)) stickClear();
    if(RT.pid !== null && !LIVE.has(RT.pid)) rightClear();
    cornerSweep();               // 功能键自愈：手指都抬了却还挂着按下状态 → 清掉
  }
}

/* ------------------------- 全屏 + 横屏 ------------------------- */
const R90 = {on:false};
let LW = 0, LH = 0;
const wrapEl = document.getElementById('wrap');

function readSize(){
  const W = innerWidth, H = innerHeight;
  if(W < H){ R90.on = true; LW = H; LH = W; }
  else      { R90.on = false; LW = W; LH = H; }
  wrapEl.classList.toggle('r90', R90.on);
  wrapEl.style.width  = LW + 'px';
  wrapEl.style.height = LH + 'px';
}
function toLocal(cx, cy){
  if(!R90.on) return {x:cx, y:cy};
  return { x: cy, y: (innerWidth - cx) };
}
function goFullscreen(){
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
  if(!req) return Promise.resolve(false);
  return new Promise(res=>{
    try{ const r = req.call(el); if(r&&r.then) r.then(()=>res(true)).catch(()=>res(false)); else res(true); }
    catch(e){ res(false); }
  });
}
function lockLandscape(){
  const so = screen.orientation;
  if(!so || !so.lock) return Promise.resolve(false);
  return new Promise(res=>{ try{ so.lock('landscape').then(()=>res(true)).catch(()=>res(false)); }catch(e){ res(false); } });
}

/* ------------------------- 虚拟摇杆（左半屏，不可见） -------------------------
   按下左半屏任意位置 → 该点成为控制原点；滑动按「相对原点的位移」判 8 方向；
   抬手 → 方向归零；下次按下重新取原点。
   写 T.left/right/up/down，因此与键盘、与右半屏完全复用同一套 held()。 */
const DEAD_ZONE = 14;
const St = {on:false, pid:-1, ox:0, oy:0, dx:0, dy:0};
function stickClear(){
  St.on = false; St.pid = -1;
  T.left = T.right = T.up = T.down = false;
}
function stickApply(dx, dy){
  const d = Math.hypot(dx, dy);
  if(d < DEAD_ZONE){ T.left = T.right = T.up = T.down = false; St.dx = dx; St.dy = dy; return; }
  const a = Math.atan2(dy, dx);
  const c = Math.cos(a), s = Math.sin(a);
  const ah = Math.abs(c) > 0.9238795;    // cos(22.5°)
  const av = Math.abs(s) > 0.9238795;
  if(ah && !av){ T.left = c < 0; T.right = c > 0; T.up = false; T.down = false; }
  else if(av && !ah){ T.up = s < 0; T.down = s > 0; T.left = false; T.right = false; }
  else if(!ah && !av){ T.up = s < 0; T.down = s > 0; T.left = c < 0; T.right = c > 0; }
  else { T.left = T.right = T.up = T.down = false; }
  St.dx = dx; St.dy = dy;
}
function bindStick(zone){
  const IS_TOUCH = HAS_TOUCH;             // 触摸设备标志（顶部统一定义）
  const down = (id, p)=>{
    // 非游玩状态（暂停中）点左半屏 = 继续游戏。
    //（第十九轮：启动展示页已删，这里不再有「把展示页补回来」那回事。）
    if(!inPlay()){ tapStart(); return; }
    /* ⚠️ 这里**绝不能再发 START**（曾经有过，已删除）。
       原因：左半屏按下既要定摇杆原点、又要当 START，属于「一个手势猜两种意图」。
           手指压着屏幕拖动时，浏览器会把同一次按压判成反复 down，
           START 跟着被推着连发 —— 玛丽3 一进地图，关卡横条就被推着连翻，看起来像卡死。
       ⇒ 系统键的归宿是**顶栏那两个小胶囊**（见 bindSysKeys），有自己的位置就不打架。 */
    hideHintSoon();          // 玩家开始操作了，提示条让位
    // ★ 同 id 再次按下（系统静默回收了旧手指、又复用了同一个 identifier）：
    //   必须当场刷新锚点，否则方向会用「旧手指的起点」推算，一偏就锁死朝前。
    if(St.on && id === St.pid){
      St.ox = p.x; St.oy = p.y; St.dx = 0; St.dy = 0;
      T.left = T.right = T.up = T.down = false;
      return;
    }
    // 只有在控的那根手指**真的还在屏幕上**时才忽略后续触点。
    // 光看 St.on 就 return 的话，某根手指被系统静默 cancel（牌子没摘）之后，
    // 所有后来的手指都会被挡在门外。
    if(St.on && (!IS_TOUCH || LIVE.has(St.pid))) return;
    St.on = true; St.pid = id;
    St.ox = p.x; St.oy = p.y; St.dx = 0; St.dy = 0;
    T.left = T.right = T.up = T.down = false;
  };
  const move = (id, p)=>{
    if(!St.on || id !== St.pid) return;
    stickApply(p.x - St.ox, p.y - St.oy);
  };
  const up = id=>{
    if(!St.on || (id != null && id !== St.pid)) return;
    stickClear();
  };
  if(HAS_TOUCH){
    const w = t=>({id:t.identifier, p:toLocal(t.clientX, t.clientY)});
    zone.addEventListener('touchstart', e=>{ e.preventDefault();
      for(const t of e.changedTouches){
        leftStarters.add(t.identifier);
        const q = w(t); down(q.id, q.p);
      } }, {passive:false});
    zone.addEventListener('touchmove', e=>{ e.preventDefault();
      // 兜底接管：只在「确实在左半区按下过的手指」里挑 —— 绝不用漂移到左区的右手手指抢摇杆
      if(!St.on && inPlay() && e.changedTouches.length){
        for(const t of e.changedTouches){
          if(leftStarters.has(t.identifier)){ const q = w(t); down(q.id, q.p); break; }
        }
      }
      for(const t of e.changedTouches){ const q = w(t); move(q.id, q.p); } }, {passive:false});
    const end = e=>{ e.preventDefault();
      for(const t of e.changedTouches){ leftStarters.delete(t.identifier); up(t.identifier); } };
    zone.addEventListener('touchend', end, {passive:false});
    zone.addEventListener('touchcancel', end, {passive:false});
  } else {
    const w = e=>({id:e.pointerId, p:toLocal(e.clientX, e.clientY)});
    zone.addEventListener('pointerdown', e=>{
      if(inPlay()) e.preventDefault();
      // setPointerCapture 在「指针已经抬起 / 非活跃指针」时会抛 NotFoundError，
      // 一抛异常整个处理函数就中断，摇杆直接失灵 —— 必须兜住。
      try{ zone.setPointerCapture(e.pointerId); }catch(_){}
      const q = w(e); down(q.id, q.p);
    });
    zone.addEventListener('pointermove', e=>{ if(!e.buttons) return; e.preventDefault();
      const q = w(e); move(q.id, q.p); });
    zone.addEventListener('pointerup', e=>{ e.preventDefault(); up(e.pointerId); });
    zone.addEventListener('pointercancel', e=>{ e.preventDefault(); up(e.pointerId); });
    zone.addEventListener('lostpointercapture', e=>up(e.pointerId));
  }
  zone.addEventListener('contextmenu', e=>e.preventDefault());
}
addEventListener('blur', ()=>{ stickClear(); rightClear(); cornerClearAll(); });
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ stickClear(); rightClear(); cornerClearAll(); }

});

/* ------------------------- 布局 ------------------------- */
/* （cv / ctx / imgData 在「渲染」一节声明，layout 里直接用） */
const rotEl    = document.getElementById('rotate');
const padLEl   = document.getElementById('padL');
const padREl   = document.getElementById('padR');
const topbarEl = document.getElementById('topbar');
/* （第十九轮删除：bootEl —— 启动展示页 #boot 已按老杨要求整页去掉，页面加载完直接进游戏。） */
const hintEl   = document.getElementById('hint');
const syskeysEl = document.getElementById('syskeys');
const startEl   = document.getElementById('btnStart');   // 现在在顶栏（和「↺ 重置」同款小胶囊）
const selEl     = document.getElementById('btnSelect');  // 同上
const isTouch = matchMedia('(pointer:coarse)').matches
             || (('ontouchstart' in window) && matchMedia('(any-pointer:coarse)').matches);

function safePx(side){
  if(R90.on) return (side==='left'||side==='bottom') ? 8 : 0;
  const v = getComputedStyle(document.documentElement).getPropertyValue('--sa-'+side);
  return parseFloat(v) || 0;
}
function layout(){
  readSize();
  const W = LW, H = LH;
  const rotOn = isTouch && !R90.on && W < H;
  rotEl.style.display = rotOn ? 'flex' : 'none';
  padLEl.style.display = (isTouch && !rotOn) ? 'block' : 'none';
  padREl.style.display = (isTouch && !rotOn) ? 'block' : 'none';
  if(!cv) return;
  // 画布尺寸/位置：严格按 4:3 算一个能塞进屏幕的盒子，居中放置。
  // 幅面本来就是 256×240 = 16:15 的位图，盒子按 4:3 给足横向余量，与真机观感一致。
  const boxW = Math.min(W, H * 4/3);
  const boxH = Math.min(H, W * 3/4);
  cv.style.width  = Math.floor(boxW) + 'px';
  cv.style.height = Math.floor(boxH) + 'px';
  cv.style.left = Math.floor((W - boxW) / 2) + 'px';
  cv.style.top  = Math.floor((H - boxH) / 2) + 'px';
  topbarEl.style.padding = (safePx('top')+6)+'px '+(safePx('right')+10)+'px 0 '+(safePx('left')+10)+'px';
  // 右上角四个功能键（老杨 2026-10-09 第十七轮定稿；第十九轮改成**各自绝对定位、暂停可拖**）：
  // 默认仍是两列两行、间距拉开（0.45 倍直径），钉在**画布盒子之内**、躲开顶栏；
  // 只要老杨拖过（FKEY_POS 里记着），就用他拖到的位置 —— placeKey 会把它夹在屏幕内。
  const dFn = Math.max(44, Math.min(70, Math.round(Math.min(W, H) * 0.13)));
  baseFn = dFn;                                   // 自适应直径留个底：步进范围、夹取都按它算
  const fnGap = Math.round(dFn * 0.45);
  if(syskeysEl){
    // 「钉在画布盒子内」+「躲开顶栏」：4:3 屏幕（盒子铺满）时顶栏就在右上角，
    // 取两者里更靠下的那个，保证四个钮的默认位不会被顶栏压住。
    const inBox   = Math.floor((H - boxH) / 2) + safePx('top') + 2;
    const belowTb = (topbarEl ? (topbarEl.offsetHeight || 40) : 40) + 2;
    const top0    = Math.max(inBox, belowTb);
    const rightEdge = W - (Math.floor((W - boxW) / 2) + safePx('right') + 2);
    const cA = rightEdge - dFn / 2;              // 右列（A）
    const cB = cA - dFn - fnGap;                 // 左列（B）
    const rR = top0 + dFn / 2;                   // 上排（红）
    const rS = rR + dFn + fnGap;                 // 下排（黑）
    const DEF_POS = { cb:{x:cB,y:rR}, ca:{x:cA,y:rR}, sb:{x:cB,y:rS}, sa:{x:cA,y:rS} };
    for(const [id, k] of FNKEYS){
      const el = document.getElementById(id);
      if(!el) continue;
      // 尺寸：老杨在编辑态里改过就用他改的（FKEY_SIZE），否则用按屏幕算的自适应直径。
      // 走 keySizeOf() 而不是直接读表 —— 它按**本屏**的 baseFn 再夹一次 0.6×~1.6×，
      // 这样换台手机 / 换横竖屏之后，老存档里那个 px 值不会把钮撑到离谱。
      // 必须先设尺寸再 placeKey —— placeKey 拿 offsetWidth 夹取，顺序反了会夹错。
      applyKeySize(el, k, keySizeOf(k));
      const p = FKEY_POS[k] || DEF_POS[k];
      placeKey(el, k, p.x, p.y, false);          // 应用（不覆盖用户存的位置）
    }
  }
  // 开场大字提示卡：位置由 CSS 居中管（left:50%/top:50% + translate(-50%,-50%)），
  // 第二十二轮起不再由 JS 摆到左上角 —— 也就不再需要给右上角四钮让路算宽度了。
  // （留一句说明：CSS 的 max-width 用 vw 单位，横屏手机上够用。）
  // 第二十八轮：复位块并进 #sizeBar 那一排了，布局全交给 flex，这里不用再摆位。
}
addEventListener('resize', layout);
addEventListener('orientationchange', ()=>setTimeout(layout,120));
addEventListener('fullscreenchange', layout);

/* ------------------------- 渲染 -------------------------
   jsnes 的 onFrame 给的是 61440 个 0x00RRGGBB 整数（256×240）。
   直接拆通道写进 ImageData、putImageData 到原生分辨率画布（1:1，零缩放开销），
   显示端的放大交给 CSS（pixelated），只缩一次，像素最锐利。 */
let cv, ctx, imgData;
function initRender(){
  cv.width = VW; cv.height = VH;
  ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  imgData = ctx.createImageData(VW, VH);
}
function onFrame(buf){
  /* 缓冲恒为 61440 个像素。每个像素是 0x00RRGGBB 的整数 ——
     直接取整数值拆通道，不是 RGB 三元组（老写法按 i*3 读是踩过的坑）。 */
  const d = imgData.data;
  const n = VW*VH;
  for(let i=0, j=0; i<n; i++, j+=4){
    const c = buf[i];
    d[j]   = (c >> 16) & 0xff;
    d[j+1] = (c >> 8)  & 0xff;
    d[j+2] = c & 0xff;
    d[j+3] = 255;
  }
  ctx.putImageData(imgData, 0, 0);
}

/* ------------------------- 流程控制 ------------------------- */
function inPlay(){ return running && !paused; }
let started = false;
function startRun(){
  if(!nes) return;
  if(started && !paused) return;      // 正在跑就别重复开局
  if(paused){ togglePause(); return; }
  started = true;
  LDG.classList.add('gone');          // （第十九轮起没有启动展示页了，这里只管加载页）
  running = true; paused = false;
  stickClear(); rightClear(); cornerClearAll();
  lastTs = performance.now(); acc = 0;
  showHint();
}

/* 开场大字提示卡的显隐（第二十二轮改了语义）：
   **不自动消失** —— 老杨要「必须点一下才消失」。所以这里没有计时器；
   收起只有一条路：玩家第一次碰屏幕（各操作入口直接调 hideHintSoon，wrap 上再兜一层）。
   切后台回来**不再重亮**（那是老版「随时能看」的用法，现在是开局一次性大字卡，重亮只会烦）。 */
function showHint(){
  if(!hintEl) return;
  hintEl.classList.remove('dim');
  // 重播一次入场动画（卡片一直挂在 DOM 里，CSS 动画早在页面加载时就播完了，
  // 这里强制重排让它「开局那一下」再推一次 —— 老杨要的醒目就在这一下）。
  if(hintEl.style){
    hintEl.style.animation = 'none';
    void hintEl.offsetWidth;
    hintEl.style.animation = '';
  }
}
function hideHintSoon(){ if(hintEl) hintEl.classList.add('dim'); }
/* 启动流程：**先把游戏开起来，全屏/横屏随后补**。
   ⚠️ 这里踩过一个坑：原先写成 await goFullscreen() → await lockLandscape() → startRun()，
      结果在部分浏览器上 requestFullscreen 的 Promise **永不 resolve 也不 reject**
      （比如非用户手势上下文、被扩展拦下、或某些 WebView），
      await 就直接挂死 —— 页面永远停在「正在准备模拟器」，而且不报任何错。
   ⇒ 铁律：**全屏、锁方向这类「锦上添花」的浏览器能力，绝不能挡在必经路径上。**
      一律改成 setFullscreenSoon()：超时兜底 + 无视失败，开局不受影响。 */
function setFullscreenSoon(){
  // 两条都只管发出去，不 await —— 失败/挂起都不影响游戏
  const guard = (p) => Promise.resolve(p).catch(()=>{});   // 吞掉 reject，避免 unhandledrejection
  guard(goFullscreen().then(ok => { if(ok) guard(lockLandscape()); }));
  // 保险：2 秒后如果还没到位，再补发一次（有些浏览器首次会被静默丢弃）
  setTimeout(()=>{ guard(goFullscreen()); }, 2000);
}
/* 第十九轮：启动展示页删了，这里不再有「点一下才开局」的入口 —— 页面一加载完就直接 startRun()，
   （见 init 末尾）；全屏 / 横屏交给 setFullscreenSoon()，第一个真实手势里再补发一次。
   ⚠️ 删掉展示页的副作用：**开局那一下不再落在用户手势里**，全屏大概率被浏览器拒。
      所以 init 里挂了一次性的「首个手势补发全屏」。 */
/* 重置：重新载入 ROM，等于给游戏机按了一次电源键。
   键盘 3 / R、顶栏「↺ 重置」都走这里。 */
function resetNES(){
  if(!nes) return;
  try{ nes.loadROM(ROM_STR); }catch(e){ fail('重置失败：' + ((e && e.message) || e)); return; }
  stickClear(); rightClear(); cornerClearAll();
  SYSJ.start = 0; SYSJ.select = 0;   // 清掉系统键冲量，免得带进新局
  LDG.classList.add('gone');
  ERR.style.display = 'none';
  started = true; running = true; paused = false;
  document.getElementById('btnPause').textContent = 'Ⅱ 调整键';
  setKeyEdit(false);                 // 重置后不该停在「调位置」态
  lastTs = performance.now(); acc = 0;
}
function togglePause(){
  if(!nes) return;
  if(!running){ startRun(); return; }
  paused = !paused;
  document.getElementById('btnPause').textContent = paused ? '▶ 继续' : 'Ⅱ 调整键';
  /* 暂停 = 进「调位置」态（老杨 2026-10-09 第十九轮）：四个圆钮变虚线、可逐个拖，
     拖到哪存哪；编辑态底部同时出现一键复位胶囊（第二十六轮起另可选中调大小）。
     继续游戏即退出，拖拽期间不触发按键。 */
  setKeyEdit(paused);
  if(paused){ stickClear(); rightClear(); }        // 暂停时把正在按的清掉，免得挂住
  if(!paused){ lastTs = performance.now(); acc = 0; }
}
function toggleSound(){
  soundOn = !soundOn;
  document.getElementById('btnSound').textContent = soundOn ? '♪ 开' : '♪ 关';
  if(audioCtx){ if(soundOn && audioCtx.state==='suspended') audioCtx.resume(); }
}
/* 左右半屏「点一下 = 开局」的共用入口。
   ★ 第二十八轮（老杨报的 bug）：「调键时点非按钮处就退出调整模式」的真正根因在这儿 ——
     左右半屏的 down() 都是 `if(!inPlay()) tapStart()`，而 inPlay() = running && !paused，
     所以**暂停中点屏幕任意一处**（左右半屏都是 z-index 9 的整屏透明层，盖住 canvas）
     都会走到这里 → startRun() → 暂停时 startRun() 转 togglePause() → 直接恢复运行、退出编辑态。
     （上一轮只挡了 canvas 的 pointerdown，那层根本收不到点击 —— 白改。）
     现在的口径：暂停中（编辑态）点哪儿都不恢复游戏，要恢复只走顶栏「▶ 继续」；
     没开局时点屏幕照常开局。 */
function tapStart(){ if(paused) return; startRun(); }

/* ------------------------- 音频 -------------------------
   jsnes 的 onAudioSample 是**逐采样点**回调（44100 次/秒），
   绝不能在回调里逐点调 WebAudio（会卡死）。
   做法：先塞进一个环形队列，再用 requestAnimationFrame（约 60Hz）
   成批丢给 AudioBufferSourceNode 播放。 */
let audioCtx = null, sampleQueue = [], nodeNextTime = 0;
const SAMPLE_RATE = 44100;
function initAudio(){
  try{
    if(audioCtx){ if(audioCtx.state==='suspended') audioCtx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    audioCtx = new AC({ sampleRate: SAMPLE_RATE });
    nodeNextTime = audioCtx.currentTime;
  }catch(e){ audioCtx = null; }
}
function onAudioSample(l, r){
  if(!audioCtx || !soundOn) return;
  if(sampleQueue.length > SAMPLE_RATE) sampleQueue.shift();   // 防堆积
  sampleQueue.push((l + r) * 0.5);
}
function pumpAudio(){
  if(!audioCtx || !soundOn || sampleQueue.length < 512) return;
  const data = new Float32Array(sampleQueue.splice(0, sampleQueue.length));
  const buf = audioCtx.createBuffer(1, data.length, SAMPLE_RATE);
  buf.getChannelData(0).set(data);        // getChannelData 比 copyToChannel 兼容面广（老 Safari）
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  if(nodeNextTime < now) nodeNextTime = now + 0.02;          // 落后太多就重置，避免雪崩
  src.start(nodeNextTime);
  nodeNextTime += data.length / SAMPLE_RATE;
}

/* ------------------------- 初始化 ------------------------- */
function mark(step){
  // 加载期进度标记：卡在哪一步一眼可见（只在加载页还在时生效）
  if(LDG && !LDG.classList.contains('gone')) LDG.textContent = '正在准备模拟器… ' + step;
}
function init(){
  mark('1/5 画布');
  cv = document.getElementById('game');
  initRender();

  mark('2/5 触摸区');
  bindStick(padLEl);
  bindRight(padREl);
  // 开场大字提示卡：点屏幕任何地方都算「点了一下」→ 收卡（老杨要「必须点一下才消失」）。
  // 捕获阶段监听，先收卡再走正常操作；hideHintSoon 幂等，触摸设备上两路都发也无害。
  wrapEl.addEventListener('pointerdown', hideHintSoon, true);
  wrapEl.addEventListener('touchstart', hideHintSoon, true);

  mark('3/5 按钮');
  bindSysKeys();                                   // 顶栏 START/SELECT 胶囊 + 右上角四个功能圆钮
  document.getElementById('btnSound').addEventListener('click', e=>{ if(e.stopPropagation) e.stopPropagation(); initAudio(); toggleSound(); });
  document.getElementById('btnPause').addEventListener('click', e=>{ if(e.stopPropagation) e.stopPropagation(); togglePause(); });
  document.getElementById('btnReset').addEventListener('click', e=>{ if(e.stopPropagation) e.stopPropagation(); initAudio(); resetNES(); });
  /* 顶栏「A·单发 / A·连发」「B·单发 / B·连发」（第十九轮按老杨要求恢复）：
     点一下在单发 ↔ 连发之间切，连发时变红底；只管常规手势（右半屏按住 / 跳跃 / 键盘 J、K），
     右上角四个钮照旧各按各的。选择按游戏存 localStorage，下次打开还是这一档（默认单发）。 */
  loadFireMode();
  refreshFireBtn();
  const bindFireToggle = (id, isOn, setOn)=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('click', e=>{
      if(e && e.stopPropagation) e.stopPropagation();
      setOn(!isOn()); saveFireMode(); refreshFireBtn(); hideHintSoon();
    });
  };
  bindFireToggle('btnFireA', ()=>autoA, v=>{ autoA = v; phA = false; });   // 切模式时复位相位，防幻影
  bindFireToggle('btnFireB', ()=>autoB, v=>{ autoB = v; phB = false; });
  /* 顶栏「◱ 隐藏键 / ◱ 显示键」（第二十轮，老杨要求）：
     一键收起 / 叫回右上角四个功能钮；状态按游戏记 localStorage，下次打开还是上次的选择。 */
  loadKeysVis();
  applyKeysVis();
  const bkEl = document.getElementById('btnKeys');
  if(bkEl) bkEl.addEventListener('click', e=>{
    if(e && e.stopPropagation) e.stopPropagation();
    fkeysHidden = !fkeysHidden;
    saveKeysVis(); applyKeysVis();
    setKeyEdit(paused);                            // 暂停中隐藏：顺手把「拖动/复位」提示也收掉
    if(typeof layout === 'function') layout();     // 提示条让路宽度跟着变
    hideHintSoon();
  });
  /* 「✥ 复位」（第二十六轮起它连大小一起管；第二十八轮并进 #sizeBar；第二十九轮定名「复位」）：
     位置 + 大小**一起**还原成出厂状态（老杨选的口径），顺手把选中态也清掉。
     结果回执走读数行：闪一句「复位了」，1.5 秒后回到常态读数。 */
  const rpEl = document.getElementById('resetPos');
  if(rpEl) rpEl.addEventListener('click', e=>{
    if(e && e.stopPropagation) e.stopPropagation();
    resetAllKeys();
    flashSizeVal('复位了：位置和大小都回到出厂');
  });
  /* 大控制条（第二十七轮）：三个块都作用在**当前选中的那个钮**上 —— 没选中就按不动
     （未选中时整条压暗、块上 pointer-events:none，见 #sizeBar.idle 样式）。
     「⊖ 小点 / ⊕ 大点」改一档（≈ 默认直径 8%，0.6×~1.6×）。 */
  const szMinus = document.getElementById('szMinus');
  if(szMinus) szMinus.addEventListener('click', e=>{
    if(e && e.stopPropagation) e.stopPropagation();
    stepKeySize(selKey, -1);
  });
  const szPlus = document.getElementById('szPlus');
  if(szPlus) szPlus.addEventListener('click', e=>{
    if(e && e.stopPropagation) e.stopPropagation();
    stepKeySize(selKey, +1);
  });
  /* （第二十九轮：原「↺ 默认」块的绑定已随块一起删 —— 单钮尺寸还原没独立入口了，
      要还原就按「✥ 复位」整排还原。） */
  /* 启动展示页删掉之后，**开局那一下不再落在用户手势里**，全屏大概率被浏览器拒。
     第一个真实手势（点哪都算，捕获阶段收）里再补发一次 —— 这是唯一能拿到全屏的机会。 */
  const firstGesture = ()=>{
    initAudio();
    setFullscreenSoon();
    document.removeEventListener('pointerdown', firstGesture, true);
    document.removeEventListener('touchstart', firstGesture, true);
  };
  document.addEventListener('pointerdown', firstGesture, true);
  document.addEventListener('touchstart', firstGesture, true);
  /* 第二十八轮：**暂停中（编辑态）点画面不再恢复游戏** ——
     原先这里无条件 startRun()，而 startRun() 在暂停时走 togglePause() 直接恢复了运行，
     表现就是老杨说的「调键时点到非按钮的其他地方，就退出调整模式了」。
     现在：暂停中就什么都不做（要恢复请按顶栏「▶ 继续」），只在「没跑起来」时开局。 */
  cv.addEventListener('pointerdown', e=>{
    e.preventDefault(); initAudio();
    if(paused) return;
    startRun();
  });

  loadKeyPos();                                    // 老杨拖过的圆钮位置（没有就用默认位）
  loadKeySize();                                   // 老杨调过的圆钮大小（没有就用自适应尺寸）
  mark('4/5 布局');
  layout();

  // ---- 载入模拟器与 ROM ----
  mark('5/5 模拟器');
  try{
    if(typeof window.jsnes === 'undefined'){
      throw new Error('模拟器未载入（jsnes 内联脚本未执行成功）'
        + (window.JSNES_ERR ? '\n内部错误：' + (window.JSNES_ERR.message || window.JSNES_ERR) : '')
        + '\n文件大小校验：' + document.documentElement.innerHTML.length + ' 字符');
    }
    if(!ROM_STR || ROM_STR.length < 1000) throw new Error('ROM 未载入或长度异常：' + (ROM_STR?ROM_STR.length:0));
    nes = new window.jsnes.NES({
      onFrame: onFrame,
      onAudioSample: onAudioSample,
      sampleRate: SAMPLE_RATE,
      preferredFrameRate: 60
    });
    // 按键必须走 controllers[p].buttonDown(按钮号) —— NES 的 buttonDown 是双参数（玩家号, 按钮号）
    nesBtn = { buttonDown: (p,b)=>nes.controllers[p].buttonDown(b),
               buttonUp:   (p,b)=>nes.controllers[p].buttonUp(b) };
    nes.loadROM(ROM_STR);
  }catch(ex){
    fail((ex && ex.message) || String(ex));
    return;
  }

  running = true; paused = false;      // 模拟器起来就先跑着（标题画面跟着动）
  started = false;
  /* 第十九轮：不再等玩家点启动页 —— 模拟器一起来就**直接开局**（老杨：精简，直接进游戏界面）。
     全屏 / 横屏只管发出去（setFullscreenSoon 不 await、失败不影响玩），
     真正的全屏在第一个用户手势里再补一次（见 bind 的 firstGesture）。 */
  startRun();
  setFullscreenSoon();

  // ---- 主循环：输入推进固定 60Hz，渲染跟着显示器走 ----
  let last = performance.now();
  function loop(now){
    const dt = Math.min(80, now - last); last = now;
    pollPad();
    if(running && !paused){
      acc += dt;
      const stepMs = 1000/60;
      let n = 0;
      // 单帧最多补 3 步：掉帧时宁可慢放，也不要「追帧」把节奏弄乱
      while(acc >= stepMs && n < 3 && running){ step(); acc -= stepMs; n++; }
      if(acc > stepMs*3) acc = 0;
      pumpAudio();
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

/* 只读探针：给自动化验证用（无头测试里读内部状态）。
   不参与游戏逻辑，挂一个引用而已。 */
window.__probe = {
  nes: () => nes,
  btn: () => nesBtn,
  state: () => ({ running: running, paused: paused, started: started, soundOn: soundOn }),
  held: (a) => held(a),
  pad: () => ({ px: dirX(), py: dirY() }),
  rt: () => RT, st: () => St, live: () => LIVE,
  /* 第十九轮新增：单发/连发开关 + 圆钮位置（自动化验证要读） */
  fireMode: () => ({ autoA: autoA, autoB: autoB }),
  fkeyPos:  () => FKEY_POS,
  keyEdit:  () => !!(syskeysEl && syskeysEl.classList && syskeysEl.classList.contains('edit')),
  clearKeyPos: clearKeyPos,
  /* 第二十轮新增：四个功能键的隐藏状态（自动化验证要读） */
  keysHidden: () => fkeysHidden,
  keysVisible: () => !!(syskeysEl && syskeysEl.classList && !syskeysEl.classList.contains('hid')),
  /* 第二十六轮新增：编辑态里选中的是哪个钮、钮被调成多大（自动化验证要读） */
  sel: () => selKey,
  fkeySize: () => FKEY_SIZE,
  baseFn: () => baseFn,
  resetAllKeys: resetAllKeys,
  stepKeySize: stepKeySize
};

if(document.readyState==='loading') addEventListener('DOMContentLoaded', init); else init();
</script>
</body>
</html>
