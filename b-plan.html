//==================================================================
function drawBackground(){
  // 根据地形类型绘制不同背景
  const tt = game.terrain ? game.terrain.type : 'asteroidRain';
  const td = TERRAIN_DATA[tt];
  // 渐变深空（地形专属色调）
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, td.bgTop); g.addColorStop(0.5, '#0a0820'); g.addColorStop(1, td.bgBot);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // 星云（地形专属色调）
  ctx.globalAlpha=0.10;
  const nebColors = tt==='none' ? ['#3a5a8a','#2a3a6a','#1a2a4a']
    : tt==='asteroidRain' ? ['#8a6a3a','#6a4a2a','#3a2a1a']
    : tt==='laserArray' ? ['#ff3a3a','#aa1a1a','#5c1a1a']
    : tt==='spaceTunnel' ? ['#3a5aff','#1a3a8a','#3a8aaa']
    : ['#ffaa3a','#aa8a2a','#5c4a1a'];
  for(let i=0;i<3;i++){
    const x=(Math.sin(nebula*0.1+i*2)*0.5+0.5)*W, y=(i*220+nebula*10)%H;
    const rg=ctx.createRadialGradient(x,y,0,x,y,160);
    rg.addColorStop(0, nebColors[i]);
    rg.addColorStop(1,'transparent');
    ctx.fillStyle=rg; ctx.fillRect(x-160,y-160,320,320);
  }
  ctx.globalAlpha=1;
  // 星星
  for(const s of stars){ ctx.fillStyle = s.z>0.7?'#ffffff':(s.z>0.4?'#aab8e0':'#556');
    ctx.fillRect(s.x|0,s.y|0,s.s,s.s); }
  // 地形专属背景效果
  if(tt === 'spaceTunnel'){
    drawTunnelBackground();
  } else if(tt === 'asteroidRain'){
    drawAsteroidRainBg();
  } else if(tt === 'laserArray'){
    drawLaserArrayBg();
  } else if(tt === 'minefield'){
    drawMinefieldBg();
  }
}

// 陨石雨背景：远处飘落的小尘埃
function drawAsteroidRainBg(){
  ctx.globalAlpha=0.3;
  for(let i=0;i<15;i++){
    const x = (i*73 + nebula*30) % W;
    const y = (i*127 + nebula*80) % H;
    ctx.fillStyle = '#6a5a4a';
    ctx.fillRect(x|0, y|0, 2, 2);
  }
  ctx.globalAlpha=1;
}

// 激光阵背景：扫描线效果
function drawLaserArrayBg(){
  const scanY = (nebula * 60) % H;
  ctx.globalAlpha=0.06;
  ctx.fillStyle='#ff3a3a';
  ctx.fillRect(0, scanY, W, 2);
  ctx.globalAlpha=0.04;
  ctx.fillRect(0, (scanY+H/3)%H, W, 1);
  ctx.fillRect(0, (scanY+2*H/3)%H, W, 1);
  ctx.globalAlpha=1;
}

// 太空隧道背景：网格线 + 隧道墙壁
function drawTunnelBackground(){
  // 网格透视线
  ctx.globalAlpha=0.08;
  ctx.strokeStyle='#3a7aff';
  ctx.lineWidth=1;
  // 纵向线
  for(let i=0;i<=8;i++){
    const x = (i/8)*W;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  // 横向移动线
  for(let i=0;i<10;i++){
    const y = (i*60 + nebula*80) % H;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.globalAlpha=1;
  // 绘制隧道墙壁
  if(game.terrain && game.terrain.tunnelWalls){
    for(const w of game.terrain.tunnelWalls){
      const leftW = w.gapX;
      const rightX = w.gapX + w.gapW;
      const rightW = W - rightX;
      // 左墙
      const lg = ctx.createLinearGradient(0, w.y, leftW, w.y);
      lg.addColorStop(0, '#1a2a4a'); lg.addColorStop(1, '#3a6aaa');
      ctx.fillStyle = lg; ctx.fillRect(0, w.y, leftW, w.h);
      // 墙壁边缘高亮
      ctx.fillStyle = '#5c9aff'; ctx.fillRect(leftW-3, w.y, 3, w.h);
      ctx.fillStyle = `rgba(92,154,255,0.3)`; ctx.fillRect(leftW-6, w.y, 3, w.h);
      // 右墙
      const rg = ctx.createLinearGradient(rightX, w.y, W, w.y);
      rg.addColorStop(0, '#3a6aaa'); rg.addColorStop(1, '#1a2a4a');
      ctx.fillStyle = rg; ctx.fillRect(rightX, w.y, rightW, w.h);
      // 墙壁边缘高亮
      ctx.fillStyle = '#5c9aff'; ctx.fillRect(rightX, w.y, 3, w.h);
      ctx.fillStyle = `rgba(92,154,255,0.3)`; ctx.fillRect(rightX+3, w.y, 3, w.h);
      // 通道指示光
      ctx.globalAlpha=0.05 + 0.03*Math.sin(nebula*5);
      ctx.fillStyle='#5c9aff';
      ctx.fillRect(w.gapX, w.y, w.gapW, w.h);
      ctx.globalAlpha=1;
    }
  }
}

// 雷区背景：警告标记
function drawMinefieldBg(){
  ctx.globalAlpha=0.04;
  // 斜线警告纹理
  ctx.strokeStyle='#ffdd44';
  ctx.lineWidth=1;
  const off = (nebula*20) % 40;
  for(let i=-2;i<W/40+2;i++){
    const x = i*40 + off;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x+H, H); ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawPlayer(){
  const p=game.p; if(!p) return;
  // ---- 重生动画 ----
  if(p.respawn > 0){
    const elapsed = p.respawnMax - p.respawn;
    const crashTime = 0.8;
    if(elapsed < crashTime){
      // 坠毁阶段：不绘制飞机（只有爆炸粒子）
      return;
    }
    // 飞入阶段：正常绘制飞机（带闪烁无敌效果）
    const cx=p.x+p.w/2, cy=p.y+p.h/2;
    const blink = Math.floor(elapsed*16)%2===0;
    if(blink){ /* 闪烁但仍可见 */ }
    // 引擎火焰（飞入时加大）
    const fl = 6+Math.sin(Date.now()*0.04)*4;
    rrect(cx-4, p.y+p.h, 8, fl, '#ff9b3a');
    rrect(cx-2, p.y+p.h+fl-2, 4, 3, '#ffe14d');
    // 机身
    rrect(p.x+6, p.y, 12, 8, '#2a4a6a');
    rrect(p.x+4, p.y+6, 16, 12, '#5ca0d0');
    rrect(p.x+8, p.y+18, 8, 6, '#2a4a6a');
    rrect(p.x+10, p.y+2, 4, 4, '#80c8ff');
    return;
  }
  const cx=p.x+p.w/2, cy=p.y+p.h/2;
  // ---- 合体/解体过渡动画 ----
  if(p.carrierAnim > 0){
    const cx2 = cx, cy2 = cy;
    const progress = 1 - p.carrierAnim / p.carrierAnimMax;
    const t = Date.now()*0.005;
    if(p.carrierAnimType === 'disassemble'){
      // 解体动画：鹰形闪烁 + 爆裂粒子 + 逐渐透明
      const blink = Math.floor(t*8)%2===0;
      const alpha = p.carrierAnim / p.carrierAnimMax;
      ctx.globalAlpha = blink ? alpha*0.3 : alpha;
      ctx.save();
      ctx.translate(cx2, cy2);
      // 简化鹰形轮廓（发光）
      ctx.shadowColor = '#ffd34d'; ctx.shadowBlur = 10*alpha;
      ctx.fillStyle = `rgba(255,200,80,${0.7*alpha})`;
      // 身体
      ctx.beginPath();
      ctx.moveTo(0, -34);
      ctx.quadraticCurveTo(8, -20, 7, 0);
      ctx.quadraticCurveTo(6, 16, 3, 28);
      ctx.lineTo(0, 36); ctx.lineTo(-3, 28);
      ctx.quadraticCurveTo(-6, 16, -7, 0);
      ctx.quadraticCurveTo(-8, -20, 0, -34);
      ctx.closePath(); ctx.fill();
      // 翅膀
      for(let s=-1; s<=1; s+=2){
        ctx.beginPath();
        ctx.moveTo(0, -2);
        ctx.quadraticCurveTo(s*20, -18, s*50, -14);
        ctx.quadraticCurveTo(s*62, -8, s*46, 2);
        ctx.quadraticCurveTo(s*30, 8, s*14, 6);
        ctx.lineTo(0, -2);
        ctx.closePath(); ctx.fill();
      }
      ctx.shadowBlur = 0;
      // 解体裂纹（闪电状）
      ctx.strokeStyle=`rgba(255,80,30,${0.7*alpha})`; ctx.lineWidth=2;
      ctx.beginPath();
      ctx.moveTo(0,-30); ctx.lineTo(4,-10); ctx.lineTo(-3,5); ctx.lineTo(2,20); ctx.lineTo(-1,35);
      ctx.moveTo(-20,-8); ctx.lineTo(-8,2); ctx.lineTo(-15,12);
      ctx.moveTo(20,-8); ctx.lineTo(8,2); ctx.lineTo(15,12);
      ctx.stroke();
      ctx.restore();
      ctx.globalAlpha=1;
      // 同时画僚机从中心向外飞出
      const flyOut = progress;
      for(let oi=0; oi<p.options.length; oi++){
        const o = p.options[oi];
        const oa = oi*(TAU/4) - Math.PI/2;
        const d = 60 * flyOut;
        const ox = cx2 + Math.cos(oa)*d - 6;
        const oy = cy2 + Math.sin(oa)*d;
        ctx.globalAlpha = flyOut;
        rrect(ox+4, oy, 8, 5, '#2a5f88');
        rrect(ox+2, oy+4, 12, 8, '#5ca0d0');
        rrect(ox+5, oy+12, 6, 3, '#2a5f88');
        rrect(ox+6, oy+1, 4, 3, '#80c8ff');
        ctx.globalAlpha=1;
      }
    } else {
      // 合体动画：充能光环 + 僚机聚拢 + 能量球
      const charge = progress;
      // 外圈充能环（由大到小收缩）
      ctx.strokeStyle=`rgba(255,211,77,${0.6*charge})`; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(cx2, cy2, 60*(1-charge)+10, 0, TAU); ctx.stroke();
      // 能量球（由小到大）
      const ballR = 8 + charge*30;
      const pulse = 0.7+0.3*Math.sin(t*6);
      ctx.fillStyle=`rgba(255,211,77,${0.3*pulse})`;
      ctx.beginPath(); ctx.arc(cx2, cy2, ballR*pulse, 0, TAU); ctx.fill();
      ctx.fillStyle=`rgba(128,200,255,${0.4*pulse})`;
      ctx.beginPath(); ctx.arc(cx2, cy2, ballR*0.6*pulse, 0, TAU); ctx.fill();
      // 中心强光
      ctx.fillStyle=`rgba(255,255,255,${0.5*charge})`;
      ctx.beginPath(); ctx.arc(cx2, cy2, 6*charge, 0, TAU); ctx.fill();
      // 僚机向中心聚拢（位置由 update 设置，这里只绘制）
      for(const o of p.options){
        ctx.globalAlpha = 0.6 + charge*0.4;
        rrect(o.x+4, o.y, 8, 5, '#2a5f88');
        rrect(o.x+2, o.y+4, 12, 8, '#5ca0d0');
        rrect(o.x+5, o.y+12, 6, 3, '#2a5f88');
        rrect(o.x+6, o.y+1, 4, 3, '#80c8ff');
        ctx.globalAlpha=1;
      }
      // 闪电连接线（合体后期）
      if(charge > 0.5 && Math.random() < 0.5){
        for(const o of p.options){
          ctx.strokeStyle=`rgba(255,211,77,${0.6})`; ctx.lineWidth=1;
          ctx.beginPath();
          ctx.moveTo(cx2, cy2);
          const segs=4;
          for(let s=1;s<=segs;s++){
            const tt=s/segs;
            ctx.lineTo(cx2+(o.x+6-cx2)*tt+rand(-4,4), cy2+(o.y+7-cy2)*tt+rand(-4,4));
          }
          ctx.stroke();
        }
      }
    }
    return;
  }
  // ---- 航天母舰模式：全身发光的鹰 ----
  if(p.carrierMode>0){
    const t = Date.now()*0.003;
    const pulse = 0.5+0.5*Math.sin(t*2);
    const flap = Math.sin(t*1.8)*0.15; // 翅膀拍动幅度
    // ===== 外层光晕 =====
    for(let g=3; g>=0; g--){
      const gr = 55 + g*12 + pulse*6;
      ctx.fillStyle=`rgba(255,211,77,${0.06 - g*0.012})`;
      ctx.beginPath(); ctx.arc(cx, cy, gr, 0, TAU); ctx.fill();
    }
    // ===== 左翅（展开上扬） =====
    function drawWing(side){
      const s = side; // 1=右, -1=左
      ctx.save();
      ctx.translate(cx, cy);
      // 翅膀外发光
      ctx.shadowColor = '#ffd34d'; ctx.shadowBlur = 12;
      // 主翅面：从身体根部向外展开，末端上扬
      ctx.fillStyle = `rgba(255,200,80,${0.85+pulse*0.15})`;
      ctx.beginPath();
      ctx.moveTo(0, -2);
      // 翅膀前缘（上弧），末端上扬
      ctx.quadraticCurveTo(s*20, -18-flap*20, s*50, -14-flap*30);
      ctx.quadraticCurveTo(s*62, -8-flap*25, s*46, 2);
      // 翅膀后缘（下弧），带羽毛起伏
      ctx.quadraticCurveTo(s*40, 8, s*30, 6);
      ctx.quadraticCurveTo(s*22, 12, s*14, 8);
      ctx.quadraticCurveTo(s*8, 14, s*4, 6);
      ctx.lineTo(0, -2);
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      // 翅膀内层亮色
      ctx.fillStyle = `rgba(255,240,150,${0.6+pulse*0.2})`;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(s*16, -10-flap*15, s*38, -8-flap*20);
      ctx.quadraticCurveTo(s*44, -4, s*30, 2);
      ctx.quadraticCurveTo(s*16, 6, s*4, 4);
      ctx.closePath();
      ctx.fill();
      // 翅膀最亮核心
      ctx.fillStyle = `rgba(255,255,200,${0.4+pulse*0.3})`;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.quadraticCurveTo(s*12, -6-flap*10, s*24, -4-flap*12);
      ctx.quadraticCurveTo(s*28, 0, s*16, 3);
      ctx.closePath();
      ctx.fill();
      // 翅膀羽毛线条（3根主羽）
      ctx.strokeStyle = `rgba(180,120,30,${0.5})`; ctx.lineWidth = 1;
      for(let f=0; f<3; f++){
        const fy = -2 + f*5;
        ctx.beginPath();
        ctx.moveTo(s*4, fy);
        ctx.quadraticCurveTo(s*24, fy-6-flap*12-f*2, s*44, fy-2-flap*18-f*3);
        ctx.stroke();
      }
      ctx.restore();
    }
    drawWing(-1); // 左翅
    drawWing(1);  // 右翅
    // ===== 鹰身（纺锤形，头朝上） =====
    ctx.save();
    ctx.translate(cx, cy);
    ctx.shadowColor = '#ffe14d'; ctx.shadowBlur = 10;
    // 身体主体
    ctx.fillStyle = `rgba(255,210,80,${0.9+pulse*0.1})`;
    ctx.beginPath();
    ctx.moveTo(0, -34);           // 头顶
    ctx.quadraticCurveTo(8, -20, 7, 0);  // 右身
    ctx.quadraticCurveTo(6, 16, 3, 28);  // 右尾根
    ctx.lineTo(0, 36);            // 尾尖
    ctx.lineTo(-3, 28);           // 左尾根
    ctx.quadraticCurveTo(-6, 16, -7, 0); // 左身
    ctx.quadraticCurveTo(-8, -20, 0, -34);// 左头
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    // 身体高光
    ctx.fillStyle = `rgba(255,245,160,${0.5+pulse*0.3})`;
    ctx.beginPath();
    ctx.ellipse(0, -5, 4, 20, 0, 0, TAU);
    ctx.fill();
    // 最亮核心线
    ctx.fillStyle = `rgba(255,255,220,${0.5+pulse*0.4})`;
    ctx.beginPath();
    ctx.ellipse(0, -8, 2, 14, 0, 0, TAU);
    ctx.fill();
    // ===== 鹰头 =====
    ctx.shadowColor = '#ffe14d'; ctx.shadowBlur = 8;
    ctx.fillStyle = `rgba(255,220,100,${0.9+pulse*0.1})`;
    ctx.beginPath();
    ctx.arc(0, -34, 7, 0, TAU);
    ctx.fill();
    ctx.shadowBlur = 0;
    // 喙（向下尖钩）
    ctx.fillStyle = `rgba(255,180,40,0.9)`;
    ctx.beginPath();
    ctx.moveTo(-3, -33);
    ctx.lineTo(3, -33);
    ctx.lineTo(1, -27);
    ctx.lineTo(-1, -27);
    ctx.closePath();
    ctx.fill();
    // 眼睛（发光）
    ctx.fillStyle = `rgba(255,80,80,${0.8+pulse*0.2})`;
    ctx.beginPath(); ctx.arc(-3, -36, 1.5, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -36, 1.5, 0, TAU); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-3, -36, 0.8, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(3, -36, 0.8, 0, TAU); ctx.fill();
    // ===== 尾羽（展开） =====
    ctx.shadowColor = '#ffd34d'; ctx.shadowBlur = 6;
    ctx.fillStyle = `rgba(255,200,80,${0.8+pulse*0.15})`;
    for(let tf=-2; tf<=2; tf++){
      ctx.beginPath();
      ctx.moveTo(tf*2, 28);
      ctx.quadraticCurveTo(tf*5, 36, tf*7+tf*2, 42);
      ctx.quadraticCurveTo(tf*3, 38, tf*2, 28);
      ctx.closePath();
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    // 尾羽亮线
    ctx.strokeStyle = `rgba(255,245,160,0.5)`; ctx.lineWidth=1;
    for(let tf=-2; tf<=2; tf++){
      ctx.beginPath();
      ctx.moveTo(tf*2, 28);
      ctx.quadraticCurveTo(tf*5, 36, tf*7+tf*2, 42);
      ctx.stroke();
    }
    ctx.restore();
    // ===== 脚爪（两只，向下伸出） =====
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = `rgba(255,180,40,${0.7+pulse*0.2})`; ctx.lineWidth=2;
    for(let foot=-1; foot<=1; foot+=2){
      const fx = foot*6;
      ctx.beginPath();
      ctx.moveTo(fx, 30); ctx.lineTo(fx, 38);
      // 三趾
      ctx.moveTo(fx, 38); ctx.lineTo(fx-3, 41);
      ctx.moveTo(fx, 38); ctx.lineTo(fx, 42);
      ctx.moveTo(fx, 38); ctx.lineTo(fx+3, 41);
      ctx.stroke();
    }
    ctx.restore();
    // ===== 能量粒子环绕 =====
    for(let i=0;i<4;i++){
      const ea = t*2 + i*(TAU/4);
      const er = 50 + Math.sin(t*3+i)*8;
      const ex = cx + Math.cos(ea)*er;
      const ey = cy + Math.sin(ea)*er*0.8;
      ctx.fillStyle=`rgba(255,240,150,${0.6+pulse*0.3})`;
      ctx.beginPath(); ctx.arc(ex, ey, 2, 0, TAU); ctx.fill();
    }
    // ===== 倒计时条 =====
    const cdW = 60 * clamp(p.carrierMode/8.0, 0, 1);
    ctx.fillStyle='#331a00'; ctx.fillRect(cx-30, cy-52, 60, 4);
    ctx.fillStyle = cdW>20?'#5cff8f':(cdW>8?'#ffe14d':'#ff5c5c');
    ctx.fillRect(cx-30, cy-52, cdW, 4);
    return;
  }
  // 火焰喷射：一团火，喷口细末端大成火团（不跟随受伤闪烁）
  if(p.weapon==='FIRE' && p.fireDown && p.fireStream>0){
    const baseY = p.y + 4;
    const streamLen = 130;
    const neckLen = 28;          // 细颈长度
    const blobCy = baseY - streamLen + 20; // 火团中心
    const blobR = 34;            // 火团半径
    const flicker = p.fireStream * 18;
    // 火团由多个不规则圆叠加构成，每层不同半径偏移
    const layers = [
      { col:'rgba(180,40,20,0.35)', rMul:1.15 }, // 外层暗红
      { col:'#ff5c2a',               rMul:0.85 }, // 中层橙红
      { col:'#ff9b3a',               rMul:0.62 }, // 内层橙黄
      { col:'#ffe14d',               rMul:0.40 }, // 核心亮黄
      { col:'#fff8c0',               rMul:0.20 }, // 最亮核心
    ];
    // 细颈（喷口到火团）
    for(const layer of layers){
      ctx.fillStyle = layer.col;
      const neckR = 4 * layer.rMul;
      ctx.beginPath();
      const steps = 6;
      for(let i=0; i<=steps; i++){
        const t = i/steps;
        const y = baseY - t*neckLen;
        const wobble = Math.sin(flicker + t*6) * 1.5;
        ctx.lineTo(cx + wobble + neckR, y);
      }
      for(let i=steps; i>=0; i--){
        const t = i/steps;
        const y = baseY - t*neckLen;
        const wobble = Math.sin(flicker + t*6 + 2) * 1.5;
        ctx.lineTo(cx + wobble - neckR, y);
      }
      ctx.closePath();
      ctx.fill();
    }
    // 火团：多个不规则圆叠加形成有机火焰团
    for(const layer of layers){
      ctx.fillStyle = layer.col;
      const r = blobR * layer.rMul;
      // 用 8 个偏移圆叠加，形成不规则边缘
      const blobs = 8;
      for(let i=0; i<blobs; i++){
        const a = (i/blobs) * TAU + flicker*0.3;
        const dist = r * 0.45;
        const bx = cx + Math.cos(a)*dist + Math.sin(flicker+i*2)*4;
        const by = blobCy + Math.sin(a)*dist*0.85 + Math.cos(flicker+i*1.7)*3;
        const br = r * (0.6 + Math.sin(flicker*1.5+i*1.3)*0.25);
        if(br > 0){
          ctx.beginPath();
          ctx.arc(bx, by, Math.max(3, br), 0, TAU);
          ctx.fill();
        }
      }
      // 中心圆补满
      ctx.beginPath();
      ctx.arc(cx + Math.sin(flicker*0.7)*3, blobCy + Math.cos(flicker)*2, r*0.7, 0, TAU);
      ctx.fill();
    }
    // 末端烟雾
    for(let s=0;s<4;s++){
      const sy = blobCy - blobR*0.7 - s*8;
      const sr = blobR * (0.4 - s*0.08) + Math.sin(flicker+s*3)*3;
      const alpha = 0.22 - s*0.05;
      if(sr>0 && alpha>0){
        ctx.fillStyle=`rgba(70,70,80,${alpha})`;
        ctx.beginPath();
        ctx.arc(cx + Math.sin(flicker+s*2)*6, sy, Math.max(2,sr), 0, TAU);
        ctx.fill();
      }
    }
    // 火星粒子
    if(Math.random()<0.6){
      const a = rand(0,TAU);
      const d = rand(0, blobR*0.7);
      ctx.fillStyle = Math.random()<0.5?'#ffe14d':'#ff5c2a';
      ctx.fillRect(cx + Math.cos(a)*d, blobCy + Math.sin(a)*d*0.85, 1, 1);
    }
    // 黑洞引力漩涡：火团中心的暗黑核心 + 旋转吸入线
    const bhT = p.fireStream * 5;
    // 旋转吸入线（3条螺旋）
    ctx.strokeStyle='rgba(80,40,20,0.4)'; ctx.lineWidth=2;
    for(let s=0;s<3;s++){
      ctx.beginPath();
      const startA = bhT + s*(TAU/3);
      for(let i=0;i<=12;i++){
        const t=i/12;
        const r = 10 + t*70;
        const a = startA + t*3;
        const px = cx + Math.cos(a)*r;
        const py = blobCy + Math.sin(a)*r*0.85;
        if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.stroke();
    }
    // 暗黑核心
    const coreR = 8 + Math.sin(bhT*2)*2;
    ctx.fillStyle='rgba(20,5,0,0.6)';
    ctx.beginPath(); ctx.arc(cx, blobCy, coreR, 0, TAU); ctx.fill();
    ctx.fillStyle='rgba(60,20,5,0.5)';
    ctx.beginPath(); ctx.arc(cx, blobCy, coreR*0.6, 0, TAU); ctx.fill();
  }
  // 受伤闪烁：仅跳过机身绘制，火焰不受影响
  const blink = p.invuln>0 && Math.floor(p.invuln*12)%2===0;
  if(blink) return;
  // 引擎火焰
  const fl = 4+Math.sin(Date.now()*0.04)*3;
  rrect(cx-4, p.y+p.h, 8, fl, COLORS.flame);
  rrect(cx-2, p.y+p.h+fl-2, 4, 3, '#ffe14d');
  // 机翼（装备时绘制在两侧）
  if(p.weapon!=='NONE'){
    const wc = WINGS[p.weapon].color;
    rrect(p.x-8, p.y+4, 8, 16, wc);
    rrect(p.x+p.w, p.y+4, 8, 16, wc);
    rrect(p.x-8, p.y+2, 8, 4, '#fff');
    rrect(p.x+p.w, p.y+2, 8, 4, '#fff');
    // 机翼字母
    ctx.fillStyle='#000'; ctx.font='7px "Press Start 2P"';
    ctx.textAlign='center'; ctx.fillText(WINGS[p.weapon].letter, p.x-4, p.y+15);
    ctx.fillText(WINGS[p.weapon].letter, p.x+p.w+4, p.y+15);
  }
  // 机身
  rrect(p.x+6, p.y, 12, 8, COLORS.shipDark);
  rrect(p.x+4, p.y+6, 16, 12, COLORS.ship);
  rrect(p.x+8, p.y+18, 8, 6, COLORS.shipDark);
  rrect(p.x+10, p.y+2, 4, 4, COLORS.core); // 驾驶舱
  ctx.textAlign='left';
  // 护盾
  if(p.shield>0){
    ctx.strokeStyle='rgba(92,255,143,'+(0.4+0.3*Math.sin(Date.now()*0.01))+')'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(cx,cy,22,0,TAU); ctx.stroke();
  }
  // 锤头弹
  for(const h of p.hammers){
    rrect(h.x-7,h.y-7,14,14,'#ff9b3a');
    rrect(h.x-5,h.y-5,10,10,'#ffe14d');
  }
}

// 影子僚机绘制：半透明迷你飞船，环绕模式带轨迹光圈
function drawOptions(){
  const p=game.p; if(!p) return;
  if(p.carrierMode>0 || p.carrierAnim>0) return; // 母舰/过渡动画中僚机已合体
  const allAttached = p.options.every(o=>!o.detached);
  const orbitMode = allAttached && p.options.length >= 4;
  // 环绕模式：画旋转轨道光圈
  if(orbitMode){
    const cx=p.x+p.w/2-6, cy=p.y+p.h/2;
    ctx.strokeStyle='rgba(128,200,255,0.12)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.arc(cx, cy, 42, 0, TAU); ctx.stroke();
  }
  for(const o of p.options){
    if(o.detached){
      // 脱离状态：闪烁警告光圈，提示需要接触回收
      const pulse = 0.5 + 0.5 * Math.sin(Date.now()*0.008);
      ctx.fillStyle = `rgba(128,200,255,${0.1+pulse*0.15})`;
      ctx.beginPath(); ctx.arc(o.x+6, o.y+7, 14+pulse*3, 0, TAU); ctx.fill();
      ctx.strokeStyle = `rgba(128,200,255,${0.4+pulse*0.3})`;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(o.x+6, o.y+7, 14+pulse*3, 0, TAU); ctx.stroke();
      ctx.globalAlpha = 0.6 + pulse*0.3;
    } else {
      ctx.globalAlpha = orbitMode ? 0.85 : 0.75;
    }
    const fl = 3+Math.sin(Date.now()*0.04+o.angle)*2;
    // 环绕模式：增加发光外圈
    if(orbitMode){
      ctx.fillStyle='rgba(128,200,255,0.15)';
      ctx.beginPath(); ctx.arc(o.x+6, o.y+7, 12, 0, TAU); ctx.fill();
    }
    // 引擎火焰
    rrect(o.x+3, o.y+14, 6, fl, '#5ca0d0');
    rrect(o.x+4, o.y+14+fl-1, 4, 2, '#80c8ff');
    // 机身（迷你版飞船）
    rrect(o.x+4, o.y, 8, 5, '#2a5f88');
    rrect(o.x+2, o.y+4, 12, 8, '#5ca0d0');
    rrect(o.x+5, o.y+12, 6, 3, '#2a5f88');
    rrect(o.x+6, o.y+1, 4, 3, '#80c8ff'); // 驾驶舱
    ctx.globalAlpha=1;
  }
}

function drawEnemy(e){
  const cx=e.x+e.w/2, cy=e.y+e.h/2;
  switch(e.type){
    case 'grunt':
      rrect(e.x+6,e.y,12,6,e.color); rrect(e.x+4,e.y+6,16,12,e.color);
      rrect(e.x,e.y+8,4,8,'#cc4660'); rrect(e.x+e.w-4,e.y+8,4,8,'#cc4660');
      rrect(e.x+8,e.y+8,8,4,'#fff'); break;
    case 'fast':
      rrect(e.x+8,e.y,4,18,e.color); rrect(e.x+2,e.y+6,16,8,e.color);
      rrect(e.x,e.y+8,2,4,'#cc9b20'); rrect(e.x+e.w-2,e.y+8,2,4,'#cc9b20'); break;
    case 'missile':
      rrect(e.x+8,e.y,6,8,e.color); rrect(e.x+4,e.y+8,14,16,e.color);
      rrect(e.x+9,e.y+2,4,4,'#fff');
      rrect(e.x+2,e.y+18,4,6,'#cc5a14'); rrect(e.x+e.w-6,e.y+18,4,6,'#cc5a14'); break;
    case 'barrier':
      rrect(e.x,e.y,e.w,e.h,'#5a4a8a'); rrect(e.x+3,e.y+3,e.w-6,e.h-6,e.color);
      // 裂纹随血量
      const dmg = 1 - e.hp/6;
      if(dmg>0.3){ ctx.strokeStyle='#1a1030'; ctx.lineWidth=2; ctx.beginPath();
        ctx.moveTo(e.x+6,e.y+6); ctx.lineTo(e.x+e.w-6,e.y+e.h-6); ctx.moveTo(e.x+e.w-6,e.y+6); ctx.lineTo(e.x+6,e.y+e.h-6); ctx.stroke(); }
      rrect(e.x+e.w/2-3,e.y+e.h/2-3,6,6,'#fff'); break;
    case 'turret':
      rrect(e.x+4,e.y+4,e.w-8,e.h-8,e.color); rrect(e.x+8,e.y+8,e.w-16,e.h-16,'#2a8a4a');
      rrect(cx-2,cy,4,10,'#fff'); break;
    case 'carrier':
      // 运载火箭，带机翼字母
      rrect(e.x+8,e.y,20,8,'#bbb'); rrect(e.x+4,e.y+8,28,28,'#888');
      rrect(e.x+8,e.y+36,6,6,e.color); rrect(e.x+22,e.y+36,6,6,e.color);
      rrect(e.x+12,e.y+10,16,16,e.color);
      ctx.fillStyle='#000'; ctx.font='12px "Press Start 2P"'; ctx.textAlign='center';
      if(e.wing==='option'){
        // 僚机道具：画迷你飞船图标
        rrect(cx-4,cy-3,8,5,'#5ca0d0'); rrect(cx-3,cy-2,6,3,'#80c8ff');
      } else {
        ctx.fillText(WINGS[e.wing].letter, cx, cy+5);
      }
      ctx.textAlign='left'; break;
    case 'miniBoss':
      drawMiniBoss(e, cx, cy); break;
    case 'asteroid':
      drawAsteroid(e, cx, cy); break;
    case 'laserGate':
      drawLaserGate(e, cx, cy); break;
    case 'mine':
      drawMine(e, cx, cy); break;
  }
}

function drawMiniBoss(e, cx, cy){
  const pulse = 0.5 + 0.5 * Math.sin(e.t * 5);
  switch(e.kind){
    case 'GUARD':
      // 粉色护卫舰：菱形主体 + 两侧炮台
      rrect(e.x, e.y+8, e.w, e.h-16, '#7a2a4a');
      rrect(e.x+6, e.y, e.w-12, 12, '#9a3a5a');
      rrect(e.x+6, e.y+e.h-12, e.w-12, 12, '#9a3a5a');
      rrect(e.x-4, e.y+12, 8, e.h-24, e.color);
      rrect(e.x+e.w-4, e.y+12, 8, e.h-24, e.color);
      rrect(cx-12, cy-12, 24, 24, '#2a0a1a');
      rrect(cx-8, cy-8, 16, 16, `rgba(255,107,155,${0.5+pulse*0.4})`);
      rrect(cx-3, cy-3, 6, 6, '#ffd34d');
      break;
    case 'HUNTER':
      // 橙色猎手：锐角机身 + 旋转核心
      rrect(e.x+8, e.y, e.w-16, 8, '#8a4a14');
      rrect(e.x+2, e.y+8, e.w-4, e.h-16, '#aa5a1a');
      rrect(e.x+8, e.y+e.h-8, e.w-16, 8, '#8a4a14');
      rrect(e.x-2, e.y+14, 6, e.h-28, e.color);
      rrect(e.x+e.w-4, e.y+14, 6, e.h-28, e.color);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(e.spin);
      rrect(-10, -10, 20, 20, '#2a1408');
      rrect(-7, -7, 14, 14, `rgba(255,179,71,${0.5+pulse*0.4})`);
      rrect(-3, -3, 6, 6, '#fff');
      ctx.restore();
      break;
    case 'WARDEN':
      // 紫色典狱长：大型要塞 + 多炮台
      rrect(e.x, e.y+10, e.w, e.h-20, '#3a1a5a');
      rrect(e.x+4, e.y, e.w-8, 14, '#4a2a6a');
      rrect(e.x+4, e.y+e.h-14, e.w-8, 14, '#4a2a6a');
      [e.x+8, cx-6, e.x+e.w-20].forEach(tx=>{
        rrect(tx, e.y+2, 12, 10, e.color);
        rrect(tx+4, e.y-4, 4, 8, '#fff');
      });
      for(let i=0;i<3;i++) rrect(e.x+12+i*14, e.y+e.h-8, 8, 5, '#ff9b3a');
      rrect(cx-16, cy-16, 32, 32, '#1a0828');
      rrect(cx-12, cy-12, 24, 24, `rgba(155,107,255,${0.5+pulse*0.4})`);
      rrect(cx-5, cy-5, 10, 10, '#ffd34d');
      break;
  }
  // 血条
  const bw=60, bx=cx-bw/2;
  ctx.fillStyle='#220'; ctx.fillRect(bx, e.y+e.h+4, bw, 4);
  ctx.fillStyle=e.color; ctx.fillRect(bx, e.y+e.h+4, bw*clamp(e.hp/e.maxHp,0,1), 4);
  ctx.fillStyle='#888'; ctx.font='7px "Press Start 2P"'; ctx.textAlign='center';
  ctx.fillText(e.name, cx, e.y-6); ctx.textAlign='left';
}

// ---- 障碍物绘制 ----
function drawAsteroid(e, cx, cy){
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(e.rot);
  const r = e.w/2;
  const dmg = 1 - e.hp/e.maxHp;
  // 主体：不规则多边形
  ctx.fillStyle = dmg > 0.5 ? '#5a4a3a' : '#7a6a5a';
  ctx.beginPath();
  const pts = 8;
  for(let i=0;i<=pts;i++){
    const a = (i/pts)*TAU;
    const variance = 0.7 + 0.3*Math.sin(e.seed + i*1.7);
    const px = Math.cos(a)*r*variance;
    const py = Math.sin(a)*r*variance;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fill();
  // 内层亮色
  ctx.fillStyle = dmg > 0.5 ? '#6a5a4a' : '#8a7a6a';
  ctx.beginPath();
  for(let i=0;i<=pts;i++){
    const a = (i/pts)*TAU;
    const variance = 0.7 + 0.3*Math.sin(e.seed + i*1.7);
    const px = Math.cos(a)*r*0.65*variance;
    const py = Math.sin(a)*r*0.65*variance;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fill();
  // 陨石坑
  ctx.fillStyle = '#4a3a2a';
  ctx.beginPath(); ctx.arc(-r*0.2, -r*0.15, r*0.15, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(r*0.25, r*0.1, r*0.1, 0, TAU); ctx.fill();
  // 裂纹（受损时显示）
  if(dmg > 0.3){
    ctx.strokeStyle = '#2a1a0a'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-r*0.4, -r*0.3); ctx.lineTo(r*0.2, r*0.4);
    if(dmg > 0.6){ ctx.moveTo(r*0.3, -r*0.4); ctx.lineTo(-r*0.2, r*0.3); }
    ctx.stroke();
  }
  ctx.restore();
}

function drawLaserGate(e, cx, cy){
  const pulse = 0.5 + 0.5 * Math.sin(e.t * 8);
  if(e.active){
    // 激光屏障激活：画整条线（除缺口外）
    // 左段
    const leftEnd = e.gapX;
    const rightStart = e.gapX + e.gapW;
    // 外发光
    ctx.fillStyle = `rgba(255,58,58,${0.2+pulse*0.15})`;
    ctx.fillRect(0, e.y-4, leftEnd, e.h+8);
    ctx.fillRect(rightStart, e.y-4, W-rightStart, e.h+8);
    // 主体
    ctx.fillStyle = '#ff3a3a';
    ctx.fillRect(0, e.y, leftEnd, e.h);
    ctx.fillRect(rightStart, e.y, W-rightStart, e.h);
    // 内核高亮
    ctx.fillStyle = `rgba(255,200,200,${0.6+pulse*0.4})`;
    ctx.fillRect(0, e.y+2, leftEnd, e.h-4);
    ctx.fillRect(rightStart, e.y+2, W-rightStart, e.h-4);
    // 缺口标记
    ctx.fillStyle = `rgba(80,255,120,${0.15+pulse*0.1})`;
    ctx.fillRect(e.gapX, e.y-2, e.gapW, e.h+4);
    ctx.strokeStyle = `rgba(80,255,120,${0.4+pulse*0.3})`;
    ctx.lineWidth = 1;
    ctx.strokeRect(e.gapX, e.y-2, e.gapW, e.h+4);
  } else {
    // 关闭状态：虚线提示
    ctx.strokeStyle = `rgba(255,58,58,${0.2+pulse*0.1})`;
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(0, e.y+e.h/2); ctx.lineTo(e.gapX, e.y+e.h/2);
    ctx.moveTo(e.gapX+e.gapW, e.y+e.h/2); ctx.lineTo(W, e.y+e.h/2);
    ctx.stroke();
    ctx.setLineDash([]);
    // 缺口标记（常亮）
    ctx.strokeStyle = `rgba(80,255,120,${0.3+pulse*0.2})`;
    ctx.lineWidth = 1;
    ctx.strokeRect(e.gapX, e.y-1, e.gapW, e.h+2);
  }
}

function drawMine(e, cx, cy){
  const pulse = 0.5 + 0.5 * Math.sin(e.t * (e.armed ? 12 : 4));
  if(e.armed){
    // 已激活：闪烁警告环
    ctx.fillStyle = `rgba(255,80,40,${0.1+pulse*0.15})`;
    ctx.beginPath(); ctx.arc(cx, cy, e.explodeR*0.6, 0, TAU); ctx.fill();
    ctx.strokeStyle = `rgba(255,80,40,${0.3+pulse*0.3})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, e.explodeR*0.6, 0, TAU); ctx.stroke();
  }
  // 主体外壳
  rrect(e.x+2, e.y+2, e.w-4, e.h-4, '#5a4a1a');
  rrect(e.x+4, e.y+4, e.w-8, e.h-8, '#8a7a2a');
  // 中心核心
  const coreColor = e.armed ? `rgba(255,${Math.floor(80+pulse*120)},40,${0.7+pulse*0.3})` : `rgba(200,180,60,${0.4+pulse*0.3})`;
  ctx.fillStyle = coreColor;
  ctx.beginPath(); ctx.arc(cx, cy, e.w*0.25, 0, TAU); ctx.fill();
  // 尖刺
  ctx.fillStyle = '#6a5a2a';
  ctx.beginPath();
  for(let i=0;i<4;i++){
    const a = (i/4)*TAU + Math.PI/4;
    ctx.moveTo(cx + Math.cos(a)*e.w*0.3, cy + Math.sin(a)*e.w*0.3);
    ctx.lineTo(cx + Math.cos(a)*e.w*0.5, cy + Math.sin(a)*e.w*0.5);
    ctx.lineTo(cx + Math.cos(a+0.3)*e.w*0.3, cy + Math.sin(a+0.3)*e.w*0.3);
  }
  ctx.fill();
}

function drawBossCore(b,cx,cy){
  const armor = b.colorIdx>=b.phases ? '#556' : b.color;
  rrect(b.x, b.y+10, b.w, b.h-20, '#4a3a6a');
  rrect(b.x+8, b.y, b.w-16, 18, '#6a5a8a');
  rrect(b.x+8, b.y+b.h-18, b.w-16, 18, '#6a5a8a');
  rrect(b.x-6, b.y+20, 12, b.h-40, armor);
  rrect(b.x+b.w-6, b.y+20, 12, b.h-40, armor);
  const pulse=0.5+0.5*Math.sin(b.t*6);
  rrect(cx-14, cy-14, 28, 28, '#2a1030');
  rrect(cx-10, cy-10, 20, 20, `rgba(255,80,80,${0.6+pulse*0.4})`);
  rrect(cx-4, cy-4, 8, 8, '#ffd34d');
}
function drawBossTwin(b,cx,cy){
  const armor = b.colorIdx>=b.phases ? '#446' : b.color;
  rrect(b.x, b.y+14, b.w, b.h-28, '#2a4a6a');
  rrect(b.x+6, b.y, b.w-12, 16, '#3a5a7a');
  rrect(b.x+6, b.y+b.h-16, b.w-12, 16, '#3a5a7a');
  rrect(b.x+b.w/2-6, b.y+16, 12, b.h-32, '#1a3a5a');
  const lcx=b.x+b.w*0.25, rcx=b.x+b.w*0.75;
  const pulse=0.5+0.5*Math.sin(b.t*6), r2=0.5+0.5*Math.sin(b.t*6+Math.PI);
  [[lcx,pulse],[rcx,r2]].forEach(([px,pl])=>{
    rrect(px-14, cy-14, 28, 28, '#102030');
    rrect(px-10, cy-10, 20, 20, `rgba(90,200,255,${0.6+pl*0.4})`);
    rrect(px-4, cy-4, 8, 8, '#fff');
  });
  rrect(b.x-4, b.y+18, 8, b.h-36, armor);
  rrect(b.x+b.w-4, b.y+18, 8, b.h-36, armor);
}
function drawBossFortress(b,cx,cy){
  const armor = b.colorIdx>=b.phases ? '#555' : b.color;
  rrect(b.x, b.y+16, b.w, b.h-32, '#3a2a5a');
  rrect(b.x+4, b.y, b.w-8, 20, '#4a3a6a');
  rrect(b.x+4, b.y+b.h-20, b.w-8, 20, '#4a3a6a');
  [b.x+18, cx-6, b.x+b.w-18].forEach(tx=>{ rrect(tx, b.y+2, 12, 14, armor); rrect(tx+4, b.y-6, 4, 10, '#fff'); });
  for(let i=0;i<4;i++) rrect(b.x+16+i*((b.w-32)/3), b.y+b.h-10, 8, 6, '#ff9b3a');
  const pulse=0.5+0.5*Math.sin(b.t*5);
  rrect(cx-16, cy-16, 32, 32, '#1a0828');
  rrect(cx-12, cy-12, 24, 24, `rgba(180,80,255,${0.5+pulse*0.4})`);
  rrect(cx-5, cy-5, 10, 10, '#ffd34d');
}
function drawBossDestroyer(b,cx,cy){
  const armor = b.colorIdx>=b.phases ? '#644' : b.color;
  rrect(b.x, b.y+12, b.w, b.h-24, '#5a2a2a');
  rrect(b.x+6, b.y, b.w-12, 14, '#7a3a3a');
  rrect(b.x+6, b.y+b.h-14, b.w-12, 14, '#7a3a3a');
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(b.spin);
  for(let i=0;i<6;i++){ ctx.rotate(TAU/6); rrect(34,-5,12,10,armor); }
  ctx.restore();
  const sp=Math.sin(b.t*4)*3;
  rrect(b.x-8, cy-4+sp, 8, 8, armor);
  rrect(b.x+b.w, cy-4-sp, 8, 8, armor);
  const pulse=0.5+0.5*Math.sin(b.t*7);
  rrect(cx-18, cy-18, 36, 36, '#280808');
  rrect(cx-14, cy-14, 28, 28, `rgba(255,60,60,${0.6+pulse*0.4})`);
  rrect(cx-6, cy-6, 12, 12, '#ffd34d');
}
function drawBoss(){
  const b=game.boss; if(!b) return;
  const cx=b.x+b.w/2, cy=b.y+b.h/2;
  switch(b.kind){
    case 'CORE':      drawBossCore(b,cx,cy); break;
    case 'TWIN':      drawBossTwin(b,cx,cy); break;
    case 'FORTRESS':  drawBossFortress(b,cx,cy); break;
    case 'DESTROYER': drawBossDestroyer(b,cx,cy); break;
  }
  // 阶段指示
  for(let i=0;i<=b.phases;i++){
    rrect(cx-(b.phases*8)+i*16-4, b.y-10, 10, 6, i<b.colorIdx?'#333':b.color);
  }
  // 血条
  const bw=130, bx=cx-bw/2;
  ctx.fillStyle='#220'; ctx.fillRect(bx,b.y+b.h+6,bw,6);
  ctx.fillStyle=b.color; ctx.fillRect(bx,b.y+b.h+6,bw*clamp(b.hp/b.maxHp,0,1),6);
  ctx.fillStyle='#888'; ctx.font='7px "Press Start 2P"'; ctx.textAlign='center';
  ctx.fillText(b.name+'  ST'+b.stage, cx, b.y-14); ctx.textAlign='left';
}

function drawBullets(){
  for(const b of game.pbullets){
    if(b.type==='dyna'){
      rrect(b.x,b.y,b.w,b.h,'#ffcc4d'); rrect(b.x+1,b.y+1,b.w-2,b.h-2,'#fff5a0');
    } else if(b.type==='laser'){
      // 跟踪激光：沿朝向绘制带拖尾的光弹
      const ang = b.angle!==undefined ? b.angle : -Math.PI/2;
      const cx=b.x+b.w/2, cy=b.y+b.h/2;
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang+Math.PI/2);
      // 外发光
      ctx.fillStyle='rgba(255,58,239,0.3)'; ctx.fillRect(-7,-14,14,28);
      // 主体
      rrect(-4,-12,8,24,'#ff3aef'); rrect(-2,-10,4,20,'#ffb0f5'); rrect(-1,-6,2,12,'#fff');
      ctx.restore();
    } else if(b.type==='lightning'){
      // 闪电：球状雷核 + 锯齿闪电拖尾 + 感应范围光环
      const cx=b.x+b.w/2, cy=b.y+b.h/2;
      // 感应范围光环（微弱脉冲）
      const pulse = 0.5 + 0.3*Math.sin(b.age*20);
      ctx.fillStyle=`rgba(0,229,255,${0.06*pulse})`;
      ctx.beginPath(); ctx.arc(cx,cy,b.senseRange,0,TAU); ctx.fill();
      ctx.strokeStyle=`rgba(0,229,255,${0.15*pulse})`; ctx.lineWidth=1;
      ctx.beginPath(); ctx.arc(cx,cy,b.senseRange,0,TAU); ctx.stroke();
      // 外发光
      ctx.fillStyle='rgba(0,229,255,0.4)'; ctx.beginPath(); ctx.arc(cx,cy,12,0,TAU); ctx.fill();
      // 雷核
      ctx.fillStyle='#00e5ff'; ctx.beginPath(); ctx.arc(cx,cy,6,0,TAU); ctx.fill();
      ctx.fillStyle='#80f5ff'; ctx.beginPath(); ctx.arc(cx,cy,3.5,0,TAU); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx,cy,1.5,0,TAU); ctx.fill();
      // 锯齿闪电拖尾（向下延伸）
      ctx.strokeStyle='rgba(0,229,255,0.8)'; ctx.lineWidth=2;
      ctx.beginPath();
      let px=cx, py=cy;
      ctx.moveTo(px,py);
      for(let i=0;i<5;i++){
        const ny=py+8;
        const nx=px+rand(-6,6);
        ctx.lineTo(nx,ny);
        px=nx; py=ny;
      }
      ctx.stroke();
      // 细电弧分支
      ctx.strokeStyle='rgba(128,245,255,0.5)'; ctx.lineWidth=1;
      for(let s=0;s<2;s++){
        ctx.beginPath();
        ctx.moveTo(cx+rand(-3,3),cy+rand(0,4));
        let bx=cx+rand(-3,3), by=cy+rand(0,4);
        for(let i=0;i<3;i++){
          bx+=rand(-8,8); by+=rand(4,10);
          ctx.lineTo(bx,by);
        }
        ctx.stroke();
      }
    } else if(b.type==='coin'){
      // 铜钱：外圆内方，随成长阶段绘制不同细节
      const cx=b.x+b.w/2, cy=b.y+b.h/2, r=b.w/2;
      if(r<4){
        // 极小：简化绘制
        rrect(b.x,b.y,b.w,b.h,'#ffcc44');
      } else {
        // 外圈深铜
        ctx.fillStyle='#aa6600'; ctx.beginPath(); ctx.arc(cx,cy,r,0,TAU); ctx.fill();
        // 内圈金黄
        ctx.fillStyle='#ffcc44'; ctx.beginPath(); ctx.arc(cx,cy,r*0.82,0,TAU); ctx.fill();
        // 边缘纹路（4个标记）
        if(r>=10){
          ctx.fillStyle='#aa6600';
          ctx.fillRect(cx-1,cy-r-1,2,3); ctx.fillRect(cx-1,cy+r-2,2,3);
          ctx.fillRect(cx-r-1,cy-1,3,2); ctx.fillRect(cx+r-2,cy-1,3,2);
        }
        // 中心方孔
        const hs=Math.max(2,r*0.3);
        ctx.fillStyle='#1a0a00'; ctx.fillRect(cx-hs,cy-hs,hs*2,hs*2);
        // 方孔内边框
        if(r>=8){ ctx.fillStyle='#553300'; ctx.fillRect(cx-hs,cy-hs,hs*2,1); ctx.fillRect(cx-hs,cy+hs-1,hs*2,1); }
        // 左上高光
        ctx.fillStyle='#fff5aa'; ctx.beginPath(); ctx.arc(cx-r*0.35,cy-r*0.35,Math.max(1,r*0.15),0,TAU); ctx.fill();
      }
    } else {
      rrect(b.x,b.y,b.w,b.h,b.color);
    }
  }
  for(const b of game.ebullets){ rrect(b.x,b.y,b.w,b.h,b.color); rrect(b.x+1,b.y+1,b.w-2,b.h-2,'#fff'); }
}

function drawPowerups(){
  for(const u of game.powerups){
    // 损坏的残骸：碎裂、暗色、旋转下落
    if(u.broken){
      const cx=u.x+u.w/2, cy=u.y+u.h/2;
      const rot = u.t*4;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      // 暗色碎片底
      const wc = WINGS[u.kind] ? WINGS[u.kind].color : '#666';
      ctx.globalAlpha = 0.4;
      rrect(-u.w/2, -u.h/2, u.w, u.h, '#1a1a1a');
      ctx.globalAlpha = 0.6;
      rrect(-u.w/2+2, -u.h/2+2, u.w-4, u.h-4, wc);
      ctx.globalAlpha = 1;
      // 碎裂裂纹
      ctx.strokeStyle='#ff3a3a'; ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(-6,-4); ctx.lineTo(-2,1); ctx.lineTo(-4,5);
      ctx.moveTo(3,-6); ctx.lineTo(1,-1); ctx.lineTo(5,3); ctx.lineTo(2,6);
      ctx.stroke();
      // 暗色字母
      ctx.fillStyle='#330'; ctx.font='11px "Press Start 2P"'; ctx.textAlign='center';
      ctx.globalAlpha = 0.3;
      if(WINGS[u.kind]) ctx.fillText(WINGS[u.kind].letter, 0, 4);
      ctx.globalAlpha = 1;
      ctx.restore();
      ctx.textAlign='left';
      continue;
    }
    const bob = Math.sin(u.t*6)*2;
    if(u.kind==='heart'){
      rrect(u.x+3,u.y+bob,u.w-6,u.h-6,'#ff5c7a'); rrect(u.x+6,u.y+3+bob,6,6,'#fff');
      ctx.font='7px "Press Start 2P"'; ctx.fillStyle='#fff'; ctx.textAlign='center';
      ctx.fillText('1UP', u.x+u.w/2, u.y+u.h+8+bob); ctx.textAlign='left';
    } else if(u.kind==='shield'){
      ctx.strokeStyle='#5cff8f'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(u.x+u.w/2,u.y+u.h/2+bob,8,0,TAU); ctx.stroke();
      ctx.font='7px "Press Start 2P"'; ctx.fillStyle='#5cff8f'; ctx.textAlign='center';
      ctx.fillText('SHD', u.x+u.w/2, u.y+u.h+8+bob); ctx.textAlign='left';
    } else if(u.kind==='option'){
      // 影子僚机道具：蓝色菱形 + 迷你飞船图标
      const cx=u.x+u.w/2, cy=u.y+u.h/2+bob;
      ctx.fillStyle='#1a3a5a'; ctx.fillRect(u.x,u.y+bob,u.w,u.h);
      ctx.fillStyle='#80c8ff';
      ctx.beginPath(); ctx.moveTo(cx,u.y+bob); ctx.lineTo(u.x+u.w,u.y+u.h/2+bob);
      ctx.lineTo(cx,u.y+u.h+bob); ctx.lineTo(u.x,u.y+u.h/2+bob); ctx.closePath(); ctx.fill();
      // 迷你飞船
      rrect(cx-4,cy-3,8,5,'#5ca0d0'); rrect(cx-3,cy-2,6,3,'#80c8ff');
      ctx.font='7px "Press Start 2P"'; ctx.fillStyle='#80c8ff'; ctx.textAlign='center';
      ctx.fillText('WING', u.x+u.w/2, u.y+u.h+8+bob); ctx.textAlign='left';
    } else {
      // 机翼道具
      const wc=WINGS[u.kind].color;
      rrect(u.x,u.y+bob,u.w,u.h,'#222'); rrect(u.x+2,u.y+2+bob,u.w-4,u.h-4,wc);
      ctx.fillStyle='#000'; ctx.font='11px "Press Start 2P"'; ctx.textAlign='center';
      ctx.fillText(WINGS[u.kind].letter, u.x+u.w/2, u.y+u.h-3+bob); ctx.textAlign='left';
    }
  }
}

function drawParticles(){
  for(const p of game.particles){ ctx.globalAlpha=clamp(p.life*2,0,1); rrect(p.x,p.y,p.size,p.size,p.color); }
  ctx.globalAlpha=1;
  for(const f of game.floats){ ctx.globalAlpha=clamp(f.life*1.5,0,1);
    ctx.fillStyle=f.color; ctx.font='9px "Press Start 2P"'; ctx.textAlign='center';
    ctx.fillText(f.txt, f.x, f.y); ctx.textAlign='left'; }
  ctx.globalAlpha=1;
}

function drawArcs(){
  for(const a of game.arcs){
    const al=clamp(a.life*5,0,1);
    // 外发光
    ctx.strokeStyle=a.color; ctx.lineWidth=4; ctx.globalAlpha=al*0.35;
    ctx.beginPath(); ctx.moveTo(a.pts[0].x,a.pts[0].y);
    for(let i=1;i<a.pts.length;i++) ctx.lineTo(a.pts[i].x,a.pts[i].y);
    ctx.stroke();
    // 主体
    ctx.lineWidth=2; ctx.globalAlpha=al;
    ctx.stroke();
    // 高光
    ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.globalAlpha=al*0.8;
    ctx.stroke();
  }
  ctx.globalAlpha=1;
}

function drawHUD(){
  const p=game.p;
  ctx.font='10px "Press Start 2P"';
  // 分数
  ctx.fillStyle='#fff'; ctx.textAlign='left';
  ctx.fillText('SCORE', 8, 16); ctx.fillStyle='#ffd34d';
  ctx.fillText(String(p.score).padStart(6,'0'), 8, 30);
  // 关卡 + 地形名
  ctx.fillStyle='#fff'; ctx.textAlign='center';
  ctx.fillText('STAGE '+game.stage, W/2, 16);
  if(game.terrain){
    ctx.fillStyle = game.terrain.accent; ctx.font='7px "Press Start 2P"';
    ctx.fillText(game.terrain.name, W/2, 28);
    ctx.font='10px "Press Start 2P"';
  }
  // 生命（只画一个图标 + 数量，避免大量图标占满屏幕）
  ctx.textAlign='right'; ctx.fillStyle='#ff5c7a';
  ctx.fillText('X'+p.lives, W-22, 18);
  // 单个生命图标
  rrect(W-16, 8, 10, 8, COLORS.ship); rrect(W-13, 6, 4, 3, COLORS.core);
  // 当前武器
  ctx.textAlign='left'; ctx.fillStyle='#888'; ctx.font='8px "Press Start 2P"';
  ctx.fillText('WING', 8, 48);
  ctx.fillStyle = WINGS[p.weapon].color; ctx.font='10px "Press Start 2P"';
  ctx.fillText(WINGS[p.weapon].letter+' '+WINGS[p.weapon].name, 8, 60);
  // 影子僚机数量
  if(p.options.length > 0){
    ctx.fillStyle='#888'; ctx.font='8px "Press Start 2P"';
    ctx.fillText('WINGMEN', 8, 76);
    ctx.fillStyle='#80c8ff'; ctx.font='10px "Press Start 2P"';
    ctx.fillText('x'+p.options.length+'/4', 8, 88);
    // 迷你僚机图标
    for(let i=0;i<p.options.length;i++){
      rrect(78+i*12, 80, 8, 8, '#5ca0d0'); rrect(80, 81, 4, 3, '#80c8ff');
    }
  }
  // 母舰模式倒计时
  if(p.carrierMode>0){
    ctx.fillStyle='#ffd34d'; ctx.font='9px "Press Start 2P"'; ctx.textAlign='center';
    ctx.fillText('CARRIER '+p.carrierMode.toFixed(1)+'s', W/2, 32);
    ctx.textAlign='left';
  }
  // 进度条
  if(game.state==='playing' && !game.boss){
    const prog = clamp(game.stageTimer/game.stageLen,0,1);
    ctx.fillStyle='#222'; ctx.fillRect(8, H-8, W-16, 3);
    ctx.fillStyle='#5cc8ff'; ctx.fillRect(8, H-8, (W-16)*prog, 3);
  }
}

function drawOverlays(){
  if(game.flash>0){ ctx.fillStyle=`rgba(255,255,255,${game.flash*1.5})`; ctx.fillRect(0,0,W,H); }

  if(game.state==='menu'){
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#ffd34d'; ctx.font='28px "Press Start 2P"';
    ctx.fillText('B 计划', W/2, H/2-60);
    ctx.fillStyle='#5cc8ff'; ctx.font='10px "Press Start 2P"';
    ctx.fillText('B WINGS', W/2, H/2-36);
    ctx.fillStyle='#cfd6e4'; ctx.font='8px "Press Start 2P"';
    ctx.fillText('纵向飞行射击 · 机翼武器更换', W/2, H/2-12);
    ctx.fillStyle='#888'; ctx.font='7px "Press Start 2P"';
    const mobileUI = touchUI.classList.contains('show');
    const lines = mobileUI
      ? ['全屏滑动 直接控制飞船','自动开火 已开启','每5关选武器 击落敌人获装备','不同关卡有不同地形场景']
      : ['方向键/WASD 移动','J / 空格 射击','每5关选武器 击落敌人获装备','不同关卡有不同地形场景'];
    lines.forEach((l,i)=> ctx.fillText(l, W/2, H/2+16+i*14));
    ctx.fillStyle = Math.sin(Date.now()*0.006)>0?'#fff':'#888'; ctx.font='10px "Press Start 2P"';
    ctx.fillText(mobileUI?'点击屏幕开始':'按 ENTER 开始', W/2, H/2+92);
    // 版权信息
    ctx.fillStyle='#5a6a8a'; ctx.font='7px "Press Start 2P"';
    ctx.fillText('© 杨树叶子出品', W/2, H-16);
    ctx.textAlign='left';
  }

  if(game.state==='wingSelect'){
    ctx.fillStyle='rgba(0,0,0,0.85)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#ffd34d'; ctx.font='12px "Press Start 2P"';
    ctx.fillText('STAGE '+game.stage, W/2, 40);
    ctx.fillStyle='#fff'; ctx.font='9px "Press Start 2P"';
    ctx.fillText('选择机翼', W/2, 62);
    const cols=4;
    const cw=74, ch=120, gapX=8, gapY=8;
    const totalW=cw*cols+gapX*(cols-1);
    const sx=(W-totalW)/2, sy=76;
    // 当前武器信息
    const curW = game.p.weapon;
    const hasWeapon = curW !== 'NONE';
    // 保留现有武器卡片（放最前，编号0）
    const keepX=sx, keepY=sy;
    ctx.fillStyle = hasWeapon ? '#1a1a0d' : '#0d1018';
    ctx.fillRect(keepX,keepY,cw,ch);
    ctx.strokeStyle = hasWeapon ? '#ffd34d' : '#555'; ctx.lineWidth=2;
    ctx.strokeRect(keepX,keepY,cw,ch);
    if(hasWeapon){
      const w=WINGS[curW];
      ctx.fillStyle=w.color; ctx.font='28px "Press Start 2P"';
      ctx.fillText(w.letter, keepX+cw/2, keepY+42);
      ctx.fillStyle='#fff'; ctx.font='8px "Press Start 2P"';
      ctx.fillText(w.name, keepX+cw/2, keepY+64);
      ctx.fillStyle='#ffd34d'; ctx.font='5px "Press Start 2P"';
      ctx.fillText('保留当前', keepX+cw/2, keepY+82);
      ctx.fillStyle='#ffd34d'; ctx.font='8px "Press Start 2P"';
      ctx.fillText(touchUI.classList.contains('show')?'tap':'[0]', keepX+cw/2, keepY+104);
    } else {
      ctx.fillStyle='#555'; ctx.font='20px "Press Start 2P"';
      ctx.fillText('-', keepX+cw/2, keepY+42);
      ctx.fillStyle='#888'; ctx.font='8px "Press Start 2P"';
      ctx.fillText('裸机', keepX+cw/2, keepY+64);
      ctx.fillStyle='#888'; ctx.font='5px "Press Start 2P"';
      ctx.fillText('无翼出击', keepX+cw/2, keepY+82);
      ctx.fillStyle='#ffd34d'; ctx.font='8px "Press Start 2P"';
      ctx.fillText(touchUI.classList.contains('show')?'tap':'[0]', keepX+cw/2, keepY+104);
    }
    // 常用武器卡片（从第2格开始，编号1-7）
    game.wingChoices.forEach((wk,i)=>{
      const idx=i+1; // 编号偏移：保留卡片是0
      const col=idx%cols, row=Math.floor(idx/cols);
      const x=sx+col*(cw+gapX), y=sy+row*(ch+gapY);
      const w=WINGS[wk];
      ctx.fillStyle = '#0d1018';
      ctx.fillRect(x,y,cw,ch);
      ctx.strokeStyle=w.color; ctx.lineWidth=2; ctx.strokeRect(x,y,cw,ch);
      // 大字母
      ctx.fillStyle=w.color; ctx.font='28px "Press Start 2P"';
      ctx.fillText(w.letter, x+cw/2, y+42);
      ctx.fillStyle='#fff'; ctx.font='8px "Press Start 2P"';
      ctx.fillText(w.name, x+cw/2, y+64);
      ctx.fillStyle='#888'; ctx.font='5px "Press Start 2P"';
      ctx.fillText(w.desc, x+cw/2, y+82);
      ctx.fillStyle='#ffd34d'; ctx.font='8px "Press Start 2P"';
      ctx.fillText(touchUI.classList.contains('show')?'tap':'['+idx+']', x+cw/2, y+104);
    });
    ctx.fillStyle='#888'; ctx.font='7px "Press Start 2P"';
    ctx.fillText(touchUI.classList.contains('show')?'点击卡片选择 0=保留':'按 0=保留 1-7 选择', W/2, H-16);
    ctx.textAlign='left';
  }

  if(game.state==='stageClear'){
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#5cff8f'; ctx.font='14px "Press Start 2P"';
    ctx.fillText('STAGE CLEAR', W/2, H/2);
    ctx.fillStyle='#fff'; ctx.font='8px "Press Start 2P"';
    ctx.fillText('准备进入第 '+(game.stage+1)+' 关', W/2, H/2+24);
    // 显示下一关地形
    const nextTd = TERRAIN_DATA[getTerrainType(game.stage+1)];
    ctx.fillStyle = nextTd.accent; ctx.font='9px "Press Start 2P"';
    ctx.fillText('下一关: '+nextTd.name, W/2, H/2+42);
    ctx.textAlign='left';
  }

  if(game.state==='paused'){
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='16px "Press Start 2P"';
    ctx.fillText('暂停', W/2, H/2);
    ctx.fillStyle='#888'; ctx.font='8px "Press Start 2P"';
    ctx.fillText(touchUI.classList.contains('show')?'点击屏幕继续':'按 P 继续', W/2, H/2+24);
    ctx.textAlign='left';
  }

  if(game.state==='gameover'){
    ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center'; ctx.fillStyle='#ff5c5c'; ctx.font='18px "Press Start 2P"';
    ctx.fillText('GAME OVER', W/2, H/2-20);
    ctx.fillStyle='#ffd34d'; ctx.font='10px "Press Start 2P"';
    ctx.fillText('SCORE '+String(game.p.score).padStart(6,'0'), W/2, H/2+8);
    ctx.fillStyle='#888'; ctx.font='8px "Press Start 2P"';
    ctx.fillText('到达 STAGE '+game.stage, W/2, H/2+28);
    ctx.fillStyle = Math.sin(Date.now()*0.006)>0?'#fff':'#888';
    ctx.fillText(touchUI.classList.contains('show')?'点击屏幕重新开始':'按 ENTER 重新开始', W/2, H/2+60);
    // 版权信息
    ctx.fillStyle='#5a6a8a'; ctx.font='7px "Press Start 2P"';
    ctx.fillText('© 杨树叶子出品', W/2, H-16);
    ctx.textAlign='left';
  }

  // Boss 警告
  if(game.bossWarn>0 && Math.floor(game.bossWarn*6)%2===0){
    ctx.fillStyle='rgba(255,40,40,0.25)'; ctx.fillRect(0,H/2-20,W,40);
    ctx.textAlign='center'; ctx.fillStyle='#ff4040'; ctx.font='16px "Press Start 2P"';
    ctx.fillText('!! WARNING !!', W/2, H/2+6);
    ctx.textAlign='left';
  }

  // Mini-Boss 警告
  if(game.miniBossWarn>0 && Math.floor(game.miniBossWarn*6)%2===0){
    ctx.fillStyle='rgba(255,160,40,0.2)'; ctx.fillRect(0,H/2-16,W,32);
    ctx.textAlign='center'; ctx.fillStyle='#ffa028'; ctx.font='12px "Press Start 2P"';
    ctx.fillText('! 小BOSS逼近 !', W/2, H/2+4);
    ctx.textAlign='left';
  }

  if(sfx.muted){ ctx.fillStyle='#553'; ctx.font='7px "Press Start 2P"'; ctx.fillText('MUTE', W-30, H-12); }
  // 演示模式指示
  if(game.demoMode){
    ctx.textAlign='center';
    const blink = Math.sin(Date.now()*0.008)>0;
    ctx.fillStyle = blink ? 'rgba(255,211,77,0.8)' : 'rgba(255,211,77,0.25)';
    ctx.font='24px "Press Start 2P"';
    ctx.fillText('DEMO', W/2, H/2);
    ctx.textAlign='left';
  }
  // 游戏中底部版权水印（低调显示）
  if(game.state==='playing' || game.state==='paused'){
    ctx.fillStyle='#2a2a3a'; ctx.font='6px "Press Start 2P"'; ctx.textAlign='center';
    ctx.fillText('© 杨树叶子出品', W/2, H-6); ctx.textAlign='left';
  }
}

//==================================================================
//  主循环
//==================================================================
function loop(ts){
  const dt = Math.min(0.033, (ts - (loop.last||ts))/1000) || 0;
  loop.last = ts;
  game.update(dt);

  drawBackground();
  if(game.state!=='menu'){
    drawPowerups();
    for(const e of game.enemies) drawEnemy(e);
    if(game.boss) drawBoss();
    drawBullets();
    drawPlayer();
    drawOptions();
    drawParticles();
    drawArcs();
    drawHUD();
  }
  drawOverlays();

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
