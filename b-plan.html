  </div>

<script>
//==================================================================
//  B 计划 (B Wings) 网页版 —— 纵向飞行射击 · 机翼武器更换系统
//==================================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = cv.width, H = cv.height;

// ---------- 工具 ----------
const rand = (a,b)=> a + Math.random()*(b-a);
const randi = (a,b)=> Math.floor(rand(a,b+1));
const clamp = (v,a,b)=> v<a?a:(v>b?b:v);
const pick = arr=> arr[Math.floor(Math.random()*arr.length)];
const TAU = Math.PI*2;
function rrect(x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x|0,y|0,w|0,h|0); }
function overlap(a,b){ return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y; }
function dist2(ax,ay,bx,by){ const dx=ax-bx,dy=ay-by; return dx*dx+dy*dy; }

// ---------- 输入 ----------
const keys = {};
let lastFire = false, lastDive = false;

// 移动端检测
const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
const touchUI = document.getElementById('touchUI');
const hintEl = document.getElementById('hint');
// 自动开火（移动端默认开启）
let autoFire = isMobile;

// 首次用户交互时恢复 AudioContext（移动端必需）
function resumeAudioOnce(){
  sfx.resume();
  document.removeEventListener('touchstart', resumeAudioOnce);
  document.removeEventListener('click', resumeAudioOnce);
}
document.addEventListener('touchstart', resumeAudioOnce, {passive:true});
document.addEventListener('click', resumeAudioOnce);

addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  // 演示模式下任意按键 → 退出演示回到菜单
  if(game.demoMode){ game.endDemo(); return; }
  keys[k] = true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if(k==='p') game.togglePause();
  if(k==='m') sfx.muted = !sfx.muted;
  if(k==='enter' && (game.state==='menu'||game.state==='gameover')) game.start();
  if(game.state==='wingSelect'){
    // 1-7 选择武器（对应 chooseWing(0)-(6)）
    for(let i=0;i<7;i++){
      if(k===String(i+1)) game.chooseWing(i);
    }
    // 按0或回车保留现有武器
    if(k==='0' || k==='enter') game.chooseWing(-1);
  }
});
addEventListener('keydown', e=>{ if(e.key==='Enter') e.preventDefault(); });
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

// ===== 触控：全屏相对滑动 + 自动开火 =====
// 手指按下时记录飞船位置，之后飞船跟随手指的移动量移动（不瞬移）
let moveTouch=null, touchStartX=0, touchStartY=0, shipStartX=0, shipStartY=0;
let fireTouching=false;

function canvasCoord(clientX, clientY){
  const r = cv.getBoundingClientRect();
  return { x:(clientX-r.left)/r.width*W, y:(clientY-r.top)/r.height*H };
}

// 触摸控制：全屏相对滑动
cv.addEventListener('touchstart', e=>{
  e.preventDefault();
  // 演示模式下任意触摸 → 退出演示回到菜单
  if(game.demoMode){ game.endDemo(); return; }
  for(const t of e.changedTouches){
    const r = cv.getBoundingClientRect();
    const localX = (t.clientX - r.left) / r.width * W;
    const localY = (t.clientY - r.top) / r.height * H;
    // 菜单/游戏结束/机翼选择：任意点击触发
    if(game.state==='menu' || game.state==='gameover'){
      game.start(); return;
    }
    if(game.state==='wingSelect'){
      handleWingSelectTouch(localX, localY); return;
    }
    if(game.state==='paused'){
      game.togglePause(); return;
    }
    if(game.state==='stageClear') return;
    // 游戏中：第一个触摸=移动控制（全屏），第二个触摸=手动射击
    if(moveTouch === null){
      moveTouch = t.identifier;
      // 记录手指起始位置和飞船起始位置，之后用相对位移移动飞船
      touchStartX = localX;
      touchStartY = localY;
      const p = game.p;
      shipStartX = p.x;
      shipStartY = p.y;
    } else {
      // 已有移动触摸时，第二个触摸=射击
      fireTouching = true;
    }
  }
}, {passive:false});

cv.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier === moveTouch){
      const p = game.p;
      // 重生动画期间禁用触控移动
      if(p.respawn > 0) continue;
      const r = cv.getBoundingClientRect();
      const localX = (t.clientX - r.left) / r.width * W;
      const localY = (t.clientY - r.top) / r.height * H;
      // 飞船位置 = 起始位置 + 手指位移量（相对滑动，不瞬移）
      const dx = localX - touchStartX;
      const dy = localY - touchStartY;
      p.x = clamp(shipStartX + dx, 4, W-p.w-4);
      p.y = clamp(shipStartY + dy, H*0.4, H-p.h-8);
    }
  }
}, {passive:false});

cv.addEventListener('touchend', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier === moveTouch){
      moveTouch = null;
      // 如果还有其他触摸，将第一个转为移动控制，重新记录起始位置
      for(const ot of e.touches){
        moveTouch = ot.identifier;
        const r = cv.getBoundingClientRect();
        touchStartX = (ot.clientX - r.left) / r.width * W;
        touchStartY = (ot.clientY - r.top) / r.height * H;
        const p = game.p;
        shipStartX = p.x;
        shipStartY = p.y;
        break;
      }
    } else {
      // 射击触摸结束
      fireTouching = false;
    }
  }
}, {passive:false});
cv.addEventListener('touchcancel', e=>{
  moveTouch = null; fireTouching = false;
}, {passive:false});

// 鼠标点击（桌面端兼容）
cv.addEventListener('click', ()=>{
  if(game.demoMode){ game.endDemo(); return; }
  if(game.state==='menu'||game.state==='gameover') game.start();
});

// ===== 触控按钮事件 =====
function bindTouchBtn(elId, onDown, onUp){
  const el = document.getElementById(elId);
  if(!el) return;
  const down = e=>{ e.preventDefault(); e.stopPropagation();
    if(game.demoMode){ game.endDemo(); return; }
    el.classList.add('active'); onDown(); };
  const up = e=>{ e.preventDefault(); e.stopPropagation(); el.classList.remove('active'); if(onUp) onUp(); };
  el.addEventListener('touchstart', down, {passive:false});
  el.addEventListener('touchend', up, {passive:false});
  el.addEventListener('touchcancel', up, {passive:false});
  // 桌面端鼠标兼容
  el.addEventListener('mousedown', down);
  el.addEventListener('mouseup', up);
  el.addEventListener('mouseleave', up);
}

// 射击按钮
bindTouchBtn('btnFire',
  ()=>{ fireTouching = true; },
  ()=>{ fireTouching = false; }
);
// 下潜按钮
bindTouchBtn('btnDive',
  ()=>{ keys['k'] = true; },
  ()=>{ keys['k'] = false; }
);
// 暂停按钮
bindTouchBtn('btnPause',
  ()=>{ game.togglePause(); },
  null
);
// 静音按钮
bindTouchBtn('btnMute',
  ()=>{ sfx.muted = !sfx.muted; },
  null
);
// 自动开火切换
bindTouchBtn('btnAuto',
  ()=>{
    autoFire = !autoFire;
    const el = document.getElementById('btnAuto');
    if(autoFire) el.classList.add('on'); else el.classList.remove('on');
  },
  null
);

// 机翼选择触控
function handleWingSelectTouch(tx, ty){
  if(game.state !== 'wingSelect') return;
  const cols=4, cw=74, ch=120, gapX=8, gapY=8;
  const totalW=cw*cols+gapX*(cols-1);
  const sx=(W-totalW)/2, sy=76;
  const totalCards = 1 + game.wingChoices.length; // 保留卡片 + 武器卡片
  for(let i=0;i<totalCards;i++){
    const col=i%cols, row=Math.floor(i/cols);
    const x = sx+col*(cw+gapX), y = sy+row*(ch+gapY);
    if(tx>=x && tx<=x+cw && ty>=y && ty<=y+ch){
      // i=0 是保留卡片，对应 chooseWing(-1)；i>=1 对应 chooseWing(i-1)
      game.chooseWing(i===0 ? -1 : i-1);
      return;
    }
  }
}

// 移动端初始化
if(isMobile){
  touchUI.classList.add('show');
  hintEl.classList.add('mobile');
  // 同步自动开火按钮状态
  const btnAutoEl = document.getElementById('btnAuto');
  if(autoFire) btnAutoEl.classList.add('on'); else btnAutoEl.classList.remove('on');
  // 阻止双击缩放
  let lastTouchTime = 0;
  document.addEventListener('touchend', e=>{
    const now = Date.now();
    if(now - lastTouchTime <= 300) e.preventDefault();
    lastTouchTime = now;
  }, {passive:false});
}

// ---------- 音效引擎（多振荡器·频率扫描·噪声·立体声） ----------
const sfx = (()=>{
  let ac=null, muted=false, masterGain=null;
  function ctxA(){
    if(!ac){
      try{
        ac=new (window.AudioContext||window.webkitAudioContext)();
        masterGain=ac.createGain();
        masterGain.gain.value=0.7;
        masterGain.connect(ac.destination);
      }catch(e){}
    }
    return ac;
  }
  function resumeAC(){ const a=ctxA(); if(a && a.state==='suspended'){ a.resume(); } }

  // 核心合成器：支持频率扫描、波形、音量包络、立体声偏移
  function tone(opt){
    if(muted) return;
    const a=ctxA(); if(!a) return;
    if(a.state==='suspended') a.resume();
    const t=a.currentTime;
    const {
      freq=440, freqEnd=null,           // 起始/结束频率
      type='square',                     // 波形
      dur=0.1, vol=0.08,                 // 时长/音量
      attack=0.005, decay=0.0,           // ADSR
      pan=0,                             // 立体声 -1~1
      delay=0,                           // 延迟触发
    } = opt;
    const when=t+delay;

    // 立体声
    let dest=masterGain;
    if(pan!==0 && ac.createStereoPanner){
      const p=ac.createStereoPanner();
      p.pan.value=clamp(pan,-1,1);
      p.connect(masterGain);
      dest=p;
    }

    const o=a.createOscillator(), g=a.createGain();
    o.type=type;
    o.frequency.setValueAtTime(freq, when);
    if(freqEnd!==null){
      o.frequency.exponentialRampToValueAtTime(Math.max(1,freqEnd), when+dur);
    }
    // 音量包络
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vol, when+attack);
    if(decay>0){
      g.gain.exponentialRampToValueAtTime(0.0001, when+attack+decay);
    } else {
      g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
    }
    o.connect(g); g.connect(dest);
    o.start(when);
    o.stop(when+dur+0.05);
  }

  // 噪声合成（用于火焰、爆炸等）
  function noise(opt){
    if(muted) return;
    const a=ctxA(); if(!a) return;
    if(a.state==='suspended') a.resume();
    const t=a.currentTime;
    const {
      dur=0.2, vol=0.08, freq=1000, q=1,
      type='bandpass', delay=0,
    } = opt;
    const when=t+delay;
    const bufSize=Math.floor(a.sampleRate*dur);
    const buf=a.createBuffer(1,bufSize,a.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufSize;i++) data[i]=Math.random()*2-1;
    const src=a.createBufferSource(); src.buffer=buf;
    const filt=a.createBiquadFilter();
    filt.type=type; filt.frequency.value=freq; filt.Q.value=q;
    const g=a.createGain();
    g.gain.setValueAtTime(vol,when);
    g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
    src.connect(filt); filt.connect(g); g.connect(masterGain);
    src.start(when);
    src.stop(when+dur+0.05);
  }

  // 批量播放多个音
  function chord(tones){
    for(const t of tones) tone(t);
  }

  return {
    get muted(){return muted;}, set muted(v){muted=v;},
    resume: resumeAC,

    // ===== 每种武器独有音效 =====
    // 裸机：微弱短促单发
    fireNone(){
      tone({freq:420,freqEnd:280,type:'square',dur:0.06,vol:0.05,attack:0.002});
    },
    // 加农：高频连射，清脆穿透
    fireCannon(){
      tone({freq:1400,freqEnd:900,type:'square',dur:0.04,vol:0.05,attack:0.001});
      tone({freq:700,freqEnd:500,type:'triangle',dur:0.03,vol:0.03,delay:0.008});
    },
    // 宽幅：五路扇形，呼啸扩散
    fireWide(){
      tone({freq:600,freqEnd:300,type:'sawtooth',dur:0.12,vol:0.06,attack:0.003});
      tone({freq:900,freqEnd:450,type:'square',dur:0.08,vol:0.03,delay:0.01});
      tone({freq:400,freqEnd:200,type:'triangle',dur:0.10,vol:0.04,delay:0.015});
    },
    // 散弹：三路下降音阶
    fireMulti(){
      tone({freq:800,freqEnd:600,type:'square',dur:0.05,vol:0.04,attack:0.001});
      tone({freq:660,freqEnd:480,type:'square',dur:0.05,vol:0.035,delay:0.02});
      tone({freq:540,freqEnd:380,type:'square',dur:0.05,vol:0.035,delay:0.04});
    },
    // 锤头：金属敲击声
    fireHammer(){
      tone({freq:1200,freqEnd:600,type:'square',dur:0.05,vol:0.04,attack:0.001});
      tone({freq:320,freqEnd:120,type:'triangle',dur:0.10,vol:0.06,attack:0.002});
      noise({dur:0.04,vol:0.02,freq:2500,q:3,type:'bandpass'});
    },
    // 边炮：左右立体声交替
    fireSide(){
      tone({freq:520,freqEnd:380,type:'sawtooth',dur:0.07,vol:0.05,pan:-0.7,attack:0.002});
      tone({freq:520,freqEnd:380,type:'sawtooth',dur:0.07,vol:0.05,pan:0.7,attack:0.002,delay:0.015});
      tone({freq:700,freqEnd:500,type:'square',dur:0.04,vol:0.03,delay:0.03});
    },
    // 双向：前后双音叠加
    fireAnti(){
      tone({freq:880,freqEnd:1100,type:'square',dur:0.05,vol:0.045,attack:0.001});
      tone({freq:440,freqEnd:220,type:'triangle',dur:0.06,vol:0.04,delay:0.005});
      tone({freq:660,freqEnd:330,type:'sawtooth',dur:0.04,vol:0.03,delay:0.02});
    },
    // 火焰：持续噪声呼啸
    fireFire(){
      noise({dur:0.14,vol:0.06,freq:600,q:0.8,type:'bandpass'});
      tone({freq:180,freqEnd:120,type:'sawtooth',dur:0.12,vol:0.05,attack:0.003});
      tone({freq:90,freqEnd:60,type:'triangle',dur:0.10,vol:0.03,delay:0.02});
    },
    // 弓波：频率扫描横扫感
    fireDyna(){
      tone({freq:200,freqEnd:800,type:'sine',dur:0.15,vol:0.06,attack:0.005});
      tone({freq:400,freqEnd:1600,type:'triangle',dur:0.10,vol:0.03,delay:0.02});
    },
    // 追踪激光：上升音调 + 持续嗡鸣
    fireLaser(){

      tone({freq:600,freqEnd:900,type:'square',dur:0.12,vol:0.025,delay:0.03});
      tone({freq:1200,freqEnd:1500,type:'triangle',dur:0.08,vol:0.02,delay:0.06});
    },
    // 闪电：雷暴轰鸣，高频电弧 + 低频雷击
    fireChain(){
      // 初始电弧噼啪
      tone({freq:3000,freqEnd:1200,type:'square',dur:0.04,vol:0.06,attack:0.001});
      tone({freq:2400,freqEnd:600,type:'square',dur:0.05,vol:0.05,delay:0.01});
      noise({dur:0.08,vol:0.05,freq:4000,q:4,type:'bandpass'});
      // 雷击低频轰鸣
      tone({freq:80,freqEnd:30,type:'sawtooth',dur:0.30,vol:0.10,attack:0.003});
      tone({freq:160,freqEnd:50,type:'sine',dur:0.25,vol:0.06,delay:0.02});
      // 余波电弧
      tone({freq:1800,freqEnd:900,type:'square',dur:0.04,vol:0.03,delay:0.06});
      noise({dur:0.05,vol:0.02,freq:2000,q:6,type:'bandpass',delay:0.08});
    },
    // 铜钱：重型金属环鸣 + 低频冲击
    fireCoin(){
      tone({freq:800,freqEnd:400,type:'triangle',dur:0.25,vol:0.08,attack:0.002});
      tone({freq:1200,freqEnd:600,type:'sine',dur:0.30,vol:0.05,delay:0.005});
      tone({freq:60,freqEnd:30,type:'sine',dur:0.20,vol:0.10,attack:0.002});
      noise({dur:0.08,vol:0.04,freq:2000,q:8,type:'bandpass'});
      tone({freq:400,freqEnd:200,type:'triangle',dur:0.15,vol:0.03,delay:0.04});
    },
    // 僚机射击：轻快短促的电子音
    fireOption(){
      tone({freq:1400,freqEnd:1000,type:'square',dur:0.04,vol:0.018,attack:0.001});
    },

    // ===== 通用音效 =====
    // 敌人射击：低沉威胁感
    enemyShot(){
      tone({freq:300,freqEnd:150,type:'sawtooth',dur:0.06,vol:0.025,attack:0.002});
    },
    // Boss射击：厚重压迫感
    bossShot(){
      tone({freq:200,freqEnd:100,type:'sawtooth',dur:0.08,vol:0.04,attack:0.003});
      tone({freq:400,freqEnd:200,type:'square',dur:0.05,vol:0.02,delay:0.01});
    },
    explode(){
      noise({dur:0.18,vol:0.09,freq:400,q:0.5,type:'lowpass'});
      tone({freq:120,freqEnd:40,type:'sawtooth',dur:0.18,vol:0.09,attack:0.002});
      tone({freq:70,freqEnd:30,type:'square',dur:0.20,vol:0.06,delay:0.01});
    },
    hit(){ tone({freq:200,freqEnd:100,type:'square',dur:0.12,vol:0.08,attack:0.001}); },
    power(){
      tone({freq:660,freqEnd:990,type:'sine',dur:0.08,vol:0.07,attack:0.003});
      tone({freq:990,freqEnd:1320,type:'triangle',dur:0.12,vol:0.06,delay:0.07});

function fireWeapon(p){
  const w = WINGS[p.weapon];
  const cx = p.x + p.w/2, cy = p.y + 4;
  switch(p.weapon){
    case 'NONE':
      pBullet(cx-3, cy, 0, -520, {w:6,h:12,color:'#cfd6e4',dmg:1}); sfx.fireNone(); break;
    case 'CANNON':
      pBullet(cx-4, cy, 0, -680, {w:8,h:16,color:'#5cc8ff',dmg:1.4});
      pBullet(cx+1, cy+2, 0, -640, {w:4,h:10,color:'#9fe4ff',dmg:0.8});
      sfx.fireCannon(); break;
    case 'WIDE': {
      const sp=520;
      for(let a=-2;a<=2;a++){ const ang=-Math.PI/2 + a*0.32; pBullet(cx-3, cy, Math.cos(ang)*sp, Math.sin(ang)*sp, {w:6,h:10,color:'#5cff8f',dmg:1}); }
      sfx.fireWide(); break;
    }
    case 'MULTI': {
      pBullet(cx-3, cy, 0, -560, {w:6,h:12,color:'#fff35c',dmg:1});
      const drift = 90 + (p.fireCount%6)*22;
      pBullet(cx-3, cy, -drift, -520, {w:5,h:10,color:'#fff35c',dmg:0.8});
      pBullet(cx+1, cy, drift, -520, {w:5,h:10,color:'#fff35c',dmg:0.8});
      sfx.fireMulti(); break;
    }
    case 'HAMMER':
      // 主武器：左右两排子弹（环绕弹自动碰撞另外处理）
      pBullet(cx-9, cy, 0, -540, {w:5,h:12,color:'#ffe14d',dmg:0.6});
      pBullet(cx+4, cy, 0, -540, {w:5,h:12,color:'#ffe14d',dmg:0.6});
      sfx.fireHammer(); break;
    case 'SIDE': {
      // 两侧子弹角度随时间摆动，范围动态扩大/缩小
      const sp = 480;
      const swing = 0.8814 + 0.6894 * Math.sin(p.fireCount * 0.35); // 11°~90° (0.192~1.571 弧度)
      const svx = Math.cos(swing) * sp;
      const svy = -Math.sin(swing) * sp;
      pBullet(cx-3, cy, -svx, svy, {w:7,h:7,color:'#ff7bf0',dmg:1});
      pBullet(cx+1, cy, svx, svy, {w:7,h:7,color:'#ff7bf0',dmg:1});
      pBullet(cx-2, cy, 0, -420, {w:5,h:10,color:'#ff7bf0',dmg:0.8});
      sfx.fireSide(); break; }
    case 'ANTI':
      pBullet(cx-9, cy, 0, -560, {w:6,h:12,color:'#5cfff5',dmg:1.5});
      pBullet(cx+3, cy, 0, -560, {w:6,h:12,color:'#5cfff5',dmg:1.5});
      pBullet(cx-3, cy+8, 0, 460, {w:6,h:12,color:'#5cfff5',dmg:1.5,down:true});
      pBullet(cx-3, cy, -380, 0, {w:7,h:7,color:'#5cfff5',dmg:1.2});
      pBullet(cx+3, cy, 380, 0, {w:7,h:7,color:'#5cfff5',dmg:1.2});
      sfx.fireAnti(); break;
    case 'FIRE':
      // 火焰喷射：不发射子弹，由 fireStream 系统持续渲染和伤害
      sfx.fireFire(); break;
    case 'DYNA':
      pBullet(cx-3, cy, 0, -440, {w:9,h:14,color:'#ffcc4d',dmg:1.8,type:'dyna',amp:110,baseX:cx,phase:p.fireCount*0.6,life:2.2});
      sfx.fireDyna(); break;
    case 'LASER': {
      // 跟踪激光：发射后自动追踪最近敌人
      pBullet(cx-3, cy, 0, -360, {w:8,h:16,color:'#ff3aef',dmg:1.6,type:'laser',turn:5.5,life:3,pierce:3});
      sfx.fireLaser(); break; }
    case 'CHAIN': {
      // 闪电：直线飞行的雷球，感应范围内自动触雷劈击敌人
      pBullet(cx-4, cy, 0, -380, {w:14,h:14,color:'#00e5ff',dmg:8.0,type:'lightning',life:2.5,senseRange:90,struck:new Set(),chains:3,chainRange:130,chainDmgMul:0.6});
      sfx.fireChain(); break; }
    case 'COIN': {
      // 铜钱：两枚巨型铜钱，高速发射、低频，由小变大至1/3屏幕

  }
  p.fireCount++;
}

// 影子僚机：跟随玩家，自动射击
function addOption(p){
  // 如果有脱离的僚机，不能添加新的（需要先接触回收）
  const attachedCount = p.options.filter(o=>!o.detached).length;
  if(attachedCount >= 4) return false;
  if(p.options.length >= 4) return false;
  // 僚机排列位置：左1 右1 左2 右2
  const slots = [
    {ox:-38, oy:-10},
    {ox:38,  oy:-10},
    {ox:-60, oy:5},
    {ox:60,  oy:5},
  ];
  const slot = slots[p.options.length];
  p.options.push({
    x: p.x, y: p.y,           // 当前位置
    tx: p.x, ty: p.y,         // 目标位置
    ox: slot.ox, oy: slot.oy, // 相对玩家偏移
    cool: 0,                    // 射击冷却
    angle: 0,                   // 跟随旋转角度（用于环绕效果）
    detached: false,
  });
  return true;
}

  asteroidRain: { name:'陨石雨',   color:'#8a7a5a', bgTop:'#1a1208', bgBot:'#0a0804', accent:'#a89a6a' },

function getTerrainType(stage){
  // 前3关无地形，第4关起逐步引入地形
  if(stage <= 3) return 'none';
  return TERRAIN_TYPES[(stage-4) % 4];
}
// 生成隧道墙壁段：左右各有一堵墙，中间是通道
function genTunnelSegment(prevGap){
  // gapX = 通道左边界的x，gapW = 通道宽度
  const minGap = 70, maxGap = 100;
  const gapW = randi(minGap, maxGap);
  // 通道位置在上一段基础上偏移（不超过屏幕范围）
  const maxShift = 50;
  let gapX;
  if(prevGap !== undefined){
    gapX = clamp(prevGap + rand(-maxShift, maxShift), 15, W - gapW - 15);
  } else {
    gapX = rand(15, W - gapW - 15);
  }
  return { gapX, gapW, y:-40, h:40, passed:false };
}

function miniBossAttack(e, p){
  const cx=e.x+e.w/2, cy=e.y+e.h/2, st=e.stage;
  const spdBoost = 1 + st*0.05;
  switch(e.kind){
    case 'GUARD':{
      // 3-way spread
      for(let i=-1;i<=1;i++){
        const ang = Math.PI/2 + i*0.32;
        enemyShot(cx, cy+8, Math.cos(ang)*180*spdBoost, Math.sin(ang)*180*spdBoost);
      }
      sfx.enemyShot();
      break;}
    case 'HUNTER':{
      // 2 aimed shots
      const dx=p.x-cx, dy=p.y-cy, dist=Math.sqrt(dx*dx+dy*dy)||1;
      enemyShot(cx-6, cy+8, dx/dist*260*spdBoost, dy/dist*260*spdBoost);
      enemyShot(cx+6, cy+8, dx/dist*260*spdBoost, dy/dist*260*spdBoost);
      sfx.enemyShot();
      break;}
    case 'WARDEN':{
      // 6-way radial burst
      const n=6;
      for(let i=0;i<n;i++){
        const ang = (i/n)*TAU + e.t*0.5;
        enemyShot(cx, cy, Math.cos(ang)*150*spdBoost, Math.sin(ang)*150*spdBoost);
      }
      sfx.enemyShot();
      break;}
  }
}

    this.p = makePlayer();
    this.pbullets=[]; this.ebullets=[]; this.enemies=[]; this.powerups=[];
    this.particles=[]; this.floats=[]; this.boss=null;
    this.arcs=[];
    this.bossWarn=0; this.flash=0; this.transition=0;

    // 随机选一个演示场景
    const scenarios = [4, 5, 6, 7, 8];
    this.stage = pick(scenarios);
    this.stageTimer=0; this.carrierTimer=5; this.spawnTimer=1;
    this.miniBossTimer=0; this.miniBossSpawned=false; this.miniBossWarn=0;
    this.obstacleTimer = rand(4, 7);
    this.setupTerrain();
    this.setupMiniBoss();

    // 装备随机武器（后面根据场景覆盖）
    this.p.weapon = pick(WING_COMMON);
    if(this.p.weapon==='HAMMER' || this.p.weapon==='COIN') spawnHammer(this.p);

    // 四种演示场景按概率出现：
    // 20% 航天母舰形态 / 30% 普通武器 / 30% 2-4架影子僚机 / 20% 稀有武器
    const r = Math.random();
    if(r < 0.20){
      // ---- 航天母舰形态（最终形态）----
      for(let i=0; i<4; i++) addOption(this.p);
      this.p.carrierMode = 12.0;
      this.p.invuln = 1.0;
      floatText(W/2, H/2-20, '航天母舰!', '#ffd34d');
    } else if(r < 0.50){
      // ---- 普通武器形态（无僚机）----
      this.p.weapon = pick(WING_COMMON);
      if(this.p.weapon==='HAMMER' || this.p.weapon==='COIN') spawnHammer(this.p);
    } else if(r < 0.80){
      // ---- 携带 2~4 架影子僚机 ----
      const numOptions = randi(2, 5);
      for(let i=0; i<numOptions; i++) addOption(this.p);
    } else {
      // ---- 携带稀有武器 ----
      this.p.weapon = pick(WING_RARE);
      if(this.p.weapon==='HAMMER' || this.p.weapon==='COIN') spawnHammer(this.p);
    }

    // 设定较高分数让画面好看
    this.p.score = this.stage * 5000 + randi(0, 3000);
    this.p.lives = 20 + randi(0, 10);

    this.state='playing';
    this.stageTimer=0; this.bossWarn=0;

    // 显示关卡信息
    const td = TERRAIN_DATA[getTerrainType(this.stage)];
    floatText(W/2, H/2, 'STAGE '+this.stage+' DEMO', '#5cc8ff');
    if(td) floatText(W/2, H/2+20, td.name, td.accent);
  },

  endDemo(){
    this.demoMode = false;
    this.demoTimer = 0;
    this.state = 'menu';
    this.menuIdleTimer = 0;
    // 清理游戏实体
    this.enemies=[]; this.ebullets=[]; this.pbullets=[]; this.powerups=[];
    this.particles=[]; this.floats=[]; this.boss=null; this.arcs=[];
    this.bossWarn=0; this.miniBossWarn=0;
  },

  startWingSelect(){
    this.wingChoices = [...WING_COMMON];
    this.state='wingSelect';
  },
  chooseWing(i){
    if(this.state!=='wingSelect') return;
    // i=-1 或 i>=武器数：保留现有武器
    if(i === -1 || i >= this.wingChoices.length){
      sfx.select();
      this.state='playing';
      this.stageTimer=0; this.bossWarn=0;
      this.setupMiniBoss();
      this.setupTerrain();
      if(this.p.weapon !== 'NONE'){
        floatText(W/2, H/2, '保留: '+WINGS[this.p.weapon].name, WINGS[this.p.weapon].color);
      } else {
        floatText(W/2, H/2, '裸机出击', '#cfd6e4');
      }
      floatText(W/2, H/2+20, this.terrain.name, this.terrain.accent);
      return;
    }
    const w = this.wingChoices[i];
    if(!w) return;
    this.p.weapon = w;
    if(w==='HAMMER' || w==='COIN') spawnHammer(this.p);
    sfx.power();
    this.state='playing';
    this.stageTimer=0; this.bossWarn=0;
    this.setupMiniBoss();
    this.setupTerrain();
    floatText(W/2, H/2, '装备: '+WINGS[w].name, WINGS[w].color);
    floatText(W/2, H/2+20, this.terrain.name, this.terrain.accent);
  },

  togglePause(){
    if(this.state==='playing'){ this.state='paused'; }
    else if(this.state==='paused'){ this.state='playing'; }
  },

  // 隧道撞墙：直接坠毁（无视武器/护盾）
  tunnelCrash(p){
    p.lives--;
    burst(p.x+p.w/2, p.y+p.h/2, 30, '#ff5c5c', 200);
    burst(p.x+p.w/2, p.y+p.h/2, 20, '#3a7aff', 160);
    burst(p.x+p.w/2, p.y+p.h/2, 12, '#ffe14d', 120);
    sfx.explode(); this.flash=0.3; haptic(120);
    floatText(p.x, p.y-10, '撞墙坠毁!', '#ff5c5c');
    // 影子僚机脱离
    for(const o of p.options){
      o.detached = true;
      o.dx = o.x; o.dy = o.y;
      o.bob = rand(0,TAU);
    }
    if(p.lives<=0){
      if(this.demoMode){ this.endDemo(); return; }
      this.state='gameover'; sfx.gameover(); haptic(200);
    } else {
      p.respawn = 1.4;
      p.respawnMax = 1.4;
      p.weapon='NONE'; p.hammers=[];
      p.invuln = 1.4;
    }
  },

  nextStage(){
    this.stage++;
    this.stageTimer=0; this.bossWarn=0; this.boss=null;
    this.p.invuln = Math.max(this.p.invuln,1);
    // 每5关可选武器（第1、6、11...关）
    if(this.stage % 5 === 1 && !this.demoMode){
      this.startWingSelect();
    } else {
      if(this.demoMode && this.stage % 5 === 1){
        // 演示模式自动选武器
        this.p.weapon = pick(WING_COMMON);
      }
      this.state='playing';
      this.stageTimer=0; this.bossWarn=0;
      this.setupMiniBoss();
      this.setupTerrain();
      const td = TERRAIN_DATA[getTerrainType(this.stage)];
      floatText(W/2, H/2, 'STAGE '+this.stage, '#5cc8ff');
      floatText(W/2, H/2+20, td.name, td.accent);
    }
  },

  //------------- 主更新 -------------
  update(dt){
    if(this.state==='playing') this.updatePlay(dt);
    else if(this.state==='stageClear'){ this.clearTimer-=dt; if(this.clearTimer<=0) this.nextStage(); }
    // ---- 菜单闲置计时 → 自动进入演示 ----
    if(this.state==='menu' && !this.demoMode){
      this.menuIdleTimer += dt;
      if(this.menuIdleTimer >= 5.0){
        this.startDemo();
      }
    }
    // ---- 演示模式倒计时 ----
    if(this.demoMode){
      this.demoTimer -= dt;
      if(this.demoTimer <= 0){ this.endDemo(); }
    }
    // 背景常动
    for(const s of stars){ s.y += (40+s.z*120)*dt; if(s.y>H){ s.y=0; s.x=rand(0,W);} }
    nebula += dt;
    if(this.flash>0) this.flash-=dt;
  },

  updatePlay(dt){
    const p=this.p;
    // ---- 重生动画：坠毁延迟 → 新机从底部飞入 ----
    if(p.respawn > 0){
      p.respawn -= dt;
      if(p.invuln>0) p.invuln-=dt;
      const elapsed = p.respawnMax - p.respawn;
      const crashTime = 0.8;  // 坠毁爆炸延迟
      const enterTime = 0.6;  // 新机飞入时长
      if(elapsed < crashTime){
        // 坠毁阶段：原地冒烟+火花
        if(Math.random()<0.6){
          const a=rand(0,TAU), s=rand(40,120);
          game.particles.push({
            x:p.x+p.w/2+rand(-8,8), y:p.y+p.h/2+rand(-6,6),
            vx:Math.cos(a)*s, vy:Math.sin(a)*s,
            life:rand(0.3,0.7), color:pick(['#ff5c5c','#ff9b3a','#ffe14d','#555']), size:rand(2,5)
          });
        }
      } else if(elapsed < crashTime + enterTime){
        // 飞入阶段：新机从底部飞向中央
        const flyProg = (elapsed - crashTime) / enterTime;
        const targetX = W/2 - p.w/2;
        const targetY = H - 80;
        p.x = targetX;
        p.y = H + 30 - (H + 30 - targetY) * flyProg;
        // 飞入尾焰
        if(Math.random()<0.8){
          game.particles.push({
            x:p.x+p.w/2+rand(-3,3), y:p.y+p.h,
            vx:rand(-10,10), vy:rand(40,80),
            life:0.3, color:pick(['#ff9b3a','#ffe14d']), size:rand(2,4)
          });
        }
        if(p.respawn <= 0){
          // 飞入完成
          p.respawn = 0;
          p.invuln = Math.max(p.invuln, 1.0);
          floatText(p.x, p.y-20, '重生!', '#5cff8f');
          burst(p.x+p.w/2, p.y+p.h/2, 10, '#5cff8f', 80);
        }
      } else {
        p.respawn = 0;
        p.invuln = Math.max(p.invuln, 1.0);
      }
      // 重生期间只更新背景和粒子，跳过其余逻辑
      // 脱离的僚机继续漂浮 + 缓慢下沉
      for(const o of p.options){
        if(o.detached){
          o.bob = (o.bob||0) + dt*2;
          o.dy += 12*dt; // 缓慢下沉
          o.x = o.dx + Math.cos(o.bob)*4;
          o.y = o.dy + Math.sin(o.bob*1.3)*3;
        }
      }
      // 下沉出屏幕的僚机丢失
      const beforeLen = p.options.length;
      p.options = p.options.filter(o => !o.detached || o.y < H+30);
      if(p.options.length < beforeLen){
        floatText(W/2, H/2, '僚机丢失!', '#ff5c5c');
      }
      for(const pt of this.particles){ pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.life-=dt; pt.vx*=0.92; pt.vy*=0.92; }
      this.particles=this.particles.filter(pt=>pt.life>0);
      for(const f of this.floats){ f.y-=18*dt; f.life-=dt; }
      this.floats=this.floats.filter(f=>f.life>0);
      // 敌人继续移动但不碰玩家
      for(const e of this.enemies){
        e.t+=dt;
        switch(e.type){
          case 'grunt': e.y+=e.vy*dt; break;
          case 'fast':  e.y+=e.vy*dt; e.x+=Math.sin(e.t*6)*40*dt; break;
          case 'missile': e.y+=e.vy*dt; break;
          case 'barrier': e.y+=e.vy*dt; break;
          case 'turret': e.y+=e.vy*dt; break;
          case 'carrier': e.y+=e.vy*dt; e.x+=e.drift*dt; if(e.x<20||e.x>W-e.w-20) e.drift*=-1; break;
        }
        if(e.y>H+50) e.dead=true;
      }
      this.enemies=this.enemies.filter(e=>!e.dead);
      for(const b of this.ebullets){ b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.y>H+20||b.y<-20||b.x<-20||b.x>W+20) b.dead=true; }
      this.ebullets=this.ebullets.filter(b=>!b.dead);
      return;
    }
    // ---- 玩家移动 ----
    let mx=0,my=0;
    if(game.demoMode){
      // ==== AI 演示操控 ===
      const pcx = p.x + p.w/2, pcy = p.y + p.h/2;
      // 目标位置：默认在底部中央
      let targetX = W/2, targetY = H - 80;
      // 威胁避让：检查附近敌弹和敌人
      let dodgeX = 0, dodgeY = 0;
      const dodgeR = 80;
      for(const eb of this.ebullets){
        if(eb.dead) continue;
        const dx = pcx - (eb.x + eb.w/2), dy = pcy - (eb.y + eb.h/2);
        const d2 = dx*dx + dy*dy;
        if(d2 < dodgeR*dodgeR && d2 > 4){
          const d = Math.sqrt(d2);
          const w = (1 - d/dodgeR);
          dodgeX += (dx/d) * w;
          dodgeY += (dy/d) * w * 0.6; // 垂直避让弱一些
        }
      }
      for(const e of this.enemies){
        if(e.dead || e.type==='laserGate') continue;
        const ex = e.x + e.w/2, ey = e.y + e.h/2;
        const dx = pcx - ex, dy = pcy - ey;
        const d2 = dx*dx + dy*dy;
        if(d2 < dodgeR*dodgeR && d2 > 4 && dy > -20){ // 只避让前方敌人
          const d = Math.sqrt(d2);
          const w = (1 - d/dodgeR) * 0.8;
          dodgeX += (dx/d) * w;
          dodgeY += (dy/d) * w * 0.3;
        }
      }
      // 拾取道具：朝最近的道具移动
      let nearestPow = null, powDist = 1e9;
      for(const u of this.powerups){
        if(u.dead || u.broken) continue;
        const dx = (u.x+u.w/2) - pcx, dy = (u.y+u.h/2) - pcy;
        const d2 = dx*dx + dy*dy;
        if(d2 < powDist){ powDist = d2; nearestPow = u; }
      }
      if(nearestPow && powDist < 150*150){
        const dx = (nearestPow.x+nearestPow.w/2) - pcx;
        const dy = (nearestPow.y+nearestPow.h/2) - pcy;
        targetX = pcx + dx * 0.8;
        targetY = pcy + dy * 0.5;
      }
      // 隧道墙壁避让：朝最近的墙壁缺口中心移动
      if(this.terrain && this.terrain.type === 'spaceTunnel'){
        for(const w of this.terrain.tunnelWalls){
          if(w.y > -40 && w.y < H){
            const gapCenter = w.gapX + w.gapW/2;
            const distToWall = w.y - pcy;
            if(distToWall > -20 && distToWall < 200){
              // 强烈引导向缺口
              targetX = gapCenter - p.w/2;
              targetY = pcy; // 保持当前Y
              break;
            }
          }
        }
      }
      // 激光屏障避让：朝缺口移动
      for(const e of this.enemies){
        if(e.type !== 'laserGate' || e.dead) continue;
        if(e.active && e.y > pcy - 80 && e.y < pcy + 60){
          const gapCenter = e.gapX + e.gapW/2;
          targetX = gapCenter - p.w/2;
          break;
        }
      }
      // 应用避让
      if(Math.abs(dodgeX) > 0.01 || Math.abs(dodgeY) > 0.01){
        targetX = pcx + dodgeX * 60;
        targetY = pcy + dodgeY * 50;
      }
      // 限制范围
      targetX = clamp(targetX, 20, W - p.w - 20);
      targetY = clamp(targetY, H*0.45, H - p.h - 12);
      // 平滑移动
      const aiSp = 240;
      const ddx = targetX - p.x, ddy = targetY - p.y;
      const dist = Math.hypot(ddx, ddy);
      if(dist > 2){
        const mv = Math.min(aiSp * dt, dist);
        p.x += (ddx/dist) * mv;
        p.y += (ddy/dist) * mv;
      }
      // AI 始终开火
      p.fireDown = true;
      p.x=clamp(p.x,4,W-p.w-4); p.y=clamp(p.y,H*0.4,H-p.h-8);
    } else {
    if(keys['arrowleft']||keys['a']) mx-=1;
    if(keys['arrowright']||keys['d']) mx+=1;
    if(keys['arrowup']||keys['w']) my-=1;
    if(keys['arrowdown']||keys['s']) my+=1;
    // 键盘移动
    const sp=300;
    p.x += mx*sp*dt; p.y += my*sp*dt;
    // 射击：键盘J/空格 或 触控射击按钮 或 自动开火
    p.fireDown = keys['j']||keys[' ']||fireTouching||autoFire;
    p.x=clamp(p.x,4,W-p.w-4); p.y=clamp(p.y,H*0.4,H-p.h-8);
    }

    // ---- 合体/解体过渡动画 ----
    if(p.carrierAnim > 0){
      p.carrierAnim -= dt;
      const cx2 = p.x + p.w/2, cy2 = p.y + p.h/2;
      const isDisassemble = p.carrierAnimType === 'disassemble';
      if(p.carrierAnim <= 0){
        p.carrierAnim = 0;
        p.carrierAnimType = '';
        if(isDisassemble){
          // 解体完成：恢复僚机环绕
          floatText(p.x, p.y-20, '僚机归位!', '#80c8ff');
          burst(cx2, cy2, 16, '#80c8ff', 140);
          sfx.power();
          p.invuln = Math.max(p.invuln, 0.8);
        } else {
          // 合体完成：进入母舰模式
          burst(cx2, cy2, 30, '#ffd34d', 200);
          burst(cx2, cy2, 20, '#80c8ff', 150);
          game.flash = 0.3;
          sfx.explode(); haptic(60);
        }
      } else {
        // 动画进行中：无敌
        p.invuln = Math.max(p.invuln, 0.1);
        if(!isDisassemble){
          // 合体中：僚机向中心聚拢 + 充能粒子
          const progress = 1 - p.carrierAnim / p.carrierAnimMax;
          for(const o of p.options){
            o.tx = cx2 + o.ox * (1 - progress);
            o.ty = cy2 + o.oy * (1 - progress);
            o.x += (o.tx - o.x) * 0.3;
            o.y += (o.ty - o.y) * 0.3;
          }
          // 充能粒子向中心吸入
          if(Math.random() < 0.8){
            const a = rand(0, TAU);
            const d = 50 * (1 - progress) + 20;
            game.particles.push({
              x: cx2 + Math.cos(a)*d, y: cy2 + Math.sin(a)*d,
              vx: -Math.cos(a)*200, vy: -Math.sin(a)*200,
              life: 0.3, color: Math.random()<0.5?'#ffd34d':'#80c8ff', size: rand(2,4)
            });
          }
          // 合体完成瞬间触发母舰模式
          if(p.carrierAnim < 0.05 && p.carrierMode <= 0){
            p.carrierMode = 8.0;
          }
        } else {
          // 解体中：闪烁 + 偶发粒子爆裂
          if(Math.random() < 0.5){
            burst(cx2 + rand(-30,30), cy2 + rand(-20,20), 4, pick(['#ffd34d','#80c8ff','#ff7b3a']), 80);
          }
        }
      }
    }

    // ---- 航天母舰模式 ----
    if(p.carrierMode>0 && p.carrierAnim<=0){
      p.carrierMode -= dt;
      // 母舰无敌
      p.invuln = Math.max(p.invuln, 0.1);
      // 母舰体积大，调整边界
      const cMargin = 30;
      p.x=clamp(p.x,4-cMargin+30,W-p.w-cMargin-4+30); 
      // 母舰自动散射火力
      p.cool -= dt*1000;
      if(p.cool<=0){
        p.cool = 80;
        const ccx = p.x + p.w/2, ccy = p.y + 4;
        // 中央双管
        pBullet(ccx-10, ccy, 0, -560, {w:7,h:14,color:'#ffd34d',dmg:1.5});
        pBullet(ccx+3,  ccy, 0, -560, {w:7,h:14,color:'#ffd34d',dmg:1.5});
        // 左右斜射
        pBullet(ccx-15, ccy+5, -120, -480, {w:5,h:10,color:'#80c8ff',dmg:1.0});
        pBullet(ccx+10, ccy+5,  120, -480, {w:5,h:10,color:'#80c8ff',dmg:1.0});
        // 侧翼僚机炮位
        pBullet(ccx-26, ccy+8, -200, -420, {w:5,h:10,color:'#80c8ff',dmg:0.8});
        pBullet(ccx+21, ccy+8,  200, -420, {w:5,h:10,color:'#80c8ff',dmg:0.8});
        sfx.fireCannon();
      }
      // 母舰碰撞敌人（撞击伤害）
      for(const e of this.enemies){
        if(!e.dead){
          const ecx=e.x+e.w/2, ecy=e.y+e.h/2;
          const dx=ecx-(p.x+p.w/2), dy=ecy-(p.y+p.h/2);
          if(Math.abs(dx)<38+e.w/2 && Math.abs(dy)<30+e.h/2){
            damageEnemy(e, 2.0, ecx, ecy);
          }
        }
      }
      // 母舰碰撞敌弹（消弹）
      for(const eb of this.ebullets){
        if(!eb.dead){
          const dx=(eb.x+eb.w/2)-(p.x+p.w/2), dy=(eb.y+eb.h/2)-(p.y+p.h/2);
          if(Math.abs(dx)<38 && Math.abs(dy)<30){
            eb.dead=true;
            burst(eb.x+3, eb.y+4, 4, '#ffd34d', 80);
          }
        }
      }
      // 倒计时结束：触发解体动画
      if(p.carrierMode <= 0){
        p.carrierMode = 0;
        p.carrierAnim = 1.0;       // 解体动画持续 1.0 秒
        p.carrierAnimMax = 1.0;
        p.carrierAnimType = 'disassemble';  // 标记为解体
        p.invuln = Math.max(p.invuln, 1.0);
        floatText(p.x, p.y-20, '母舰解体!', '#80c8ff');
        burst(p.x+p.w/2, p.y+p.h/2, 24, '#80c8ff', 160);
        burst(p.x+p.w/2, p.y+p.h/2, 16, '#ffd34d', 120);
        game.flash = 0.2;
        sfx.explode(); haptic(60);
      }
    } else {
    // ---- 射击 ----
    p.cool-=dt*1000;
    if(p.fireDown && p.cool<=0){ fireWeapon(p); p.cool=WINGS[p.weapon].cool; }
    }

    // ---- 下潜丢翼 ----
    p.diveCool-=dt;
    const diveKey = keys['k']||keys['shift'];
    if(diveKey && !lastDive && p.diveCool<=0){
      p.diveCool=1.8;
      if(p.weapon!=='NONE'){
        // 丢翼：机翼掉落为道具（0.5秒拾取延迟）
        const drop = spawnPower(p.x+p.w/2,p.y+p.h/2,p.weapon);
        drop.pickupDelay = 0.5;
        this.powerups.push(drop);
        p.weapon='NONE'; p.hammers=[];
      }
      p.invuln=Math.max(p.invuln,1.3);
      burst(p.x+p.w/2,p.y+p.h/2,10,'#7fd0ff',80);
      sfx.hit();
    }
    lastDive = diveKey;

    if(p.invuln>0) p.invuln-=dt;

    // ---- 锤头环绕弹（HAMMER / COIN 共用） ----
    if(p.weapon==='HAMMER' || p.weapon==='COIN'){
      if(p.hammers.length<2) spawnHammer(p);
      for(const h of p.hammers){
        h.ang += dt*6.0;
        h.x = p.x+p.w/2 + Math.cos(h.ang)*h.r;
        h.y = p.y+p.h/2 + Math.sin(h.ang)*h.r;
        h.cool-=dt;
        // 碰敌
        for(const e of this.enemies){
          if(!e.dead && h.cool<=0 && h.x>e.x && h.x<e.x+e.w && h.y>e.y && h.y<e.y+e.h){
            damageEnemy(e, 1.2, h.x, h.y); h.cool=0.18;
          }
        }
        if(this.boss && !this.boss.dead && h.cool<=0){
          const b=this.boss;
          if(h.x>b.x && h.x<b.x+b.w && h.y>b.y && h.y<b.y+b.h){
            damageBoss(b,1.2,h.x,h.y); h.cool=0.18;
          }
        }
        // 消除敌方子弹（护身锤可挡弹）
        for(const eb of this.ebullets){
          if(!eb.dead && h.x>eb.x-6 && h.x<eb.x+eb.w+6 && h.y>eb.y-6 && h.y<eb.y+eb.h+6){
            eb.dead=true;
            burst(eb.x+3, eb.y+4, 3, '#ffe14d', 60);
          }
        }
      }
    } else if(p.hammers.length){ p.hammers=[]; }

    // ---- 影子僚机：跟随玩家，自动射击；满4架时环绕旋转+碰撞 ----
    if(p.carrierMode > 0 || p.carrierAnim > 0){
      // 母舰模式或过渡动画：僚机位置由各自逻辑控制，跳过常规更新
      if(p.carrierMode > 0){
        for(const o of p.options){ o.x = p.x + p.w/2 - 6; o.y = p.y + p.h/2; }
      }
    } else {
    const orbitMode = p.options.length >= 4 && p.options.every(o=>!o.detached);
    if(orbitMode) p.orbitAngle = (p.orbitAngle||0) + dt*3.2;
    for(let oi=0; oi<p.options.length; oi++){
      const o = p.options[oi];
      // ---- 脱离状态：缓慢下沉，等玩家接触重新挂载 ----
      if(o.detached){
        o.bob = (o.bob||0) + dt*2;
        o.dy += 12*dt; // 缓慢下沉
        o.x = o.dx + Math.cos(o.bob)*4;
        o.y = o.dy + Math.sin(o.bob*1.3)*3;
        // 下沉出屏幕则丢失
        if(o.y > H+30){ o._lost = true; }
        // 检测玩家接触 → 重新挂载
        if(p.respawn<=0 && p.x+p.w > o.x-2 && p.x < o.x+14 && p.y+p.h > o.y-2 && p.y < o.y+16){
          o.detached = false;
          o.cool = 200;
          burst(o.x+6, o.y+7, 8, '#80c8ff', 100);
          sfx.power(); haptic(15);
          floatText(o.x, o.y-8, '僚机归位!', '#80c8ff');
        }
        continue;
      }
      if(orbitMode){
        // 环绕模式：用共享角度保证4架严格对称分布
        const orbitR = 42;
        const cx = p.x + p.w/2 - 6;
        const cy = p.y + p.h/2;
        const ang = p.orbitAngle + oi*(TAU/4);
        o.x = cx + Math.cos(ang) * orbitR - 6;
        o.y = cy + Math.sin(ang) * orbitR;
        o.angle = ang;
        // 碰撞敌人（每个僚机独立冷却）
        o.hitCool = (o.hitCool||0) - dt;
        if(o.hitCool <= 0){
          for(const e of this.enemies){
            if(!e.dead && o.x+12>e.x && o.x<e.x+e.w && o.y+14>e.y && o.y<e.y+e.h){
              damageEnemy(e, 1.2, o.x+6, o.y+7); o.hitCool=0.18; break;
            }
          }
          if(this.boss && !this.boss.dead){
            const b=this.boss;
            if(o.x+12>b.x && o.x<b.x+b.w && o.y+14>b.y && o.y<b.y+b.h){
              damageBoss(b,1.2,o.x+6,o.y+7); o.hitCool=0.18;
            }
          }
        }
        // 消除敌方子弹（护身效果）
        for(const eb of this.ebullets){
          if(!eb.dead && o.x+12>eb.x-6 && o.x<eb.x+eb.w+6 && o.y+14>eb.y-6 && o.y<eb.y+eb.h+6){
            eb.dead=true;
            burst(eb.x+3, eb.y+4, 3, '#80c8ff', 60);
          }
        }
        // 环绕模式下仍自动射击
        o.cool -= dt*1000;
        if(o.cool <= 0){
          o.cool = 350;
          pBullet(o.x+5, o.y, 0, -480, {w:5,h:10,color:'#80c8ff',dmg:0.8});
          sfx.fireOption();
        }
      } else {
        // 跟随模式：固定阵型位置
        o.angle += dt*2.5;
        o.tx = p.x + p.w/2 - 6 + o.ox + Math.cos(o.angle)*3;
        o.ty = p.y + o.oy + Math.sin(o.angle)*3;
        o.x += (o.tx - o.x) * 0.18;
        o.y += (o.ty - o.y) * 0.18;
        o.cool -= dt*1000;
        if(o.cool <= 0){
          o.cool = 280;
          pBullet(o.x+5, o.y, 0, -480, {w:5,h:10,color:'#80c8ff',dmg:0.8});
          sfx.fireOption();
        }
      }
    }
    } // end else (非母舰模式)

    // 清理下沉出屏幕的脱离僚机
    {
      const beforeLen = p.options.length;
      p.options = p.options.filter(o => !o._lost);
      if(p.options.length < beforeLen){
        floatText(W/2, H/2, '僚机丢失!', '#ff5c5c');
      }
    }

    // ---- 火焰喷射器：细颈 + 末端火团 ----
    if(p.weapon==='FIRE' && p.fireDown){
      p.fireStream = (p.fireStream||0) + dt;
      const cx = p.x + p.w/2;
      const baseY = p.y + 4;        // 喷射起点（机头）
      const streamLen = 130;
      const neckLen = 28;           // 细颈长度
      const blobCy = baseY - streamLen + 20; // 火团中心
      const blobR = 34;             // 火团半径
      // 判断点是否在火焰区域内（细颈或火团）
      function inFire(px, py, pr){
        // 细颈区域：y 在 [baseY-neckLen, baseY]，x 宽度 ~4+pr
        if(py <= baseY && py >= baseY - neckLen){
          if(Math.abs(px - cx) < 4 + pr) return true;
        }
        // 火团区域：距离火团中心 < blobR + pr
        const dx = px - cx, dy = py - blobCy;
        if(dx*dx + dy*dy*1.3 < (blobR + pr) * (blobR + pr)) return true;
        return false;
      }
      // 对范围内敌人造成持续伤害（每个敌人独立冷却）
      for(const e of this.enemies){
        if(e.dead || e.type==='laserGate') continue;
        const ecx = e.x + e.w/2, ecy = e.y + e.h/2;
        if(!inFire(ecx, ecy, e.w/2)) continue;
        e._fireCool = (e._fireCool||0) - dt;
        if(e._fireCool <= 0){
          e._fireCool = 0.12;
          damageEnemy(e, 2.0, ecx, ecy);
        }
      }
      // 对 Boss 伤害
      if(this.boss && !this.boss.dead){
        const b=this.boss;
        const bcx=b.x+b.w/2, bcy=b.y+b.h/2;
        if(inFire(bcx, bcy, b.w/2)){
          b._fireCool = (b._fireCool||0) - dt;
          if(b._fireCool <= 0){
            b._fireCool = 0.12;
            damageBoss(b, 2.0, cx + rand(-10,10), bcy);
          }
        }
      }
      // 黑洞引力：火团吸引周边敌人和敌弹
      const pullR = 90;            // 引力范围
      const pullR2 = pullR * pullR;
      const pullStrength = 220;    // 引力强度
      // 吸引敌人
      for(const e of this.enemies){
        if(e.dead || e.type==='laserGate') continue;
        const ecx = e.x + e.w/2, ecy = e.y + e.h/2;
        const dx = cx - ecx, dy = blobCy - ecy;
        const d2 = dx*dx + dy*dy;
        if(d2 < pullR2 && d2 > 100){
          const d = Math.sqrt(d2);
          const force = pullStrength * (1 - d/pullR) * dt;
          e.x += (dx/d) * force;
          e.y += (dy/d) * force;
        }
      }
      // 吸引敌弹
      for(const eb of this.ebullets){
        if(eb.dead) continue;
        const edx = cx - (eb.x+eb.w/2), edy = blobCy - (eb.y+eb.h/2);
        const ed2 = edx*edx + edy*edy;
        if(ed2 < pullR2 && ed2 > 50){
          const ed = Math.sqrt(ed2);
          const force = pullStrength * 1.5 * (1 - ed/pullR) * dt;
          eb.x += (edx/ed) * force;
          eb.y += (edy/ed) * force;
        }
      }
      // 吸入火团的敌弹直接消除
      for(const eb of this.ebullets){
        if(eb.dead) continue;
        if(inFire(eb.x+eb.w/2, eb.y+eb.h/2, 0)){
          eb.dead = true;
          burst(eb.x+3, eb.y+4, 3, '#ff5c2a', 60);
        }
      }
    } else {
      p.fireStream = 0;
    }

    // ---- 玩家子弹 ----
    for(const b of this.pbullets){
      b.age+=dt;
      if(b.type==='dyna'){
        b.baseX += b.vx*dt; // 向上
        b.phase += dt*10;
        b.x = b.baseX + Math.sin(b.phase)*b.amp - b.w/2;
        b.y += b.vy*dt;
      } else if(b.type==='laser'){
        // 追踪最近敌人
        let target=null, bd=1e9;
        for(const e of this.enemies){
          if(e.dead) continue;
          const d=dist2(b.x,b.y,e.x+e.w/2,e.y+e.h/2);
          if(d<bd){ bd=d; target=e; }
        }
        if(this.boss && !this.boss.dead){ const d=dist2(b.x,b.y,this.boss.x+this.boss.w/2,this.boss.y+this.boss.h/2); if(d<bd){ bd=d; target=this.boss; } }
        if(target){
          const tx=target.x+target.w/2, ty=target.y+target.h/2;
          const curA=Math.atan2(b.vy,b.vx);
          const tgtA=Math.atan2(ty-b.y, tx-b.x);
          let diff=tgtA-curA;
          while(diff>Math.PI) diff-=TAU;
          while(diff<-Math.PI) diff+=TAU;
          const turn=b.turn*dt;
          const na = Math.abs(diff)<=turn ? tgtA : curA + Math.sign(diff)*turn;
          const sp=Math.hypot(b.vx,b.vy);
          b.vx=Math.cos(na)*sp; b.vy=Math.sin(na)*sp;
          b.angle=na; // 记录朝向用于绘制
        }
        b.x+=b.vx*dt; b.y+=b.vy*dt;
      } else if(b.type==='lightning'){
        // 闪电：直线飞行，感应范围内自动触雷
        b.x+=b.vx*dt; b.y+=b.vy*dt;
        // 感应检测：对范围内未击中过的敌人触发闪电
        const sr2 = b.senseRange*b.senseRange;
        for(const e of this.enemies){
          if(e.dead || b.struck.has(e)) continue;
          const d=dist2(b.x+b.w/2,b.y+b.h/2,e.x+e.w/2,e.y+e.h/2);
          if(d<sr2){
            b.struck.add(e);
            const ex=e.x+e.w/2, ey=e.y+e.h/2;
            createArc(b.x+b.w/2,b.y+b.h/2,ex,ey,'#00e5ff');
            createArc(b.x+b.w/2,b.y+b.h/2,ex,ey,'#80f5ff');
            damageEnemy(e,b.dmg,ex,ey);
            burst(ex,ey,6,'#80f5ff',100);
            // 连锁跳跃
            chainLightning(ex,ey,b.dmg*b.chainDmgMul,b.chains,b.chainRange,new Set([e]));
          }
        }
        // 感应Boss
        if(this.boss && !this.boss.dead && !b.struck.has(this.boss)){
          const d=dist2(b.x+b.w/2,b.y+b.h/2,this.boss.x+this.boss.w/2,this.boss.y+this.boss.h/2);
          if(d<sr2){
            b.struck.add(this.boss);
            const ex=this.boss.x+this.boss.w/2, ey=this.boss.y+this.boss.h/2;
            createArc(b.x+b.w/2,b.y+b.h/2,ex,ey,'#00e5ff');
            createArc(b.x+b.w/2,b.y+b.h/2,ex,ey,'#80f5ff');
            damageBoss(this.boss,b.dmg,ex,ey);
            burst(ex,ey,8,'#80f5ff',120);
            chainLightning(ex,ey,b.dmg*b.chainDmgMul,b.chains,b.chainRange,new Set([this.boss]));
          }
        }
      } else if(b.type==='coin'){
        // 铜钱：由小逐步变大，保持中心不变
        const oldS=b.w;
        const ns=Math.min(b.w + b.grow*dt, b.maxSize);
        b.w=ns; b.h=ns;
        b.x += (oldS-ns)/2; b.y += (oldS-ns)/2;
        b.x+=b.vx*dt; b.y+=b.vy*dt;
      } else {
        b.x+=b.vx*dt; b.y+=b.vy*dt;
      }
      if(b.life!==undefined){ b.life-=dt; if(b.life<=0) b.dead=true; }
      if(b.y< -30 || b.y>H+30 || b.x<-30||b.x>W+30) b.dead=true;
      // 碰敌
      for(const e of this.enemies){
        if(e.dead) continue;
        // 激光屏障特殊处理
        if(e.type==='laserGate'){
          if(!e.active) continue; // 关闭时不挡子弹
          // 检查子弹是否在Y范围内
          if(b.y+b.h < e.y || b.y > e.y+e.h) continue;
          // 检查子弹是否在缺口内
          const bCx = b.x + b.w/2;
          if(bCx > e.gapX && bCx < e.gapX+e.gapW) continue;
          // 不在缺口内：拦截子弹
          burst(b.x+b.w/2, b.y+b.h/2, 4, '#ff6a6a', 80);
          b.dead = true;
          break;
        }
        if(overlap(b,e)){
          if(b.type==='lightning'){
            // 闪电通过感应触发，物理碰撞时也触发一次
            if(!b.struck.has(e)){
              b.struck.add(e);
              const ex=e.x+e.w/2, ey=e.y+e.h/2;
              createArc(b.x+b.w/2,b.y+b.h/2,ex,ey,'#00e5ff');
              damageEnemy(e,b.dmg,ex,ey);
              burst(ex,ey,6,'#80f5ff',100);
              chainLightning(ex,ey,b.dmg*b.chainDmgMul,b.chains,b.chainRange,new Set([e]));
            }
          } else {
            damageEnemy(e,b.dmg,b.x,b.y);
            if(b.pierce>0){ b.pierce--; } else b.dead=true;
          }
        }
      }
      // 碰Boss
      if(this.boss && !this.boss.dead && overlap(b,this.boss)){
        if(b.type==='lightning'){
          if(!b.struck.has(this.boss)){
            b.struck.add(this.boss);
            const ex=this.boss.x+this.boss.w/2, ey=this.boss.y+this.boss.h/2;
            createArc(b.x+b.w/2,b.y+b.h/2,ex,ey,'#00e5ff');
            damageBoss(this.boss,b.dmg,ex,ey);
            burst(ex,ey,8,'#80f5ff',120);
            chainLightning(ex,ey,b.dmg*b.chainDmgMul,b.chains,b.chainRange,new Set([this.boss]));
          }
        } else {
          damageBoss(this.boss,b.dmg,b.x,b.y);
          if(b.pierce>0){ b.pierce--; } else b.dead=true;
        }
      }
    }
    this.pbullets = this.pbullets.filter(b=>!b.dead);

    // ---- 敌人 ----
    this.spawnTimer-=dt;
    this.stageTimer+=dt;
    // 小Boss存活时，延迟关卡结束（boss出场）
    const hasMiniBoss = this.enemies.some(e=>e.type==='miniBoss' && !e.dead);
    const stageOver = this.stageTimer>=this.stageLen && !this.boss && !hasMiniBoss;
    if(stageOver && !this.bossWarn){ this.bossWarn=2.2; sfx.boss(); }
    if(this.bossWarn>0){
      this.bossWarn-=dt;
      if(this.bossWarn<=0 && !this.boss){ this.boss=makeBoss(this.stage); }
    }
    if(!this.boss && this.bossWarn<=0){
      if(this.spawnTimer<=0){
        this.spawnTimer = clamp(1.4 - this.stage*0.07, 0.45, 1.4);
        this.spawnWave();
      }
      // 运载火箭（携带机翼）
      this.carrierTimer-=dt;
      if(this.carrierTimer<=0){
        this.enemies.push(spawnCarrier());
        this.carrierTimer = rand(16,24);
      }
      // ---- Mini-Boss 随机出现 ----
      if(!this.miniBossSpawned && this.miniBossWarn<=0 && this.stageTimer >= this.miniBossTimer){
        this.miniBossWarn = 1.5; // 警告1.5秒
        sfx.boss();
      }
      // ---- 地形专属障碍物 ----
      this.obstacleTimer-=dt;
      if(this.obstacleTimer<=0){
        const tt = this.terrain.type;
        if(tt === 'asteroidRain'){
          // 陨石雨：大量陨石
          this.enemies.push(spawnAsteroid());
          this.enemies.push(spawnAsteroid());
          if(this.stage > 1 && Math.random() < 0.5) this.enemies.push(spawnAsteroid());
          this.obstacleTimer = rand(2.5, 4.5);
        } else if(tt === 'laserArray'){
          // 激光阵：密集激光屏障
          this.enemies.push(spawnLaserGate());
          this.obstacleTimer = rand(3.5, 5.5);
        } else if(tt === 'minefield'){
          // 雷区：大量水雷
          this.enemies.push(spawnMine());
          this.enemies.push(spawnMine());
          if(Math.random() < 0.4) this.enemies.push(spawnMine());
          this.obstacleTimer = rand(3.5, 6);
        } else if(tt === 'spaceTunnel'){
          // 太空隧道：偶发小障碍
          if(Math.random() < 0.4) this.enemies.push(spawnMine());
          this.obstacleTimer = rand(6, 10);
        } else {
          // 无地形：不生成地形障碍
          this.obstacleTimer = rand(4, 7);
        }
      }
    }
    // ---- 隧道墙壁更新 ----
    if(this.terrain.type === 'spaceTunnel' && !this.boss && this.bossWarn<=0){
      const tw = this.terrain.tunnelWalls;
      const spd = this.terrain.tunnelSpeed;
      for(const w of tw){ w.y += spd*dt; }
      // 移除离开屏幕的墙壁段
      while(tw.length > 0 && tw[0].y > H){
        tw.shift();
      }
      // 补充新墙壁段，确保至少有5段在屏幕上方
      while(tw.length < 5 || (tw.length > 0 && tw[tw.length-1].y > -200)){
        const seg = genTunnelSegment(this.terrain.tunnelPrevGap);
        seg.y = (tw.length > 0 ? tw[tw.length-1].y : 0) - 100;
        tw.push(seg);
        this.terrain.tunnelPrevGap = seg.gapX;
        if(tw.length > 12) break; // 安全上限
      }
      // ---- 隧道墙壁碰撞：撞墙即死 ----
      if(p.invuln<=0 && p.respawn<=0){
        for(const w of tw){
          // 玩家在墙壁Y范围内？
          if(p.y+p.h > w.y && p.y < w.y+w.h){
            // 左墙：x从0到gapX
            if(p.x < w.gapX){ this.tunnelCrash(p); break; }
            // 右墙：x从gapX+gapW到W
            if(p.x+p.w > w.gapX+w.gapW){ this.tunnelCrash(p); break; }
          }
        }
      }
    }
    // miniBoss 警告倒计时 → 生成
    if(this.miniBossWarn>0){
      this.miniBossWarn-=dt;
      if(this.miniBossWarn<=0 && !this.miniBossSpawned && !this.boss && this.bossWarn<=0){
        this.enemies.push(makeMiniBoss(this.stage));
        this.miniBossSpawned=true;
      }
    }

    for(const e of this.enemies){
      e.t+=dt;
      switch(e.type){
        case 'grunt': e.y+=e.vy*dt; break;
        case 'fast':  e.y+=e.vy*dt; e.x+=Math.sin(e.t*6)*40*dt; break;
        case 'missile':
          e.y+=e.vy*dt;
          e.x += clamp(p.x - e.x, -90,90)*dt; // 追踪
          break;
        case 'barrier': e.y+=e.vy*dt; break;
        case 'turret':
          e.y+=e.vy*dt;
          if(e.y>60 && e.vy>0) e.vy=0; // 停下
          e.shoot-=dt;
          if(e.shoot<=0){ e.shoot=1.4; enemyShot(e.x+e.w/2,e.y+e.h, 0, 220); sfx.enemyShot(); }
          break;
        case 'carrier':
          e.y+=e.vy*dt; e.x+=e.drift*dt;
          if(e.x<20||e.x>W-e.w-20) e.drift*=-1;
          break;
        case 'miniBoss':
          if(e.phase==='enter'){
            e.y += e.vy*dt;
            if(e.y>=50){ e.y=50; e.phase='fight'; e.moveTimer=0; e.targetX=e.x; e.targetY=e.y; }
          } else {
            e.moveTimer-=dt;
            switch(e.kind){
              case 'GUARD':
                if(e.moveTimer<=0){ e.targetX=rand(20,W-e.w-20); e.targetY=rand(30,H*0.35); e.moveTimer=rand(1.5,2.5); }
                e.x+=clamp(e.targetX-e.x,-65*dt,65*dt);
                e.y+=clamp(e.targetY-e.y,-65*dt,65*dt);
                break;
              case 'HUNTER':
                e.spin+=dt*3;
                if(e.moveTimer<=0){ e.targetX=clamp(p.x-e.w/2+rand(-50,50),10,W-e.w-10); e.targetY=rand(30,H*0.45); e.moveTimer=rand(0.8,1.6); }
                e.x+=clamp(e.targetX-e.x,-100*dt,100*dt);
                e.y+=clamp(e.targetY-e.y,-100*dt,100*dt);
                break;
              case 'WARDEN':
                if(e.moveTimer<=0){ e.targetX=rand(20,W-e.w-20); e.targetY=rand(30,H*0.25); e.moveTimer=rand(2.5,4); }
                e.x+=clamp(e.targetX-e.x,-40*dt,40*dt);
                e.y+=clamp(e.targetY-e.y,-40*dt,40*dt);
                e.summonTimer-=dt;
                if(e.summonTimer<=0){
                  e.summonTimer=rand(4,6);
                  this.enemies.push(spawnEnemy('grunt',e.x+10));
                  this.enemies.push(spawnEnemy('fast',e.x+e.w-30));
                }
                break;
            }
            e.x=clamp(e.x,4,W-e.w-4);
            e.y=clamp(e.y,4,H*0.5);
            e.shoot-=dt;
            if(e.shoot<=0){
              miniBossAttack(e,p);
              e.shoot=clamp(e.shootBase - e.stage*0.03, 0.6, e.shootBase);
            }
          }
          break;
        case 'asteroid':
          e.y += e.vy*dt;
          e.x += e.vx*dt;
          e.rot += e.rotSpd*dt;
          if(e.x<10 || e.x>W-e.w-10) e.vx*=-1;
          break;
        case 'laserGate':
          e.y += e.vy*dt;
          // 周期开关
          const phase = e.t % e.cycle;
          e.active = phase < e.onTime;
          break;
        case 'mine':
          e.y += e.vy*dt;
          if(!e.armed){
            e.armTimer-=dt;
            if(e.armTimer<=0){ e.armed=true; }
          } else {
            // 接近玩家时自爆
            const dx=p.x-(e.x+e.w/2), dy=p.y-(e.y+e.h/2);
            if(dx*dx+dy*dy < e.explodeR*e.explodeR){
              e.exploded=true;
              // 范围爆炸：伤害玩家 + 视觉特效
              burst(e.x+e.w/2, e.y+e.h/2, 24, '#ff6644', 200);
              burst(e.x+e.w/2, e.y+e.h/2, 16, '#ffdd44', 160);
              sfx.explode(); game.flash=0.12; haptic(40);
              if(p.invuln<=0) hurtPlayer();
              e.dead=true;
              game.p.score += e.score;
              floatText(e.x, e.y-6, '+'+e.score, '#fff');
            }
          }
          break;
      }
      if(e.type!=='miniBoss' && e.type!=='laserGate' && e.y>H+50) e.dead=true;
      // 敌人射击（grunt 偶尔）
      if((e.type==='grunt'||e.type==='fast') && e.y>0){
        e.shoot=(e.shoot||rand(2,4))-dt;
        if(e.shoot<=0 && Math.random()<0.5){ e.shoot=rand(2.5,4.5);
          enemyShot(e.x+e.w/2,e.y+e.h, 0, 180); sfx.enemyShot();
        }
      }
      // 碰玩家
      if(!e.dead && p.invuln<=0){
        if(e.type==='laserGate'){
          // 激光屏障：仅激活时伤害，缺口处安全
          if(e.active){
            const inGap = p.x+p.w > e.gapX && p.x < e.gapX+e.gapW;
            if(!inGap && p.y < e.y+e.h+4 && p.y+p.h > e.y-4){
              hurtPlayer();
            }
          }
        } else if(e.type==='asteroid'){
          if(overlap(e,p)){
            damageEnemy(e, 3, p.x, p.y);
            hurtPlayer();
          }
        } else if(e.type==='mine'){
          // 水雷碰撞由接近感应处理，此处不重复
        } else if(e.type==='miniBoss'){
          if(overlap(e,p)) hurtPlayer();
        } else {
          if(overlap(e,p)){
            damageEnemy(e, 99, e.x, e.y);
            hurtPlayer();
          }
        }
      }
    }
    this.enemies=this.enemies.filter(e=>!e.dead);

    // ---- Boss ----
    if(this.boss){
      this.updateBoss(dt);
    }

    // ---- 敌弹 ----
    for(const b of this.ebullets){
      b.x+=b.vx*dt; b.y+=b.vy*dt;
      if(b.y>H+20||b.y<-20||b.x<-20||b.x>W+20) b.dead=true;
      if(p.invuln<=0 && overlap(b,p)){ b.dead=true; hurtPlayer(); }
    }
    this.ebullets=this.ebullets.filter(b=>!b.dead);

    // ---- 道具 ----
    for(const u of this.powerups){
      u.y+=u.vy*dt; u.t+=dt;
      if(u.pickupDelay>0) u.pickupDelay-=dt;
      if(u.y>H+20) u.dead=true;
      // 损坏的残骸不可拾取，只做下落+冒烟
      if(!u.broken && u.pickupDelay<=0 && overlap(u,p)){
        u.dead=true; collectPower(u.kind);
      }
      // 损坏残骸冒烟
      if(u.broken && Math.random()<0.3){
        game.particles.push({
          x:u.x+u.w/2+rand(-4,4), y:u.y+rand(0,u.h),
          vx:rand(-15,15), vy:rand(-30,-10),
          life:rand(0.3,0.6), color:Math.random()<0.5?'#555':'#888', size:rand(2,4)
        });
      }
    }
    this.powerups=this.powerups.filter(u=>!u.dead);

    // ---- 粒子/文字 ----
    for(const pt of this.particles){ pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.life-=dt; pt.vx*=0.92; pt.vy*=0.92; }
    this.particles=this.particles.filter(p=>p.life>0);
    for(const f of this.floats){ f.y-=18*dt; f.life-=dt; }
    this.floats=this.floats.filter(f=>f.life>0);
    for(const a of this.arcs){ a.life-=dt; }
    this.arcs=this.arcs.filter(a=>a.life>0);
  },

  spawnWave(){
    const r=Math.random(), st=this.stage;
    if(r<0.45){ // 一排 grunt
      const n=randi(3,5); const gap=(W-60)/n;
      for(let i=0;i<n;i++) this.enemies.push(spawnEnemy('grunt', 30+i*gap+rand(-10,10)));
    } else if(r<0.65){ // fast 编队
      for(let i=0;i<randi(2,4);i++) this.enemies.push(spawnEnemy('fast', rand(40,W-60)));
    } else if(r<0.8){ // missile
      this.enemies.push(spawnEnemy('missile', rand(40,W-60)));
      if(st>2) this.enemies.push(spawnEnemy('missile', rand(40,W-60)));
    } else if(r<0.92){ // barrier (隐藏道具，概率降低)
      const e=spawnEnemy('barrier', rand(40,W-90));
      // 60%概率掉落道具（降低），40%不掉
      if(Math.random() < 0.6){
        // 8%概率掉稀有武器(F/N/Q)，仅从barrier掉落
        if(Math.random() < 0.08){
          e.drop = pick(WING_RARE);
        } else {
          e.drop = pick([...WING_COMMON, 'heart', 'shield', 'option']);
        }
      }
      this.enemies.push(e);
    } else { // turret
      this.enemies.push(spawnEnemy('turret', rand(50,W-80)));
    }
  },

  updateBoss(dt){
    const b=this.boss, p=this.p;
    b.t+=dt;
    if(b.phase==='enter'){
      b.y += 45*dt; if(b.y>=36){ b.y=36; b.phase='fight'; b.targetX=W/2-b.w/2; b.targetY=50; }
      return;
    }
    const bx=b.x, by=b.y;
    b.moveTimer -= dt;

    function setTarget(tx,ty){ b.targetX=tx; b.targetY=ty; }
    function pickTarget(pad,ymin,ymax){
      setTarget(rand(pad,W-b.w-pad), rand(ymin,ymax));
    }

    switch(b.kind){
      case 'CORE':{
        // 巡逻+突进：在顶部一半到中部游走，偶尔向玩家X逼近
        if(b.moveTimer<=0){
          b.moveTimer = rand(2.2,3.5);
          if(Math.random()<0.35){
            // 向玩家X逼近
            setTarget(clamp(p.x-b.w/2, 8, W-b.w-8), rand(60, H*0.55));
          } else {
            pickTarget(10, 30, H*0.55);
          }
        }
        const sp = clamp(58 + b.stage*3 + b.colorIdx*10, 55, 120);
        b.x += clamp(b.targetX-b.x, -sp*dt, sp*dt);
        b.y += clamp(b.targetY-b.y, -sp*dt, sp*dt);
        break;}
      case 'TWIN':{
        // 灵活追踪：在更大范围内快速移动，主动追踪玩家X
        if(b.moveTimer<=0){
          b.moveTimer = rand(1.6,2.8);
          const aimX = p.x-b.w/2;
          const aimY = rand(30, H*0.6);
          if(Math.random()<0.45){
            // 强追踪：靠近玩家
            setTarget(clamp(aimX, 6, W-b.w-6), rand(40, H*0.5));
          } else {
            pickTarget(6, 20, H*0.62);
          }
        }
        const sp = clamp(72 + b.stage*2 + b.colorIdx*8, 68, 140);
        b.x += clamp(b.targetX-b.x, -sp*dt, sp*dt);
        b.y += clamp(b.targetY-b.y, -sp*dt, sp*dt);
        break;}
      case 'FORTRESS':{
        // 缓慢压迫：向中下部缓慢压进，范围小但会召唤
        if(b.moveTimer<=0){
          b.moveTimer = rand(3.5,5.0);
          pickTarget(8, 40, H*0.52);
        }
        const sp = clamp(32 + b.stage*1.5 + b.colorIdx*4, 28, 65);
        b.x += clamp(b.targetX-b.x, -sp*dt, sp*dt);
        b.y += clamp(b.targetY-b.y, -sp*dt, sp*dt);
        b.summonTimer-=dt;
        if(b.summonTimer<=0){ b.summonTimer=6.5;
          this.enemies.push(spawnEnemy('grunt', b.x+24));
          this.enemies.push(spawnEnemy('fast', b.x+b.w-44)); }
        break;}
      case 'DESTROYER':{
        // 全屏高速冲锋：频繁切换目标，高速冲刺+旋转
        b.spin += dt*2.6;
        if(b.moveTimer<=0){
          b.moveTimer = rand(1.0,2.2);
          if(Math.random()<0.5){
            // 向玩家方向冲锋
            const dx = p.x-(b.x+b.w/2);
            const dy = p.y-(b.y+b.h/2);
            const dist = Math.sqrt(dx*dx+dy*dy)||1;
            const reach = rand(120,260);
            setTarget(clamp(b.x + dx/dist*reach, 4, W-b.w-4), clamp(b.y + dy/dist*reach, 10, H*0.72));
          } else {
            pickTarget(4, 10, H*0.72);
          }
        }
        const sp = clamp(95 + b.stage*4 + b.colorIdx*14, 88, 170);
        b.x += clamp(b.targetX-b.x, -sp*dt, sp*dt);
        b.y += clamp(b.targetY-b.y, -sp*dt, sp*dt);
        // 额外周期性短距离冲锋
        b.dashTimer-=dt;
        if(b.dashState===0 && b.dashTimer<=0){
          b.dashState=1; b.dashDur=0.4;
          const dx=p.x-(b.x+b.w/2), dy=p.y-(b.y+b.h/2), dist=Math.sqrt(dx*dx+dy*dy)||1;
          b.vx = (dx/dist)*220; b.vy = (dy/dist)*160;
        }
        if(b.dashState===1){
          b.x += b.vx*dt; b.y += b.vy*dt;
          b.dashDur-=dt;
          if(b.dashDur<=0){ b.dashState=0; b.dashTimer=rand(2.2,3.8); b.vx=0; b.vy=0; }
        }
        break;}
    }

    // 出界修正
    b.x = clamp(b.x, 4, W-b.w-4);
    b.y = clamp(b.y, 4, H-b.h-4);

    b.shoot-=dt;
    if(b.shoot<=0){
      b.shoot = clamp(b.shootBase - b.stage*0.03 - b.colorIdx*0.12, 0.40, b.shootBase);
      bossAttack(b, p);
    }
    if(!b.dead && overlap(b,p) && p.invuln<=0) hurtPlayer();
  },
};

function enemyShot(x,y,vx,vy){ game.ebullets.push({x:x-3,y,vx,vy,w:6,h:8,color:'#ff7b9b',dead:false}); }
function bossAttack(b,p){
  const cx=b.x+b.w/2, cy=b.y+b.h/2, st=b.stage;
  const spdBoost = 1 + st*0.06 + b.colorIdx*0.08;
  switch(b.kind){
    case 'CORE': {
      // 圆形扩散弹幕 + 必发瞄准弹
      const n = 10 + Math.min(st,8)*2;
      for(let i=0;i<n;i++){ const a=Math.PI/2+(i/n)*TAU+b.t*0.5; enemyShot(cx,cy,Math.cos(a)*150*spdBoost,Math.sin(a)*150*spdBoost); }
      const a=Math.atan2(p.y-cy,p.x-cx); enemyShot(cx,cy,Math.cos(a)*230*spdBoost,Math.sin(a)*230*spdBoost);
      if(st>3){ const aa=b.t*2; enemyShot(cx,cy,Math.cos(aa)*200*spdBoost,Math.sin(aa)*200*spdBoost); }
      break; }
    case 'TWIN': {
      // 双源扇形(各4发) + 交叉下压 + 追踪弹
      const lx=b.x+b.w*0.25, rx=b.x+b.w*0.75;
      for(let i=-3;i<=3;i++){ const a=-Math.PI/2+i*0.22;
        enemyShot(lx,cy,Math.cos(a)*180*spdBoost,Math.sin(a)*180*spdBoost);
        enemyShot(rx,cy,Math.cos(a)*180*spdBoost,Math.sin(a)*180*spdBoost); }
      const aa=b.t*2.6; enemyShot(cx,cy,Math.cos(aa)*220*spdBoost,Math.abs(Math.sin(aa))*220*spdBoost+50);
      enemyShot(cx,cy,Math.cos(aa+Math.PI)*220*spdBoost,Math.abs(Math.sin(aa+Math.PI))*220*spdBoost+50);
      if(Math.random()<0.7){ const a=Math.atan2(p.y-cy,p.x-cx); enemyShot(cx,cy,Math.cos(a)*240*spdBoost,Math.sin(a)*240*spdBoost); }
      break; }
    case 'FORTRESS': {
      // 九路散射 + 双追踪导弹 + 环形慢弹
      for(let i=0;i<9;i++){ const a=-Math.PI/2 + (i-4)*0.16; enemyShot(cx,cy+12,Math.cos(a)*190*spdBoost,Math.sin(a)*190*spdBoost); }
      for(let i=0;i<2;i++){ const a=Math.atan2(p.y-cy,p.x-(cx-34+i*68)); enemyShot(cx-34+i*68,cy,Math.cos(a)*170*spdBoost,Math.sin(a)*170*spdBoost); }
      for(let i=0;i<6;i++){ const a=b.t*1.2+i*(TAU/6); enemyShot(cx,cy,Math.cos(a)*120*spdBoost,Math.sin(a)*120*spdBoost); }
      break; }
    case 'DESTROYER': {
      // 六臂螺旋 + 七路散射 + 双高速瞄准 + 环形快弹
      const arms=6;
      for(let k=0;k<arms;k++){ const a=b.t*3.5 + k*(TAU/arms); enemyShot(cx,cy,Math.cos(a)*180*spdBoost,Math.sin(a)*180*spdBoost); }
      for(let i=0;i<7;i++){ const a=-Math.PI/2+(i-3)*0.22; enemyShot(cx,cy+10,Math.cos(a)*215*spdBoost,Math.sin(a)*215*spdBoost); }
      if(Math.random()<0.7){ const a=Math.atan2(p.y-cy,p.x-cx); enemyShot(cx,cy,Math.cos(a)*300*spdBoost,Math.sin(a)*300*spdBoost); }
      for(let i=0;i<4;i++){ const a=b.t*2+i*(TAU/4); enemyShot(cx,cy,Math.cos(a)*155*spdBoost,Math.sin(a)*155*spdBoost); }
      break; }
  }
  sfx.bossShot();
}

function createArc(x1,y1,x2,y2,color){
  // 预计算锯齿状电弧路径
  const segs=6, pts=[{x:x1,y:y1}];
  for(let i=1;i<segs;i++){
    const t=i/segs;
    pts.push({ x:x1+(x2-x1)*t+rand(-8,8), y:y1+(y2-y1)*t+rand(-8,8) });
  }
  pts.push({x:x2,y:y2});
  game.arcs.push({pts,life:0.2,color});
}

function chainLightning(x,y,dmg,chains,range,hitSet){
  // 从(x,y)寻找范围内最近未命中目标，连锁跳跃
  if(chains<=0) return;
  let target=null, bd=range*range;
  for(const e of game.enemies){
    if(e.dead || hitSet.has(e) || e.type==='laserGate') continue;
    const d=dist2(x,y,e.x+e.w/2,e.y+e.h/2);
    if(d<bd){ bd=d; target=e; }
  }
  if(game.boss && !game.boss.dead && !hitSet.has(game.boss)){
    const d=dist2(x,y,game.boss.x+game.boss.w/2,game.boss.y+game.boss.h/2);
    if(d<bd){ bd=d; target=game.boss; }
  }
  if(!target) return;
  const tx=target.x+target.w/2, ty=target.y+target.h/2;
  createArc(x,y,tx,ty,'#00e5ff');
  if(target.type==='boss') damageBoss(target,dmg,tx,ty);
  else damageEnemy(target,dmg,tx,ty);
  hitSet.add(target);
  burst(tx,ty,4,'#80f5ff',80);
  chainLightning(tx,ty,dmg*0.75,chains-1,range,hitSet);
}

function damageEnemy(e,dmg,hx,hy){
  if(e.dead) return;
  if(e.type==='carrier'){
    e.hp-=dmg;
    burst(hx,hy,3,e.color,70);
    if(e.hp<=0){
      e.dead=true; game.p.score+=e.score;
      burst(e.x+e.w/2,e.y+e.h/2,16,e.color,150);
      sfx.explode();
      // 掉落机翼
      game.powerups.push(spawnPower(e.x+e.w/2,e.y+e.h/2,e.wing));
      floatText(e.x,e.y,'+'+e.score,'#fff');
    }
    return;
  }
  if(e.type==='miniBoss'){
    e.hp-=dmg;
    burst(hx,hy,3,e.color,70);
    if(e.hp<=0){
      e.dead=true; game.p.score+=e.score;
      // 大爆炸特效
      for(let i=0;i<30;i++) burst(e.x+rand(0,e.w),e.y+rand(0,e.h),6,pick(['#ffd34d','#ff7b3a','#fff',e.color]),180);
      sfx.explode(); game.flash=0.15; haptic(60);
      floatText(e.x+e.w/2,e.y,e.name+' 击破!','#ffd34d');
      // 45%概率掉稀有武器，否则掉普通道具
      if(Math.random() < 0.45){
        const rareDrop = pick(WING_RARE);
        game.powerups.push(spawnPower(e.x+e.w/2,e.y+e.h/2,rareDrop));
        floatText(e.x+e.w/2,e.y+e.h/2+12,'稀有武器!',WINGS[rareDrop].color);
      } else {
        const commonDrop = pick([...WING_COMMON,'heart','shield','option']);
        game.powerups.push(spawnPower(e.x+e.w/2,e.y+e.h/2,commonDrop));
      }
    } else {
      sfx.hit();
    }
    return;
  }
  if(e.type==='asteroid'){
    e.hp-=dmg;
    burst(hx,hy,3,'#a89a8a',70);
    if(e.hp<=0){
      e.dead=true; game.p.score+=e.score;
      // 陨石碎裂：分裂成碎片粒子
      for(let i=0;i<20;i++) burst(e.x+rand(0,e.w),e.y+rand(0,e.h),4,pick(['#8a7a6a','#a89a8a','#6a5a4a','#ccc']),150);
      sfx.explode(); haptic(15);
      floatText(e.x,e.y-6,'+'+e.score,'#fff');
    } else {
      sfx.hit();
    }
    return;
  }
  if(e.type==='mine'){
    e.hp-=dmg;
    if(e.hp<=0){
      e.dead=true; game.p.score+=e.score;
      burst(e.x+e.w/2,e.y+e.h/2,18,pick(['#ff6644','#ffdd44','#fff']),170);
      sfx.explode(); haptic(20);
      floatText(e.x,e.y-6,'+'+e.score,'#fff');
    } else {
      burst(hx,hy,2,'#ffdd44',50);
      sfx.hit();
    }
    return;
  }
  if(e.type==='laserGate'){
    // 激光屏障不可摧毁
    return;
  }
  e.hp-=dmg;
  burst(hx,hy,3,e.color,70);
  if(e.hp<=0){
    e.dead=true; game.p.score+=e.score;
    burst(e.x+e.w/2,e.y+e.h/2,12,e.color,140);
    sfx.explode(); haptic(20);
    floatText(e.x,e.y-6,'+'+e.score,'#fff');
    if(e.drop){
      const kind = e.drop==='heart'?'heart':e.drop;
      game.powerups.push(spawnPower(e.x+e.w/2,e.y+e.h/2,kind));
    }
  } else {
    sfx.hit();
  }
}

function damageBoss(b,dmg,hx,hy){
  if(b.dead||b.phase!=='fight') return;
  b.hp-=dmg;
  burst(hx,hy,2,'#fff',60);
  const phaseHp = b.maxHp / (b.phases+1);
  const curPhase = Math.floor((b.maxHp-b.hp) / phaseHp);
  if(curPhase > b.colorIdx){
    b.colorIdx = curPhase;
    burst(b.x+b.w/2,b.y+b.h/2,26,b.color,180);
    sfx.explode(); game.flash=0.12; haptic(40);
    floatText(b.x+b.w/2,b.y,'阶段突破!','#fff');
  }
  if(b.hp<=0){
    b.dead=true; game.p.score+=b.score;
    for(let i=0;i<50;i++) burst(b.x+rand(0,b.w),b.y+rand(0,b.h),8,pick(['#ffd34d','#ff7b3a','#fff',b.color]),200);
    sfx.explode(); game.flash=0.3; haptic(80);
    floatText(W/2,H/2, b.name+' 击破!','#ffd34d');
    game.boss=null;
    game.state='stageClear'; game.clearTimer=2.4;
  }
}

function hurtPlayer(){
  const p=game.p;
  if(p.invuln>0) return;
  if(p.shield>0){ p.shield--; p.invuln=0.8; burst(p.x+p.w/2,p.y+p.h/2,10,'#5cff8f',90); sfx.hit(); haptic(30); return; }
  if(p.weapon!=='NONE'){
    // 机翼损坏脱落：掉落为不可拾取的残骸
    const drop = spawnPower(p.x+p.w/2,p.y+p.h/2,p.weapon);
    drop.broken = true;
    game.powerups.push(drop);
    p.weapon='NONE'; p.hammers=[];
    p.invuln=1.2;
    burst(p.x+p.w/2,p.y+p.h/2,14,'#ff9b3a',120);
    sfx.hit(); haptic(50);
    floatText(p.x,p.y-10,'机翼损坏!','#ff5c5c');
  } else {
    // 裸机坠毁：大爆炸 + 重生动画
    p.lives--;
    // 坠毁爆炸
    burst(p.x+p.w/2,p.y+p.h/2,30,'#ff5c5c',200);
    burst(p.x+p.w/2,p.y+p.h/2,20,'#ff9b3a',160);
    burst(p.x+p.w/2,p.y+p.h/2,12,'#ffe14d',120);
    sfx.explode(); game.flash=0.3; haptic(120);
    floatText(p.x,p.y-10,'坠毁!','#ff5c5c');
    // 影子僚机脱离：浮在坠毁位置附近，等新飞机接触后重新挂载
    for(const o of p.options){
      o.detached = true;
      o.dx = o.x; o.dy = o.y; // 漂浮锚点
      o.bob = rand(0,TAU);    // 漂浮相位
    }
    if(p.lives<=0){
      if(game.demoMode){ game.endDemo(); return; }
      game.state='gameover'; sfx.gameover(); haptic(200);
    } else {
      // 启动重生：0.8秒坠毁延迟 + 0.6秒飞入动画
      p.respawn = 1.4;
      p.respawnMax = 1.4;
      p.weapon='NONE'; p.hammers=[];
      p.invuln = 1.4; // 重生全程无敌
    }
  }
}

function collectPower(kind){
  const p=game.p;
  if(kind==='heart'){ p.lives++; sfx.power(); haptic(15); floatText(p.x,p.y-10,'+1 命','#ff5c7a'); return; }
  if(kind==='shield'){ p.shield=3; sfx.power(); haptic(15); floatText(p.x,p.y-10,'护盾 x3','#5cff8f'); return; }
  if(kind==='option'){
    // 优先重新挂载脱离的僚机
    const detached = p.options.find(o=>o.detached);
    if(detached){
      detached.detached = false;
      detached.cool = 200;
      burst(detached.x+6, detached.y+7, 8, '#80c8ff', 100);
      sfx.power(); haptic(20);
      floatText(p.x,p.y-10,'僚机归位 '+p.options.length+'/4','#80c8ff');
      return;
    }
    if(addOption(p)){
      sfx.power(); haptic(20);
      floatText(p.x,p.y-10,'影子僚机 '+p.options.length+'/4','#80c8ff');
      burst(p.x+p.w/2,p.y+p.h/2,10,'#80c8ff',100);
    } else if(p.carrierAnimType === 'disassemble'){
      // 解体动画中吃到僚机：中断解体，重新合体
      p.carrierAnim = 1.2;
      p.carrierAnimMax = 1.2;
      p.carrierAnimType = 'assemble';
      p.invuln = Math.max(p.invuln, 1.2);
      sfx.power(); haptic(40);
      floatText(p.x,p.y-20,'重新合体!','#ffd34d');
      game.flash = 0.2;
    } else if(p.carrierMode<=0 && p.carrierAnim<=0 && p.options.length>=4 && p.options.every(o=>!o.detached)){
      // 已满4架且全部挂载：启动合体动画
      p.carrierAnim = 1.2;   // 合体动画持续 1.2 秒
      p.carrierAnimMax = 1.2;
      p.carrierAnimType = 'assemble';  // 标记为合体
      p.invuln = Math.max(p.invuln, 1.2);
      sfx.power(); haptic(40);
      floatText(p.x,p.y-20,'航天母舰合体!','#ffd34d');
      game.flash = 0.2;
    } else {
      // 母舰模式中再吃，延长时长
      p.carrierMode += 4.0;
      sfx.power(); haptic(20);
      floatText(p.x,p.y-10,'母舰延长 +4s','#ffd34d');
    }
    return;
  }
  // 机翼
  p.weapon=kind;
  if(kind==='HAMMER' || kind==='COIN') spawnHammer(p); else p.hammers=[];
  p.fireCount=0;
  sfx.power(); haptic(15);
  floatText(p.x,p.y-10,'装备: '+WINGS[kind].name, WINGS[kind].color);
}
