<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>银河系</title>
<style>
*{margin:0;padding:0}
body{overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none;}
canvas{display:block;width:100%;height:100%;}
/* ===== 老杨游戏站 · 统一站点栏 ===== */
.site-bar{position:fixed;top:0;left:0;right:0;height:44px;z-index:9999;
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;
  box-sizing:border-box;
  background:linear-gradient(135deg,rgba(10,46,56,.94),rgba(18,64,80,.94));
  border-bottom:1px solid rgba(126,224,255,.28);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
.site-bar .site-name{color:#9fd8ec;font-size:13px;letter-spacing:2px;font-weight:600;white-space:nowrap}
.back-home{display:inline-flex;align-items:center;gap:6px;color:#e8f4f8;text-decoration:none;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:14px;font-weight:600;line-height:1;
  background:rgba(255,255,255,.08);border:1px solid rgba(126,224,255,.38);
  border-radius:999px;padding:8px 14px;transition:.15s;cursor:pointer}
.back-home:hover{background:rgba(126,224,255,.18);border-color:#7ee0ff;color:#fff}
</style>
</head>
<body>
<nav class="site-bar"><a class="back-home" href="./index.html">← 返回主页</a><span class="site-name">老杨游戏站</span></nav>
<script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const params = {
    count:120000,
    size:0.015,
    radius:8,
    branches:4,
    spin:1.2,
    randomness:0.6,
    randomnessPower:3,
    insideColor:'#ffac5c',
    outsideColor:'#3b68ff'
};

const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(params.count * 3);
const colors = new Float32Array(params.count * 3);
const colorInside = new THREE.Color(params.insideColor);
const colorOutside = new THREE.Color(params.outsideColor);

for(let i=0;i<params.count;i++){
    const i3 = i*3;
    const radius = Math.random() * params.radius;
    const spinAngle = radius * params.spin;
    const branchAngle = (i % params.branches)/params.branches * Math.PI * 2;
    const randomX = Math.pow(Math.random(),params.randomnessPower)*(Math.random()<0.5?1:-1)*params.randomness*radius;
    const randomY = Math.pow(Math.random(),params.randomnessPower)*(Math.random()<0.5?1:-1)*params.randomness*radius;
    const randomZ = Math.pow(Math.random(),params.randomnessPower)*(Math.random()<0.5?1:-1)*params.randomness*radius;
    positions[i3] = Math.cos(branchAngle+spinAngle)*radius + randomX;
    positions[i3+1] = randomY;
    positions[i3+2] = Math.sin(branchAngle+spinAngle)*radius + randomZ;
    const mixedColor = colorInside.clone();
    mixedColor.lerp(colorOutside, radius/params.radius);
    colors[i3] = mixedColor.r;
    colors[i3+1] = mixedColor.g;
    colors[i3+2] = mixedColor.b;
}
geometry.setAttribute('position', new THREE.BufferAttribute(positions,3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors,3));

const material = new THREE.PointsMaterial({
    size:params.size,
    sizeAttenuation:true,
    depthWrite:false,
    blending:THREE.AdditiveBlending,
    vertexColors:true
});
const galaxy = new THREE.Points(geometry, material);
scene.add(galaxy);
camera.position.z = 10;

let mouseX=0, mouseY=0;
window.addEventListener('mousemove',(e)=>{
    mouseX = (e.clientX / window.innerWidth -0.5)*0.5;
    mouseY = (e.clientY / window.innerHeight -0.5)*0.5;
});
let touchStartX=0, touchStartY=0;
window.addEventListener('touchstart',(e)=>{
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
});
window.addEventListener('touchmove',(e)=>{
    e.preventDefault();
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;
    mouseX += dx * 0.0008;
    mouseY += dy * 0.0008;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
},{passive:false});

window.addEventListener('resize',()=>{
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate(){
    requestAnimationFrame(animate);
    galaxy.rotation.y += 0.0012;
    galaxy.rotation.x += mouseY * 0.002;
    galaxy.rotation.z += mouseX * 0.002;
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
